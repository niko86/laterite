# Clean-room AGS4 transfer-format validator.
#
# Implements the AGS4 numbered rules from the published spec
# (reports/AGS 4_1.pdf). NOT derived from python-ags4's LGPL source —
# see ../README.md and each src/rules/*.rs header. Bundled standard
# dictionaries are ©AGS reference data; see data/PROVENANCE.md.

[package]
name = "laterite-ags4-validator"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Clean-room Rust validator for the AGS4 geotechnical transfer format"
license = "MIT"
publish = false

[lib]
name = "laterite_ags4_validator"
path = "src/lib.rs"

[dependencies]
# The phf-projected dictionary (Dictionary/DictVersion/dictionary_dto/…),
# moved out of this crate's own build.rs into a wasm-safe leaf (#475 PR2) so
# non-validator consumers (the DuckDB extension, laterite-ags4-diff) can
# depend on the dictionary without pulling the rest of the rule engine.
laterite-ags4-reference = { path = "../laterite-ags4-reference" }
thiserror = "1"
# Rule 1 risky fix: transliterate any non-ASCII character to a sensible ASCII
# equivalent (µ→"u", °→"deg", ß→"ss", accents→base letter) so a file can be
# folded Rule-1-clean without a corpus-biased hand map. Pure-Rust static table,
# no_std-friendly → rides into wasm too (a modest bundle bump, accepted). Chars
# with no ASCII form (incl. the U+FFFD replacement marker) fall back to "?".
deunicode = "1"
# The shared parse leaf (#168 Phase 2): the validator's `parse` module
# re-exports its types/tokenizer (`pub use`) + wraps parse_bytes/parse_str/
# parse_file* to keep returning ValidatorError (so every consumer is
# unchanged). Pure leaf (encoding_rs + memchr) → engine-purity guard intact.
laterite-ags4-parse = { path = "../laterite-ags4-parse" }
# Rule 8 DT/T validity: pandas-equivalent calendar/clock checking
# (python-ags4 uses pandas.to_datetime). default-features off keeps it
# lean — no clock, no serde; just the Naive parsers. Already in the
# workspace lockfile via ags5db, so no new external surface.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Stage 7b: non-UTF-8 file encodings (cp1252 / latin1 / iso-8859-x) —
# Mozilla's encoding_rs is the standard way to do this in Rust. The
# library handles all WHATWG encodings; we only expose UTF-8 / CP1252 /
# ISO-8859-1 (with the canonical "latin1" alias). default-features
# leaves things minimal; not on the lean-dep guarded list
# (pyo3|polars|walkdir|rayon|ratatui), so the engine-purity guarantee
# is unchanged.
encoding_rs = "0.8"
# serde: deliberate lean/wasm-safe inclusion — derive only, NO serde_json
# (bindings own serialization). derive-only is zero runtime cost and
# compiles clean on wasm32 (the wasm crate already links it). Not on the
# lean-dep guard list (pyo3|polars|walkdir|rayon|ratatui).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Perf guard: bench check_file on the 23 MB workspace fixture. The
# bench skips cleanly when the fixture is absent (it is gitignored
# working space), so CI without it still passes.
criterion = "0.8"
# The cp1252/lossy-decode tests need a real on-disk path (parse_file
# takes &Path) but MUST NOT live in tests/fixtures/ — corpus-qa's
# e2e.rs crawls that dir and asserts hard_error==0, and a non-UTF-8
# fixture would also defeat the whole point of the lossy decode. So
# those tests write a temp file instead. Dev-dep only + already in the
# workspace lockfile via ags4-corpus-qa → the library's lean dep-graph
# guarantee (no walkdir/rayon/ratatui) is untouched.
tempfile = "3"
# serde_json: DEV-ONLY — the findings.rs byte-identity test serializes a
# Finding and asserts the exact JSON string. The engine itself owns no
# serde_json (bindings/CLIs do their own serialization), so the runtime
# lean-dep contract is untouched.
serde_json = "1"
# Property-based tests: the AGS4 field splitter round-trip + field_span
# char-offset stability + the Rule 8 format↔validate inverses. DEV-ONLY;
# proptest's rand pull never reaches the lean runtime dep-graph
# (pyo3|polars|walkdir|rayon|ratatui), so the engine-purity guarantee is
# untouched.
proptest = "1"
# Parser-parity gate (`tests/parse_parity.rs`): assert the validator's `parse`
# agrees structurally with laterite-ags4-core's `ags4_codec` — the parser that
# builds the `.ags.idx` sidecar's byte index. A cert is only coherent if the
# index-builder and the parser `validate()` runs agree. DEV-ONLY: it never reaches
# the validator's lean RUNTIME graph (lean_dep_graph checks `-e normal`).
laterite-ags4-core = { path = "../laterite-ags4-core" }

[[bench]]
name = "validate_large_fixture"
harness = false
