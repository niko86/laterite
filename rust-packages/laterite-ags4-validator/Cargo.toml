# Clean-room AGS4 transfer-format validator.
#
# Implements the AGS4 numbered rules from the published spec
# (reports/AGS 4_1.pdf). NOT derived from python-ags4's LGPL source —
# see ../README.md and each src/rules/*.rs header. Bundled standard
# dictionaries are ©AGS reference data; see data/PROVENANCE.md.

[package]
name = "laterite-ags4-validator"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Clean-room Rust validator for the AGS4 geotechnical transfer format"
license = "MIT"
publish = false

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/build.rs",
    "/data/PROVENANCE.md",
    "/README.md",
]

[lib]
name = "laterite_ags4_validator"
path = "src/lib.rs"

[build-dependencies]
# ENGINE_FINGERPRINT: a build-time SHA-256 over the rule sources + the bundled
# dictionary/catalogue + every in-workspace crate the verdict runs through, so a
# certificate can name the engine that minted it by what that engine ACTUALLY IS,
# not by a hand-bumped CARGO_PKG_VERSION that a rule edit can leave behind.
# Build-only — never linked into the library, so the lean runtime dep-graph
# guarantee (no pyo3/polars/walkdir/rayon/ratatui) holds.
sha2 = "0.11"
# Reads THIS manifest's `[dependencies]` to discover the in-workspace path deps to
# cover (#550) — a hand-written file list is exactly how the fingerprint came to
# miss the crates that decide Rule 8, field boundaries, and the edition tables.
# Build-only, same as sha2. A hand-rolled scan would be smaller but would re-create
# the failure this whole crate is about: a parser that quietly matches less than it
# should, hashing fewer files while still emitting a confident digest.
toml = "1"

[dependencies]
# The phf-projected dictionary (Dictionary/DictVersion/dictionary_dto/…),
# moved out of this crate's own build.rs into a wasm-safe leaf (#475 PR2) so
# non-validator consumers (the DuckDB extension, laterite-ags4-diff) can
# depend on the dictionary without pulling the rest of the rule engine.
laterite-ags4-reference = { workspace = true }
# The AGS type-system leaf: Rule 8 + the fixes engine re-export its numeric
# expected-forms (format_ndp/format_nsf/format_nsci) instead of hand-porting
# them, so the formatter that JUDGES a typed value is the same one that WRITES
# it via ags4_str (#528 — the port agreed but nothing gated it). Costs nothing:
# already in this crate's build graph transitively via laterite-ags4-reference,
# and its only deps are chrono (the same minimal std-only build listed below)
# + serde_json (already linked transitively — see the serde note). Arrow is
# OPTIONAL in that crate and stays off here, so the lean/wasm-safe dep-graph
# guarantee (no pyo3|polars|walkdir|rayon|ratatui) is untouched.
laterite-ags4-types = { workspace = true }
thiserror = "2"
# Rule 1 risky fix: transliterate any non-ASCII character to a sensible ASCII
# equivalent (µ→"u", °→"deg", ß→"ss", accents→base letter) so a file can be
# folded Rule-1-clean without a corpus-biased hand map. Pure-Rust static table,
# no_std-friendly → rides into wasm too (a modest bundle bump, accepted). Chars
# with no ASCII form (incl. the U+FFFD replacement marker) fall back to "?".
deunicode = "1"
# The shared parse leaf (#168 Phase 2): the validator's `parse` module
# re-exports its types/tokenizer (`pub use`) + wraps parse_bytes/parse_str/
# parse_file* to keep returning ValidatorError (so every consumer is
# unchanged). Pure leaf (encoding_rs + memchr) → engine-purity guard intact.
laterite-ags4-parse = { workspace = true }
# Rule 8 DT/T validity: pandas-equivalent calendar/clock checking
# (python-ags4 uses pandas.to_datetime). default-features off keeps it
# lean — no clock, no serde; just the Naive parsers. Already in the
# workspace lockfile via other crates, so no new external surface.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Stage 7b: non-UTF-8 file encodings (cp1252 / latin1 / iso-8859-x) —
# Mozilla's encoding_rs is the standard way to do this in Rust. The
# library handles all WHATWG encodings; we only expose UTF-8 / CP1252 /
# ISO-8859-1 (with the canonical "latin1" alias). default-features
# leaves things minimal; not on the lean-dep guarded list
# (pyo3|polars|walkdir|rayon|ratatui), so the engine-purity guarantee
# is unchanged.
encoding_rs = "0.8"
# serde: deliberate lean/wasm-safe inclusion — derive only, for `Finding`.
serde = { version = "1", features = ["derive"] }
# serde_json: this crate RENDERS its own findings (`findings::findings_json` /
# `findings_ndjson`). It used to be a rule that "bindings/CLIs own
# serialization" and this crate wrote no JSON — but that rule is exactly what
# produced THREE hand-copied renderers (the CLI's render.rs, laterite-py's and
# laterite-node's, synced only by "byte-identical"/"ported verbatim" comments),
# so #530 moved the renderer next to the type it renders and the copies were
# deleted. Costs nothing: serde_json already rode into this crate's build
# transitively via laterite-ags4-reference (#475), which parses its two bundled
# JSON files; it compiles clean on wasm32 and is not on the lean-dep guard list
# (pyo3|polars|walkdir|rayon|ratatui), so the engine-purity guarantee holds.
#
# `preserve_order` is LOAD-BEARING, not a preference: the NDJSON object is built
# `rule`-first and then splices in the serialized Finding body, and the report
# root is `{file, findings}`. Without insertion order, serde_json::Map sorts
# alphabetically and BOTH key orders change — i.e. the rendered bytes change.
# Every consumer (laterite-ags4-check, laterite-py, laterite-node) already
# enables it, so today it arrives by feature unification; declaring it here
# makes the guarantee explicit instead of accidental.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Perf guard: bench check_file on the 23 MB workspace fixture. The
# bench skips cleanly when the fixture is absent (it is gitignored
# working space), so CI without it still passes.
criterion = "0.8"
# The cp1252/lossy-decode tests need a real on-disk path (parse_file
# takes &Path) but MUST NOT live in tests/fixtures/ — corpus-qa's
# e2e.rs crawls that dir and asserts hard_error==0, and a non-UTF-8
# fixture would also defeat the whole point of the lossy decode. So
# those tests write a temp file instead. Dev-dep only + already in the
# workspace lockfile via ags4-corpus-qa → the library's lean dep-graph
# guarantee (no walkdir/rayon/ratatui) is untouched.
tempfile = "3"
# `tests/manifest_deps.rs` re-parses this manifest, and a synthetic PACKAGED one, to
# hold the fingerprint's dependency discovery honest (#158). Same crate build.rs
# already uses; a dev-dep, so the library's lean runtime dep-graph is untouched.
toml = "1"
# (serde_json is a normal dependency now — see the note above — so the
# findings.rs byte-identity tests reach it without a dev-dep entry.)
# Property-based tests: the AGS4 field splitter round-trip + field_span
# char-offset stability + the Rule 8 format↔validate inverses. DEV-ONLY;
# proptest's rand pull never reaches the lean runtime dep-graph
# (pyo3|polars|walkdir|rayon|ratatui), so the engine-purity guarantee is
# untouched.
proptest = "1"
# Parser-parity gate (`tests/parse_parity.rs`): assert the validator's `parse`
# agrees structurally with laterite-ags4-core's `ags4_codec` — the parser that
# builds the `.ags.idx` sidecar's byte index. A cert is only coherent if the
# index-builder and the parser `validate()` runs agree. DEV-ONLY: it never reaches
# the validator's lean RUNTIME graph (lean_dep_graph checks `-e normal`).
laterite-ags4-core = { path = "../laterite-ags4-core" }

[[bench]]
name = "validate"
harness = false

[lints]
workspace = true
