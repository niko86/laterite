# laterite-ags4-excel — AGS4 ↔ XLSX conversion, extracted out of laterite-ags4-core
# (2026-06-18) so the "core" crate stops dragging calamine + rust_xlsxwriter
# (~1.5 MB) into every consumer that never touches Excel (the DuckDB
# extension, ags4-perf).
#
# FLAGGED FOR REWRITE: the current contents are AGS4-specific. Renamed from
# `laterite-excel` on 2026-08-05 (ags-wiki/design/dec-facade-parity.md decision
# 5) because the old name was chosen for a general-purpose library this never
# became, and `-ags4-` marks the engine tier this belongs to. A crates.io name
# cannot be changed after the first publish, so it had to be right before
# phase 6 — see src/lib.rs.

[package]
name = "laterite-ags4-excel"
version = "0.13.1"  # per-crate since #781 — bump via tools/release/bump_crate.py
edition = "2024"
# 1.88, not the workspace's usual 1.85: calamine, rust_xlsxwriter and zip all
# require 1.88, so a lower promise here would send a 1.85 consumer a crate that
# cannot compile. check_msrv.py builds this crate on exactly this floor.
rust-version = "1.88"
description = "AGS4 ↔ XLSX conversion (rough extraction from laterite-ags4-core; slated for rewrite into a general Excel library)"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "excel", "xlsx"]
categories = ["science::geo", "encoding"]
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/README.md",
]

[lib]
name = "laterite_ags4_excel"
path = "src/lib.rs"

[dependencies]
# Sibling deps carry an explicit `version` beside `path` (dec-facade-parity,
# the phase-5/6 reconciliation): cargo strips `path` at publish, so a pin-free
# sibling dep is refused by crates.io outright. `bump_crate.py` rewrites every
# member pin when it moves a crate, so the pins cannot drift by hand.
#
# The AGS4 data parser (read_ags4 / AgsGroup) + the shared CliError. Excel
# sits ABOVE core in the layering: it consumes the parser, never the reverse.
# `default-features = false` drops core's default-on `transport` module (age +
# zstd) — Excel never touches it, and pulling it in dragged `age` → `getrandom`
# into the tree, which blocks the wasm32 build (the browser Excel surface, laterite-dev#359).
# Consumers that DO want transport (laterite-py) enable it on their own core dep;
# cargo feature-unifies it back on for those builds.
laterite-ags4-core = { path = "../laterite-ags4-core", version = "0.15.0", default-features = false }
# The AGS4 writer (write_ags4 / EmitGroup) — imported directly from the
# wasm-safe emit leaf rather than through laterite-ags4-core's ags4_writer shim.
laterite-ags4-emit = { path = "../laterite-ags4-emit", version = "0.18.1" }
# Pure-Rust XLSX I/O (no Python deps): rust_xlsxwriter writes, calamine reads.
rust_xlsxwriter = "0.99"
calamine = "0.36"

[features]
# The browser Excel surface (laterite-dev#359) enables this so rust_xlsxwriter takes its
# clock from `js_sys::Date::now()` instead of `SystemTime::now()`, which traps
# ("unreachable") on wasm32-unknown-unknown when it stamps the workbook's
# creation time. rust_xlsxwriter target-gates the swap (`target_arch = "wasm32"`),
# so the feature is inert on native — but keeping it opt-in means the native
# py/node consumers never compile js-sys / wasm-bindgen.
wasm = ["rust_xlsxwriter/wasm"]

[dev-dependencies]
# The round-trip tests write a workbook to a temp dir and read it back.
tempfile = "3"
# TEST-ONLY authority for the numeric-formatter gate (`formatter_authority`
# module in src/lib.rs). `laterite_ags4_types::ags4_str` is the canonical AGS4
# numeric formatter; excel's `NumericFormat` is a HAND-COPY of the same logic
# (it deps types nowhere at runtime — that copy is why the two can drift). The
# gate imports the real authority so any drift between them is a red test, not a
# silent double-implementation. Dev-only: no runtime coupling, and `laterite-ags4-types`
# is a leaf, so there is no dependency cycle.
laterite-ags4-types = { path = "../laterite-ags4-types", version = "0.12.0" }
# `ags4_str` takes a `serde_json::Value`; the gate builds one with `json!`.
serde_json = "1"

[lints]
workspace = true

# Which release train cuts this crate (#806): the nightly engine cut derives
# bumps for `engine` crates only; `product` crates ride the product trains.
[package.metadata.laterite]
release_tier = "engine"
