# The shared AGS4 parse leaf (#168). One tolerant tokenizer + one source-true
# byte/line/char walk, below BOTH laterite-ags4-core and laterite-ags4-validator
# — so the two historical parsers (core::ags4_codec, validator::parse) converge
# here instead of drifting. FS-free + wasm-clean by construction: it returns raw
# strings (no typing — that stays in laterite-ags4-types), and depends only on
# encoding_rs (the decode front door, moved down from the validator) + memchr
# (newline scan). Additive in Phase 1 — nothing consumes it yet.
[package]
name = "laterite-ags4-parse"
version = "0.11.0"  # per-crate since #781 — bump via tools/release/bump_crate.py
edition = "2024"
rust-version = "1.85"
description = "Shared, source-true AGS4 line/field parser (the convergence leaf)"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "parser", "csv"]
categories = ["science::geo", "parser-implementations", "encoding"]
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/README.md",
]

[dependencies]
encoding_rs = "0.8"
memchr = "2"

[dev-dependencies]
proptest = "1"
# Read-path benches (benches/parse.rs). Same version the validator already
# uses, so no new vendored tree.
criterion = "0.8"

[[bench]]
name = "parse"
harness = false

[features]
default = []

[lints]
workspace = true

# Which release train cuts this crate (#806): the nightly engine cut derives
# bumps for `engine` crates only; `product` crates ride the product trains.
[package.metadata.laterite]
release_tier = "engine"
