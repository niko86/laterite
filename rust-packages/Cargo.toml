# Cargo workspace for the Rust side of laterite.
#
# Members:
#   laterite-ags4-validator    Clean-room Rust AGS4 validator — library only
#                     (lean, wasm-safe leaf). The CLI is `lat-check`.
#   laterite-ags4-check  The `lat-check` CLI front-end for the validator
#                     (owns the comfy-table/indicatif + optional TUI
#                     deps). Depends on the validator library API only.
#   laterite-ags4-wasm         Browser wasm (cdylib) wrapper around the validator
#                     — the engine behind the client-side web app in
#                     web/. Built for wasm32 via wasm-pack, excluded
#                     from the host workspace clippy/test.
#   laterite-types        The AGS type system (canonical types + value
#                     casting) as a wasm-safe leaf — shared by laterite-ags4-core
#                     and laterite-ags4-wasm.
#   laterite-ags4-core         AGS5 dictionary, codecs, registry, and shared
#                     types. No DuckDB dep — kept light so the
#                     base validator wheel doesn't pay for the
#                     AGS5 surface.
#   ags5db            DuckDB-backed `.ags5db` engine (read + write
#                     + the `lat-db` binary).
#   laterite-cliutil       Shared CLI presentation primitives (spinner,
#                     table, colour gate, JSON helpers).
#   laterite-py       PyO3 cdylib exposing the validator engine to
#                     Python (the `laterite` package).
#   laterite-py-ags5  PyO3 cdylib exposing the AGS5 surface
#                     (the `laterite-ags5` companion wheel).
#
# Build everything:  cargo build --workspace --release
# Build just the binary:  cargo build --release --bin lat-db
# Run all tests:  cargo test --workspace --release
[workspace]
resolver = "2"
members = [
    "laterite-types",
    "laterite-ags4-parse",
    "laterite-transport",
    "laterite-ags4-core",
    "laterite-excel",
    "laterite-ags4-emit",
    "laterite-ags4-diff",
    "laterite-ags4-validator",
    "laterite-ags4-check",
    "laterite-ags4-wasm",
    "laterite-cliutil",
    "laterite-py",
    "laterite-node",
]

# Single-sourced crate version: every member inherits this via
# `version.workspace = true`, so the whole engine + the `lat-check` binary
# move in one line. Two-tier scheme: this is the
# internal/engine tier (also stamped by bump-my-version alongside the
# Python wheels — see root pyproject [tool.bumpversion]); the published
# npm `laterite` versions on its own `node-v*` track.
[workspace.package]
version = "0.6.2"

# Release profile lives at the workspace root — cargo only honours
# profile settings declared here and silently ignores them on member
# crates (which is what was emitting a build-time warning).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dev/test profile (CI builds debug — see ci.yml). Default full debug-info on the
# bundled-DuckDB C++ is enormous: it bloats `target/` (the disk pressure that
# evicts the self-hosted runner's cache) and slows linking. `line-tables-only`
# keeps backtraces useful while shedding the bulk — net faster CI + smaller cache.
[profile.dev]
debug = "line-tables-only"
