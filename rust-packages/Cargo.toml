# Cargo workspace for the Rust side of laterite.
#
# The member list below is the SSOT for what builds, and it is deliberately NOT
# summarised in prose here. The summary that used to sit at this spot had rotted
# to the point of being actively misleading: it named nine members when there were
# twenty-five, two of the nine were crates this tree has never contained, and it
# mislabelled `laterite-ags4-core` as belonging to a surface it has nothing to do
# with. Anything duplicating `members` drifts the same way, so read one of these:
#
#   ags-wiki/concepts/crate-map.md               the hand-curated keystone map —
#                                                what each crate is FOR, edges
#                                                omitted for readability.
#   ags-wiki/concepts/crate-dependency-graph.md  the complete machine-derived
#                                                graph, generated from these very
#                                                manifests by
#                                                `tools/gen_crate_graph.py` and
#                                                faithfulness-gated in CI. It
#                                                cannot disagree with this file.
#
# Build everything:      cargo build --workspace --release
# Build the CLI binary:  cargo build --release -p laterite-cli   (produces `lat`;
#                        `tools/build-rust.sh` wraps this and stages dist/lat)
# Run all tests:         cargo test --workspace --release
[workspace]
resolver = "2"
members = [
    "laterite",
    "laterite-ags4-types",
    "laterite-ags4-parse",
    "laterite-ags4-reference",
    "laterite-transport",
    "laterite-ags4-core",
    "laterite-ags4-excel",
    "laterite-ags4-emit",
    "laterite-ags4-diff",
    "laterite-ags4-merge",
    "laterite-ags4-censor",
    "laterite-ags4-validator",
    "laterite-ags4-trust",
    "laterite-cli",
    "laterite-ags4-wasm",
    "laterite-ags4-tokenizer-wasm",
    "laterite-cliutil",
    "laterite-py",
    "laterite-node",
    "laterite-ags4-xcheck",
    "laterite-ags4-parity",
    "laterite-ags4-forge",
    "laterite-ags4-corpus-qa",
    "laterite-ags4-perf",
    "laterite-ags4-compliance",
]

# The ENGINE version. Every member inherits it via `version.workspace = true`,
# so the crates.io tier moves as one set — which is right, because it ships as
# one set.
#
# Stamped by `tools/release/engine-version.toml`, NOT by the root pyproject's
# `[tool.bumpversion]`. Until 2026-08-01 it was the latter, and one number drove
# the engine and every product together. That is how a browser-only patch came to
# bump the wheel: `laterite-ags4-wasm` inherits this line, so shipping it meant
# moving the number every surface shared. Twice — 0.8.1 and 0.8.2 — and PyPI saw
# neither. See `ags-wiki/design/dec-rust-api-crates-io.md`.
#
# Two crates deliberately do NOT inherit it: `laterite` (its own 0.1.x until it
# reaches parity) and `laterite-cli` (the product version, so `lat --version`
# agrees with the wheel's `lat`).
[workspace.package]
version = "0.9.0"
# crates.io bakes metadata into the PUBLISHED VERSION, not into the crate. Adding
# `repository` after a publish fixes future versions only — the pages for the
# version already out there keep no link back to the source, permanently. So it
# has to be right before the first publish rather than after it.
#
# `homepage` is deliberately absent: it would be this same URL, and crates.io
# renders both. `documentation` too — docs.rs is linked automatically.
repository = "https://github.com/niko86/laterite"

# The engine-tier crates, carrying BOTH a path and a version.
#
# `cargo package` refuses a dependency that has no version requirement — "all
# dependencies must have a version requirement specified when packaging" — because
# publishing strips `path` and the version is all that survives to identify the
# dependency. Without these, 7 of the 10 engine-tier crates could not be packaged at
# all, and `check_package_contents.py --verify-buildable` could only ever reach the
# three leaves that depend on nothing.
#
# In THIS workspace the path still wins, so nothing about the local build or the
# resolved graph changes; the version is inert until a publish.
#
# They live in this file rather than inline at the 21 call sites for one reason:
# `tools/release/engine-version.toml` stamps `version = "{current_version}"` in
# `rust-packages/Cargo.toml`, and it rewrites EVERY occurrence in the file, not just
# the first (verified against a dry run — the log reports only the first match, which
# reads misleadingly). So these bump in lockstep with `workspace.package.version`
# above, with no second place to remember. Inline versions would have sat at the old
# number after a release and published crates pinned to a version that no longer
# matched the engine.
#
# Only the crates that are DEPENDED ON are listed; diff, merge and trust are leaves
# of this graph — nothing in the publish set depends on them.
[workspace.dependencies]
# `default-features = false` HERE rather than at the call site, because cargo
# refuses to let a member turn a workspace entry's default features off
# ("`default-features = false` cannot override workspace's `default-features`").
# Correct for its only publish-set consumer: `laterite-ags4-trust` wants the pure
# keychain/registry/codec without the `transport` feature, whose `age` dependency
# pulls getrandom. A future member that wants the default build asks for it by
# name — `{ workspace = true, features = ["transport"] }`.
laterite-ags4-core = { path = "laterite-ags4-core", version = "0.9.0", default-features = false }
laterite-ags4-emit = { path = "laterite-ags4-emit", version = "0.9.0" }
laterite-ags4-parse = { path = "laterite-ags4-parse", version = "0.9.0" }
laterite-ags4-reference = { path = "laterite-ags4-reference", version = "0.9.0" }
laterite-ags4-trust = { path = "laterite-ags4-trust", version = "0.9.0" }
laterite-ags4-types = { path = "laterite-ags4-types", version = "0.9.0" }
laterite-ags4-validator = { path = "laterite-ags4-validator", version = "0.9.0" }
laterite-transport = { path = "laterite-transport", version = "0.9.0" }

# Workspace-wide clippy pedantic (lever 6, chore/clippy-pedantic): every member
# opts in via `[lints] workspace = true` (see each member's Cargo.toml), except
# the two wasm crates CI already excludes from clippy.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Last-resort allows only (each justified). Generated code is allowed at its
# include site (see typed_graph/mod.rs, dict.rs), not here.
similar_names = "allow"              # flags distinct, correct names that merely look alike
unused_self = "allow"               # PyO3 #[pymethods]/trait methods must take &self by contract
struct_excessive_bools = "allow"    # design nudge (bools->enum), not a mechanical fix
fn_params_excessive_bools = "allow" # ditto

# --- Deferred by owner decision (2026-07-19): the fix is a separate effort or a
#     wash, not a code-quality win. Tracked in the PR body; revisit as focused
#     follow-ups. Note cast_possible_truncation is deliberately NOT here — it is
#     audited case-by-case, since a real truncation can hide a bug.
missing_errors_doc = "allow"        # writing # Errors sections is a docs project of its own
missing_panics_doc = "allow"        # ditto (# Panics)
cast_precision_loss = "allow"       # inherent to i64/u64 -> f64; the casts are intentional
cast_sign_loss = "allow"            # intentional signed<->unsigned conversions
cast_possible_wrap = "allow"        # intentional u32 -> i32 etc. where the range is known
too_many_lines = "allow"            # refactoring to a line threshold is risky churn, not correctness
must_use_candidate = "allow"        # #[must_use] on every getter is noise (all real hits were codegen)
return_self_not_must_use = "allow"  # same family as must_use_candidate

# Release profile lives at the workspace root — cargo only honours
# profile settings declared here and silently ignores them on member
# crates (which is what was emitting a build-time warning).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dev/test profile (CI builds debug — see ci.yml). Default full debug-info on the
# bundled-DuckDB C++ is enormous: it bloats `target/` (the disk pressure that
# evicts the self-hosted runner's cache) and slows linking. `line-tables-only`
# keeps backtraces useful while shedding the bulk — net faster CI + smaller cache.
[profile.dev]
debug = "line-tables-only"
