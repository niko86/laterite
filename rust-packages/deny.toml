# cargo-deny — supply-chain policy for the Rust workspace.
#   Run locally:  cd rust-packages && cargo deny check
#   CI gate:      .github/workflows/ci.yml (the `deny` job)
# Advisory data: the RustSec advisory DB.

[advisories]
version = 2
# In v2 every advisory is an error by default — so this gate catches anything
# NEW. The IDs below are acknowledged, documented exceptions (not silent).
ignore = [
    # --- Unmaintained transitive deps; no safe upgrade available, low risk.
    # age 0.10→0.11 swapped proc-macro-error (RUSTSEC-2024-0370) for its fork
    # proc-macro-error2 — which is ALSO unmaintained (RUSTSEC-2026-0173). Still
    # transitive (age → i18n-embed-fl), no safe upgrade, low risk.
    "RUSTSEC-2026-0173", # proc-macro-error2 (via age's i18n-embed-fl)
]

[licenses]
version = 2
# Permissive licenses only. The dual/tri-licensed crates (self_cell, r-efi) are
# satisfied by their permissive option (Apache-2.0 / MIT) — no copyleft is taken.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # wasi / wasm toolchain crates
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions are transitive churn — surface them, don't fail on them.
multiple-versions = "warn"

[sources]
# Crates must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
