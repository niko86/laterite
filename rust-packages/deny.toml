# cargo-deny — supply-chain policy for the Rust workspace.
#   Run locally:  cd rust-packages && cargo deny check
#   CI gate:      .github/workflows/ci.yml (the `deny` job)
# Advisory data: the RustSec advisory DB.

[advisories]
version = 2
# In v2 every advisory is an error by default — so this gate catches anything
# NEW. The IDs below are acknowledged, documented exceptions (not silent).
ignore = [
    # --- Unmaintained transitive deps; no safe upgrade available, low risk.
    # age 0.10→0.11 swapped proc-macro-error (RUSTSEC-2024-0370) for its fork
    # proc-macro-error2 — which is ALSO unmaintained (RUSTSEC-2026-0173). Still
    # transitive (age → i18n-embed-fl), no safe upgrade, low risk.
    "RUSTSEC-2026-0173", # proc-macro-error2 (via age's i18n-embed-fl)
    # Same path (age → i18n-embed-fl → i18n-config): basic-toml only parses
    # age's i18n.toml inside a proc-macro at build time, so it never runs in
    # anything we ship. i18n-config and age are at their latest releases.
    "RUSTSEC-2026-0374", # basic-toml (via age's i18n-embed-fl)
    # --- zip 8 extraction flaws, fixed in zip 9. All three live in
    # ZipArchive::extract / ZipStreamReader::extract (unpacking to disk), which
    # calamine never calls: it reads entries in memory. calamine 0.36 still pins
    # zip ^8.6, so zip 8 stays in the tree. Drop these when calamine moves to 9.
    "RUSTSEC-2026-0367", # zip: SUID/SGID bits kept on extract
    "RUSTSEC-2026-0368", # zip: extract writes symlinks outside the destination
    "RUSTSEC-2026-0369", # zip: extract applies permissions through symlinks
    # --- crypto-bigint 0.5 timing side channels, fixed in 0.7.6. It arrives via
    # age → p256 (directly and through hpke). laterite-transport only ever
    # builds age's scrypt recipient and identity, and refuses a non-scrypt
    # envelope before decrypting, so no P-256 arithmetic runs on its secrets.
    # age 0.12.1, its latest release, requires p256 ^0.13 with no feature to
    # turn it off. Drop this when age moves past it.
    "RUSTSEC-2026-0387", # crypto-bigint (via age's p256)
]

[licenses]
version = 2
# Permissive licenses only. The dual/tri-licensed crates (self_cell, r-efi) are
# satisfied by their permissive option (Apache-2.0 / MIT) — no copyleft is taken.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # wasi / wasm toolchain crates
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Duplicate versions are transitive churn — surface them, don't fail on them.
multiple-versions = "warn"

[sources]
# Crates must come from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
