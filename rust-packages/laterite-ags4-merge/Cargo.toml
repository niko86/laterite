# laterite-ags4-merge — reconcile N AGS4 deliveries of one project into one file.
#
# Reuses the shipped primitives; the only new code is the N-fold reconciliation:
#   - laterite-ags4-parse      — ParsedFile/ParsedGroup/DataRow (the tokenised
#                                rows merge folds over).
#   - laterite-ags4-reference  — keychain::key_heading_names (THE one definition
#                                of row identity, shared with laterite-ags4-diff)
#                                + the union registry + DictVersion.
#   - laterite-ags4-emit       — the byte-faithful writer the merged file is
#                                emitted through (this transitively pulls the
#                                validator, since emit validates its output — so
#                                merge is NOT a reference-only leaf, but stays
#                                wasm-safe, as every one of these deps already is).
#   - laterite-ags4-types           — parse_value, the canonical cast that makes row
#                                reconciliation type-aware (per-side, so files
#                                that typed a column differently still compare).
[package]
name = "laterite-ags4-merge"
version = "0.15.0"  # per-crate since #781 — bump via tools/release/bump_crate.py
edition = "2024"
rust-version = "1.85"
description = "AGS4 merge — reconcile N deliveries into one file (KEY-aware, recency by argument order, DuckDB-free)"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "merge", "combine"]
categories = ["science::geo", "data-structures"]
# Armed 2026-08-04, with laterite-ags4-diff. Same reasoning, plus one specific to
# this crate: what publishes is `merge_parsed`, whose `&[ParsedFile]` shape is
# exactly the one laterite#162 endorses. The TYPED merge surface #162 warns about
# — no provenance typestate, because it forces every document in one merge to
# share a provenance and rules out merging a disk file with bytes off a network —
# is NOT published here and stays free to design.
# See ags-wiki/design/dec-facade-parity.md and dec-ags4-merge-semantics.md.
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/README.md",
]

[lib]
name = "laterite_ags4_merge"
path = "src/lib.rs"

[dependencies]
laterite-ags4-parse = { workspace = true }
laterite-ags4-reference = { workspace = true }
laterite-ags4-emit = { workspace = true }
laterite-ags4-types = { workspace = true }
# MergeWarning / RevisionNote derive Serialize here so their wire shape — the
# `warnings` / `revisions` arrays every `merge --json` prints — has ONE author
# instead of a hand-kept map per launcher binding (#542).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Property tests over generated deliveries: order-independence of the merged KEY
# set + reformatted-idempotence (a re-send with cosmetically-different formatting
# must collapse via TYPED matching, not report spurious revisions). DEV-ONLY —
# proptest's rand pull never reaches the crate's runtime dep-graph.
proptest = "1"

[lints]
workspace = true

# Which release train cuts this crate (#806): the nightly engine cut derives
# bumps for `engine` crates only; `product` crates ride the product trains.
[package.metadata.laterite]
release_tier = "engine"
