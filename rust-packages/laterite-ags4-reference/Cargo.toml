# AGS4 reference-data leaf (laterite-dev#475): the multi-edition dictionary, single-sourced
# from ags_dictionary.json. PR1 carries the UNION registry projection (moved out
# of laterite-ags4-core so consumers that only want the dictionary — the DuckDB
# extension, laterite-ags4-diff — needn't pull the rest of core/validator). The
# per-edition phf projection + the rules catalogue join it in PR2.
#
# A near-leaf: its TWO workspace deps are `laterite-ags4-types` (wasm consumes `keychain`
# for `_id`/`_parent_id`) and `laterite-ags4-parse` (the laterite-dev#568 runtime `.ags` custom-
# dict reader reuses the shared tokenizer — both are wasm-clean sibling leaves, so no
# added wasm weight). It said "a true leaf: no workspace-crate deps" until laterite-dev#557; that
# stopped being true when the types dep landed, and nothing noticed because a manifest
# comment is read by no one and gated by nothing (now `tests/dep_graph.rs` gates it).
# It matters beyond tidiness: laterite-dev#550's engine-fingerprint walk has to RECURSE through
# this crate to reach those leaves, precisely because this is not a leaf.
[package]
name = "laterite-ags4-reference"
version = "0.11.0"  # per-crate since #781 — bump via tools/release/bump_crate.py
edition = "2024"
rust-version = "1.85"
description = "AGS4 reference data: the multi-edition dictionary registry, single-sourced from ags_dictionary.json (a wasm-safe leaf)"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "dictionary", "schema"]
categories = ["science::geo", "data-structures"]
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/build.rs",
    "/data/**",
    "/README.md",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps to_groups_json's keys in declaration order, matching the
# on-disk dictionary + Python's dict-preserving json.dumps (same pin as core).
serde_json = { version = "1", features = ["preserve_order"] }
# Compile-time perfect-hash maps for the bundled standard dictionaries —
# zero startup cost, no runtime parse (moved from the validator, PR2 laterite-dev#475).
# phf does NOT implement PhfHash for tuples, so dict keys are composite
# "GROUP\u{1f}HEADING" strings.
phf = "0.14"
# Content-addressed row keys (keychain.rs, relocated here in the row-identity
# consolidation): SHA-256 over the injective key-chain encoding, then UUIDv8
# from the first 128 bits. RNG-free (uuid v8 from bytes, no `rng` feature), and
# core already ships both crates to wasm, so the leaf stays wasm-clean.
sha2 = "0.11"
uuid = { version = "1", features = ["v8"] }
# `keychain::content_hash` canonicalises each cell through `parse_value` before
# hashing, so a formatting-only re-emit (`1.0` → `1.00`) is not a value change.
# That is the SAME canonicaliser laterite-ags4-merge's revision report and
# laterite-ags4-diff already trust, so "are these two cells equal" has one
# authority rather than three that agree by luck. types is a wasm-safe leaf and
# does NOT depend on this crate, so the edge is cycle-free and keeps the
# reference leaf wasm-clean (wasm consumes keychain for `_id`/`_parent_id`).
# Default features only — the `arrow` feature stays off here.
laterite-ags4-types = { workspace = true }
# The shared tolerant AGS4 tokenizer (#168 leaf) — reused by `dict_read.rs` to read
# a runtime `--dict` custom dictionary from a plain `.ags` file (laterite-dev#568). A wasm-clean
# sibling leaf (`encoding_rs` + `memchr` only), so it adds zero wasm-hostile weight;
# `tests/dep_graph.rs` pins that.
laterite-ags4-parse = { workspace = true }
# The custom-dict API takes a `&'static Encoding` (a `--dict` file may not be UTF-8);
# `encoding_rs` is already in-tree via the parse leaf and is wasm-clean.
encoding_rs = "0.8"

[build-dependencies]
# build.rs projects each edition out of the consolidated union dictionary
# (this leaf's own data/ags_dictionary.json) into phf static tables in
# OUT_DIR/dict_data.rs. Moved from the validator (PR2 laterite-dev#475).
phf_codegen = "0.14"
serde_json = "1"

[dev-dependencies]
# Isolated micro-bench for the keychain hot path (group_row_ids). Dev-only, so it
# never enters the reference leaf's NORMAL dep graph — tests/dep_graph.rs gates
# that (it checks `cargo tree -e normal`).
criterion = "0.8"

[[bench]]
name = "keychain"
harness = false

[lints]
workspace = true
