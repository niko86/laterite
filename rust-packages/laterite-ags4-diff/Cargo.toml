# laterite-ags4-diff — the wasm-safe AGS4 revision-diff core.
#
# A KEY-aware, type-aware comparison of two AGS4 files: rows are matched by a
# group's *dictionary* KEY headings (not line order), and matched cells are
# compared through the canonical type system so formatting-only changes are
# suppressed. Extracted as a leaf so the SAME engine-consistent diff is shared
# by every host — wasm (browser Tools tab), PyO3 (the `laterite` wheel) and the
# `lat` CLI — rather than living only inside `laterite-ags4-wasm`.
#
# Reuses the shipped, well-tested pieces; the only new code is the diff
# orchestration:
#   - laterite-ags4-parse      — the shared parse leaf (ParsedFile/ParsedGroup/
#                                DataRow); rows arrive already tokenised.
#   - laterite-ags4-reference  — the per-edition standard Dictionary (the KEY
#                                headings that drive row matching + the
#                                declared types). Depending on the reference
#                                leaf directly (not the validator) means diff
#                                pulls in dictionary data only, not the rule
#                                engine (laterite-dev#475 follow-up).
#   - laterite-ags4-types           — parse_value, the canonical cast that makes the
#                                cell comparison type-aware ("1.0" == "1.00").
# All three are already dependencies of `laterite-ags4-wasm`, so repointing it
# at this leaf adds no new wasm-hostile weight to the browser bundle.

[package]
name = "laterite-ags4-diff"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "AGS4 revision diff — KEY-aware/type-aware comparison of two files, DuckDB-free + wasm-safe"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "diff", "revision"]
categories = ["science::geo", "data-structures"]
# Armed 2026-08-04. Held back through the first publish so the surface we had to
# stand behind on day one was as small as it could be — that deferral did its job
# and is spent. Published at the engine's existing 0.9.0: a new crate at the
# current number, so no tier moves to admit it. What this costs is not a frozen
# API (crates.io freezes a VERSION, not a surface) but our own gates starting to
# police it — cargo semver-checks and the public-API snapshot turn edits here
# from free in-tree changes into versioned, reviewed acts.
# See ags-wiki/design/dec-facade-parity.md.
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/README.md",
]

[dependencies]
# ParsedFile/ParsedGroup/DataRow — the tokenised rows the diff walks.
laterite-ags4-parse = { workspace = true }
# The per-edition standard Dictionary: KEY headings (row matching) + types.
laterite-ags4-reference = { workspace = true }
# parse_value — the canonical cast that suppresses formatting-only changes.
laterite-ags4-types = { workspace = true }
# RevisionDelta + nested structs serialise to JS/JSON unchanged across hosts.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
