# The user-facing Rust API. Everything else in this workspace is an engine
# crate; this is the one a stranger is expected to depend on.
#
# It carries the PRODUCT number (stamped by `tools/release/bump-version.sh
# product` like the four surface crates), deliberately NOT `version.workspace =
# true` — that line is the unpublished members' number, and inheriting it would
# put this crate back on the engine clock the two-tier split exists to keep it
# off. It sat on its own 0.1.x until it reached parity with the Python and Node
# surfaces (dec-facade-parity phase 8, 2026-09-04), then jumped straight onto
# the product line — the version history on crates.io shows that jump, not a
# gap.
[package]
name = "laterite"
version = "0.12.0"
edition = "2024"
rust-version = "1.85"
description = "Read, validate and write AGS4 — the geotechnical data transfer format"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "validator", "borehole"]
categories = ["science::geo", "parser-implementations", "encoding"]
publish = true

# See laterite#159. `cargo package` ships everything not excluded, and crates.io
# is append-only.
include = [
    "/src/**",
    "/README.md",
]

[dependencies]
laterite-ags4-core = { workspace = true, features = ["transport"] }
laterite-ags4-diff = { workspace = true }
laterite-ags4-emit = { workspace = true }
# Behind the `excel` feature (dec-facade-parity decision 4): a consumer who
# does not enable it never downloads, compiles or locks calamine and
# rust_xlsxwriter — the weight the crate split exists to keep off them.
laterite-ags4-excel = { workspace = true, optional = true }
laterite-ags4-merge = { workspace = true }
laterite-ags4-parse = { workspace = true }
laterite-ags4-reference = { workspace = true }
laterite-ags4-trust = { workspace = true }
laterite-ags4-validator = { workspace = true }
# Only to stamp a certificate's `checked_at`. Already in this crate's tree via
# laterite-ags4-validator, so it is not new weight for anyone; `clock` is the
# one feature needed and the type never reaches a public signature.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# serde_json is an IMPLEMENTATION detail: the emit engine takes cell values as
# `serde_json::Value`. It must never reach a public signature — see the
# `no_third_party_types_in_public_signatures` note in src/lib.rs.
serde_json = "1"

[features]
default = []
# AGS4 ↔ XLSX conversion (`ags4::to_excel` / `ags4::from_excel`). Default-off so
# the XLSX machinery stays out of every build that never touches Excel; both
# facade snapshots exist so the gated surface stays in the API diff either way
# (check_public_api.py, dec-facade-parity decision 4).
excel = ["dep:laterite-ags4-excel"]
# The only escape hatch to the engine crates, and deliberately a FEATURE rather
# than `#[doc(hidden)]`: a feature appears in the consumer's own Cargo.toml, so
# reaching past the facade is a thing they wrote down and can be asked about.
# `#[doc(hidden)]` hides an item from rustdoc and from nobody else.
unstable-engine = []

[dev-dependencies]
# Test-only: the byte-index ambiguity guard is reached by handing `index_bytes`
# a certificate whose index places a group in two sections, which means editing
# certificate JSON. Dev-only, so it never reaches a consumer's dependency graph.
serde_json = "1"

[lints]
workspace = true

# Which release train cuts this crate (#806): `product` — excluded from the
# nightly engine cut. Since parity (dec-facade-parity phase 8, 2026-09-04) it
# rides the product trains at the product number.
[package.metadata.laterite]
release_tier = "product"
