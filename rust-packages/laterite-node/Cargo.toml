# laterite-node — Node-API (napi-rs) bindings for the laterite AGS4 engine.
#
# The Node analog of `laterite-py` (PyO3): a cdylib `.node` addon that
# re-expresses the engine surface — validate / parse → Arrow IPC / emit —
# through `#[napi]` instead of `#[pyclass]`/`#[pyfunction]`. Returns Arrow
# IPC bytes (Buffer) per group, exactly as `laterite-ags4-wasm` already does for the
# browser; the TS `laterite` npm package (packages/laterite-node) layers the
# high-level API on top. Engine crates are all DuckDB-free.
#
# NOT built by `cargo build --workspace` (the cdylib links against Node's
# symbols, resolved at load time, like the PyO3 cdylibs) — built via
# `@napi-rs/cli` (`napi build`), which sets the dynamic-lookup link args.

[package]
name = "laterite-node"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Node-API (napi-rs) bindings exposing the laterite AGS4 engine to Node.js"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `serde-json` lets `parseValue` return a `serde_json::Value` straight across the
# boundary as native JS (number/string/bool/null) — the AGS type system's own
# output shape, no hand-rolled union.
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
# The engine — all DuckDB-free, pure Rust (same crates laterite-py + laterite-ags4-wasm
# wrap). laterite-types `arrow` feature pulls the shared typed-Arrow builder
# (arrow_cols); `arrow` ipc frames each group's batch as an IPC stream Buffer.
laterite-ags4-validator = { path = "../laterite-ags4-validator" }
# The shared parse leaf (#168 Phase 3): text/bytes parse through the leaf
# directly; its `ParseError` → ValidatorError via the Phase-2 `From` bridge so
# the `thrown`/`classify` exit-code map is unchanged. Validator dep stays for
# the FS entry (`parse_file_with_encoding`), rules, and ValidatorError.
laterite-ags4-parse = { path = "../laterite-ags4-parse" }
# The shared revision-diff leaf (#294 Batch E / #4): the KEY-aware, type-aware
# comparison PyO3 + the CLI + wasm already reuse. This wrapper only parses,
# resolves the dictionary edition, and serialises the `RevisionDelta` to JSON.
laterite-ags4-diff = { path = "../laterite-ags4-diff" }
# `merge()` — reconcile N deliveries of one project into one file (KEY-aware,
# argument-order recency, widen-to-X). The same leaf PyO3 + the CLI reuse.
laterite-ags4-merge = { path = "../laterite-ags4-merge" }
laterite-types = { path = "../laterite-types", features = ["arrow"] }
# The shared producer (write_ags4 for byte-faithful emit; emit_ags4 +
# group_from_arrow for the data→AGS4 path) — `arrow` feature for the IPC input.
laterite-ags4-emit = { path = "../laterite-ags4-emit", features = ["arrow"] }
# AGS4 ↔ XLSX converter (#358) — the same crate laterite-py binds for
# to_excel/from_excel. Pure Rust (calamine + rust_xlsxwriter), DuckDB-free.
laterite-excel = { path = "../laterite-excel" }
# The content-addressed keychain (#303): `registry()` + `keychain::group_row_ids`
# so `table_ipc` prepends the `_id`/`_parent_id` columns from the ONE shared id
# maths every surface uses (byte-identical to the .ags5db extension). Pure +
# DuckDB-free; Excel/csv moved out to laterite-excel (2026-06-18), so this is a
# light dep now — sha2 + uuid + the dictionary. `default-features = false` drops
# core's `transport` feature (we bind the leaf directly below), so core pulls
# neither age nor zstd for us.
laterite-ags4-core = { path = "../laterite-ags4-core", default-features = false }
# The certificate trust model — ONE decision about whether a cert may stand in for
# the engine, shared by every surface. This crate used to make that call itself.
laterite-ags4-trust = { path = "../laterite-ags4-trust" }
arrow = { version = "59", default-features = false, features = ["ipc"] }
encoding_rs = "0.8"
# Transport (pack/unpack/lock/unlock) — zstd + age passphrase, the shared
# laterite-transport leaf (#327). One copy of the age/zstd envelope, bound to
# napi in transport_fns.rs; laterite-ags4-core binds the same leaf (behind its
# `transport` feature), so a transport dep bump is one migration, not two. The
# age envelope stays interoperable with the Python side (pyrage).
laterite-transport = { path = "../laterite-transport" }
# `preserve_order` MUST mirror laterite-ags4-validator / laterite-py: the validator's
# `--json`/`--ndjson` insertion order is load-bearing (byte-faithful to the
# `lat` binary), and `Report.toJson()` re-exposes it verbatim.
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
napi-build = "2"
