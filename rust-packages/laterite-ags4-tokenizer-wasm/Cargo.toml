# `laterite-ags4-tokenizer-wasm` — the browser's AGS4 line tokenizer + field
# quoter, as a DEDICATED tiny wasm module (laterite-dev#533, part of the laterite-dev#527 arc).
#
# The browser used to carry its own hand-written tokenizer/quoter
# (`web/src/lib/agsline.ts`). This crate retires that copy: it compiles the
# shared Rust primitives — `laterite_ags4_parse::tokenize_spans` and
# `laterite_ags4_types::quote_field` — to a SEPARATE, minimal wasm so the browser
# drives off the same authority as every other surface, WITHOUT loading the
# 6.9 MB engine wasm (`laterite-ags4-wasm`) on the main thread.
#
# Deps are the two wasm-clean tiny leaves only (parse = encoding_rs + memchr;
# types = chrono-std + serde_json, arrow feature OFF) plus the wasm-bindgen
# glue — so the compiled artifact stays tens-to-low-hundreds of KB. A size gate
# (web/scripts) keeps that promise honest.
#
# Like `laterite-ags4-wasm`, this cdylib expands on the host too (wasm-bindgen
# macros are target-agnostic) but is only BUILT for wasm via wasm-pack; CI
# excludes it from the host workspace lint/test/coverage.

[package]
name = "laterite-ags4-tokenizer-wasm"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Tiny browser wasm: the shared AGS4 line tokenizer + field quoter"
license = "MIT"
publish = false

[lib]
# wasm-pack derives its output filenames from the lib name; the web app imports
# `web/src/wasm-tokenizer/ags4_tokenizer.js` + `ags4_tokenizer_bg.wasm`.
name = "ags4_tokenizer"
crate-type = ["cdylib"]

# Same binaryen-feature allowance as laterite-ags4-wasm: modern Rust/LLVM emits
# bulk-memory + nontrapping-fptoint for wasm32, which wasm-opt must be told to
# accept or the `-O` pass aborts. `-all` enables every (browser-supported) feature.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '-all']

[dependencies]
# tokenize_spans + AgsSpan — the offset-preserving line tokenizer (encoding_rs +
# memchr only; the tables dead-code-eliminate for the &str-only path used here).
laterite-ags4-parse = { path = "../laterite-ags4-parse" }
# quote_field — the shared AGS4 field quoter, beside ags4_str. Default features
# (arrow OFF) keep this a tiny wasm-clean leaf (chrono-std + serde_json).
laterite-ags4-types = { path = "../laterite-ags4-types" }
wasm-bindgen = "0.2"
# The AgsSpan array crosses to JS as `{text,start,end,valueStart,valueEnd}[]`.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
