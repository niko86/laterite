# `lat` — the CLI front-end for the clean-room AGS4 validator.
#
# Split out of `laterite-ags4-validator` so the engine library stays a lean,
# wasm-safe leaf (phf + thiserror + chrono + encoding_rs). All the
# CLI-only deps that can't cross-compile to wasm32 (comfy-table /
# indicatif → console threads+TTY, the optional ratatui/crossterm TUI)
# live here, behind the product binary, not on the library every
# embedder (ags5db, laterite-py, laterite-ags4-wasm) inherits.

[package]
name = "laterite-ags4-check"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "CLI validator for the AGS4 geotechnical transfer format"
license = "MIT"
publish = false
# `src/ags4_check_tui.rs` is a `#[path]` submodule of the binary, NOT
# its own target. Disable bin auto-discovery so cargo doesn't try to
# compile it standalone; the one real binary is declared explicitly.
autobins = false

[[bin]]
name = "lat"
path = "src/main.rs"

[features]
# Default build links NO TUI code or deps — the LLM/automation-facing
# binary is provably unaffected (the `--tui` flag isn't even compiled
# in; it falls into "unknown option → exit 5"). Build the experiment
# with `cargo build --release --features tui`.
default = ["transport", "excel"]
# The pack / unpack / lock / unlock verbs — turn on core's `transport` feature
# (age + zstd) + rpassword for the interactive passphrase prompt. On by default;
# `--no-default-features` gives a lean validate/read/fix/diff/certify/rules build
# with NO age/zstd, exactly as before these verbs existed.
transport = ["laterite-ags4-core/transport", "dep:rpassword"]
# The `excel` verb — AGS4 ↔ XLSX via laterite-excel (calamine + rust_xlsxwriter).
# On by default; those are heavy deps, so `--no-default-features` drops them.
excel = ["dep:laterite-excel"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
# The engine. Depended on via its public library API only — the split
# has zero code-consumer breakage (every call site uses the re-exported
# surface: CheckOptions / DictVersion / Findings / ValidatorError /
# check_file / findings).
laterite-ags4-validator = { path = "../laterite-ags4-validator" }
# `--diff` (#204): parse both files via the shared parse leaf + the
# KEY-aware/type-aware revision delta via the laterite-ags4-diff leaf.
laterite-ags4-parse = { path = "../laterite-ags4-parse" }
laterite-ags4-diff = { path = "../laterite-ags4-diff" }
# `lat merge` — reconcile N deliveries into one file (KEY-aware, argument-order
# recency, widen-to-X). Reuses the same parse/emit/reference leaves.
laterite-ags4-merge = { path = "../laterite-ags4-merge" }
# `--emit-index` (#294 F#10): mint an `.ags.idx` validity certificate after a
# clean check (`Sidecar::assemble`). `default-features = false` drops core's
# `transport` feature, so the CLI does NOT pull age/zstd — only the index +
# registry it needs.
laterite-ags4-core = { path = "../laterite-ags4-core", default-features = false }
# The trust model: `check` (validate, with or without a certificate) and `mint`. The
# binary no longer owns a `try_certified_skip` of its own — that conjunction was one of
# five across the surfaces, and no two agreed.
laterite-ags4-trust = { path = "../laterite-ags4-trust" }
# Timestamp the certificate (`ValidationStamp.checked_at`, RFC-3339). Already in
# the tree via the validator; declared here to stamp the mint directly.
chrono = "0.4"
# Same encoding_rs as the validator so `&'static Encoding` types match
# across the `CheckOptions::encoding` boundary.
encoding_rs = "0.8"
# CLI presentation parity with `ags5db` (laterite-ags5-db/src/output.rs): the
# animated spinner, the aligned UTF8 finding table, rich-style coloured
# JSON — via the shared `laterite-cliutil` crate (single source of truth,
# also used by `ags4-corpus-qa`). It pulls comfy-table/indicatif/
# serde_json + (transitively) crossterm for terminal capability
# detection; none of that touches the validator library now.
laterite-cliutil = { path = "../laterite-cliutil", features = ["clap"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The subcommand parser (#430). Same version the sibling CLIs (ags4-forge /
# ags4-corpus-qa) use; `env` keeps the NO_COLOR-style env wiring available.
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
# Interactive passphrase prompt for `lock` / `unlock` (behind `transport`). We
# NEVER take a --password flag (argv leaks into `ps`/history); the precedence is
# --password-file → $LAT_TRANSPORT_PASSWORD → this TTY prompt.
rpassword = { version = "7", optional = true }
# The `excel` verb — AGS4 ↔ XLSX. Kept behind the `excel` feature so the
# calamine / rust_xlsxwriter deps don't ride into a lean build.
laterite-excel = { path = "../laterite-excel", optional = true }
# Optional, behind the `tui` feature — the interactive findings browser
# (`lat --tui`). crossterm arrives via ratatui::crossterm so the
# backend/event types are version-matched to the linked ratatui.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
