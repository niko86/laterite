# Shared CLI presentation for the workspace's Rust binaries.
#
# Single source of truth for the loading/activity animation, the
# aligned UTF8 table, the colour gate, atomic file writes, and the
# rich-style coloured JSON / output-mode dispatch. Previously these
# were copied verbatim across `laterite-cli` and `ags4-corpus-qa`
# ("copied, not imported" because they lived in bins) — this crate is
# the de-duplication.
#
# Every dependency is ALREADY in rust-packages/Cargo.lock (comfy-table
# + indicatif + serde_json/serde via the validator's bin; clap via
# ags4-corpus-qa), so extracting this adds ZERO new external surface.
# `serde` is the `report` module's only addition (the `Report:
# Serialize` scaffold lifted from ags4-corpus-qa/src/output.rs).
# It pulls NONE of walkdir/rayon/ratatui — the validator library's
# documented lean dep-graph guarantee is unaffected. The `clap`
# ValueEnum derive is feature-gated so `lat` (which hand-parses
# argv) does not pull clap.

[package]
name = "laterite-cliutil"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Shared CLI presentation (spinner, table, colour, JSON) for the AGS4 CLI binaries"
license = "MIT"
publish = false

[features]
default = []
# Derive `clap::ValueEnum` on `OutputMode` (for clap-based CLIs like
# ags4-corpus-qa). Off by default so argv-hand-parsing bins (lat)
# don't link clap.
clap = ["dep:clap"]

[dependencies]
comfy-table = "8"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4.5", features = ["derive"], optional = true }
# Terminal-size query for the multi-line walk display (fit the
# nested-path label to the real width instead of a fixed cap).
# ALREADY in Cargo.lock as an indicatif transitive dep — making the
# edge explicit adds ZERO new external surface; still no
# rayon/walkdir/ratatui.
console = "0.16"

[lints]
workspace = true
