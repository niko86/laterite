# PyO3 binding crate: the Python face of the clean-room AGS4 engine.
#
# This is the ONLY crate in the workspace that links pyo3. It depends
# on `laterite-ags4-validator` (never the reverse) — exactly the wrapper
# pattern `ags4-parity` established — so the validator library's lean
# phf+thiserror+chrono dep-graph guarantee is untouched. The compiled
# cdylib is loaded by Python as `laterite._laterite_native` (see
# packages/laterite/pyproject.toml [tool.maturin]).
#
# Boundary shape (1.0 phase 1): the READ path emits typed Apache Arrow per
# group — Rust builds the RecordBatch (laterite-ags4-types::arrow_cols) and hands it
# over zero-copy as an Arrow PyCapsule via pyo3-arrow, which polars ingests
# pyarrow-free. This is abi3-safe (the Arrow C Data Interface + capsules,
# NOT the pyo3-polars ABI coupling the design doc flagged) so the single
# cp312-abi3 wheel still holds. The compat + dict-resolution paths keep
# carrying plain primitives (string cells), since python-ags4 frames are
# concepts/pyo3-boundary.md (both refreshed in the phase-1 wiki pass).

[package]
name = "laterite-py"
# The PRODUCT version, not the engine's — this crate IS the PyPI `laterite` wheel's native module,
# so it carries the number people install by. Stamped by
# `[tool.bumpversion]` in the umbrella pyproject.toml.
#
# maturin takes the wheel version from `packages/laterite/pyproject.toml`, so a
# divergence here would put a different number in the cdylib than on the wheel
# that contains it.
version = "0.12.0"
edition = "2024"
rust-version = "1.85"
description = "PyO3 bindings exposing the clean-room laterite-ags4-validator engine to Python (laterite)"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "_laterite_native"
# cdylib only: this crate is loaded by CPython, never linked by other
# Rust crates, and has no Rust unit tests (its behaviour is covered by
# packages/laterite/tests against the built extension). cdylib-only
# keeps `cargo test --workspace` from trying to link a test harness
# against an `extension-module` (no-libpython) build.
crate-type = ["cdylib"]

[dependencies]
# Faster allocator for the allocation-bound read hot-path (parse does ~5M
# small allocations for a 25 MB file; see perf-campaign T4-followup). Paired
# with the `#[global_allocator]` in the crate root — only a final artifact
# (binary / cdylib) can set one, so it is declared per-surface, not in a leaf.
#
# PINNED to mimalloc v2 (#294). libmimalloc-sys defaults to v3 from 0.1.47, and
# v3 co-resident with ANOTHER mimalloc in the same process hands out overlapping
# memory: pyarrow bundles its own mimalloc as its default pool, so
# `import pyarrow; import laterite` was enough to corrupt pyarrow's buffers —
# no laterite call required. microsoft/mimalloc#1327 is the co-residency report;
# apache/arrow GH-50428 is the same fault seen from Arrow's side (a pyarrow
# 24.0.0 regression, fixed in pyarrow 25.0.1) and names switching the
# extension's copy to v2 as the fix. Measured here: pyarrow 24.0.0/25.0.0
# corrupt 44 of 50 shapes under v3, 0 of 50 under v2.
#
# Do NOT unpin just because pyarrow >=25.0.1 is fixed: we do not control the
# pyarrow a user installs, and 24.0.0-25.0.0 stay installable forever. That
# reason stands alone, which matters, because the OTHER reason this comment used
# to give was false.
#
# It claimed CPython 3.14 vendors its own mimalloc v3, making it a second
# partner regardless of pyarrow. CPython vendors **v2.1.2** —
# `Include/internal/mimalloc/mimalloc.h`, `MI_MALLOC_VERSION 212`, on both the
# 3.14 branch and main — and v2 only takes the contested macOS TLS slot under
# `MI_MALLOC_OVERRIDE`, which CPython never defines. The fault is v3-vs-v3
# contending for slots 108/109, which v3 made the macOS default for everyone.
# CPython cannot be in that collision. Three mimallocs share the process (ours,
# pyarrow's, CPython's); only two were ever in the fault.
#
# So the pin has one job — keep US off the fixed slot so we cannot collide with
# pyarrow — and it costs nothing to keep: measured on both self-hosted runners,
# v2 and v3 are indistinguishable while the system allocator is 36% (Linux) and
# 53-63% (Windows) slower. See #448.
mimalloc = { version = "0.1", features = ["v2"] }
# TEMPORARY — this branch is #833's measurement vehicle and never merges.
# `mi_collect` for the probe's forced-purge cell: the `mimalloc` crate wraps
# the allocator but does not re-export the collection API (libmimalloc-sys
# puts it behind `extended`). Same version + the v2 feature as the pin above
# resolves to the ONE vendored copy `mimalloc` already links.
libmimalloc-sys = { version = "0.1", features = ["v2", "extended"] }
laterite-ags4-validator = { path = "../laterite-ags4-validator", version = "0.13.0" }
# The shared parse leaf (#168 Phase 3): the binding parses text/bytes through
# the leaf directly (the validator is no longer on the parse hot-path); its
# `ParseError` is converted to ValidatorError via the Phase-2 `From` bridge so
# the exit-code/message map stays byte-identical. The validator dep stays for
# the FS entry (`parse_file_with_encoding`), the rule engine, and ValidatorError.
laterite-ags4-parse = { path = "../laterite-ags4-parse", version = "0.11.0" }
# S3b (release/v0.1.0-prep): pure-string AGS modules from laterite-ags4-core —
# registry, ags_types, transport, ddl, ags4_codec, ags4_writer, error.
# No DuckDB. The DuckDB-bound function module + typed_graph read/write live in
# the separate `laterite-py-ags5` cdylib, which was decoupled to the dormant
# `ags5/` holding folder (#177) — the base wheel ships AGS4-only.
laterite-ags4-core = { path = "../laterite-ags4-core", version = "0.13.1" }
# The certificate trust model — ONE decision about whether a cert may stand in for
# the engine, shared by every surface. This crate used to make that call itself.
laterite-ags4-trust = { path = "../laterite-ags4-trust", version = "0.13.1" }
# AGS4 ↔ XLSX conversion (excel_fns.rs → laterite.compat.AGS4_to_excel /
# excel_to_AGS4). Extracted out of laterite-ags4-core (2026-06-18) so core stops
# carrying calamine + rust_xlsxwriter; laterite-py is its sole consumer.
laterite-ags4-excel = { path = "../laterite-ags4-excel" }
# The shared AGS4 emit orchestrator (typed cells -> valid AGS4 + AutoFix).
# The emit_ags4_from_arrow binding (emit_typed.rs) feeds it Arrow tables
# DuckDB hands over pyarrow-free — the read boundary reversed. The `arrow`
# feature pulls the shared Arrow→Value transpose (group_from_arrow) so the
# native + wasm hosts share one conversion.
laterite-ags4-emit = { path = "../laterite-ags4-emit", version = "0.14.0", features = ["arrow"] }
# The KEY-aware/type-aware revision-diff leaf (#204): `diff_parsed` over two
# parsed files + a Dictionary — the same diff wasm + the CLI use.
laterite-ags4-diff = { path = "../laterite-ags4-diff", version = "0.12.1" }
# `merge()` — reconcile N deliveries of one project into a single file, KEY-aware
# with argument-order recency and widen-to-X. The same leaf `lat merge` uses;
# it pulls parse + emit (emit re-validates its output) but stays wasm-safe.
laterite-ags4-merge = { path = "../laterite-ags4-merge", version = "0.12.1" }
# Direct dep for the shared typed-Arrow column builder (`arrow_cols`, behind
# the `arrow` feature). Phase 1 of the 1.0 redesign emits typed Arrow per
# group on the read path — the SAME emitter the wasm explorer frames as IPC.
laterite-ags4-types = { path = "../laterite-ags4-types", version = "0.12.0", features = ["arrow"] }
# arrow 59 (matching pyo3-arrow 0.18) for the emit *consume* direction:
# read each cell out of the RecordBatch DuckDB streams in. ArrayFormatter
# (default features) is the robust fallback for temporal/decimal columns.
arrow = "59"
# abi3-py312: build against the CPython 3.12 limited API (stable ABI) so ONE
# `cp312-abi3` wheel per platform runs on 3.12+. Feasible *because* the boundary
# carries plain primitives, not pyo3-polars (no per-CPython polars ABI coupling).
# The floor is 3.12, not lower, because the generated #[pyclass(dict)] classes
# need the 3.12 limited API (`dict` isn't exposed below it). Proven on
pyo3 = { version = "0.29", features = ["extension-module", "chrono", "abi3-py312"] }
# Zero-copy Arrow boundary for the read path: wraps the RecordBatch laterite-ags4-types
# builds and hands it to Python as an Arrow PyCapsule (PyTable ->
# __arrow_c_stream__), which polars ingests pyarrow-free. arrow 59 + pyo3 0.29
# match our pins; the capsule protocol is the Arrow C Data Interface (NOT the
# pyo3-polars ABI coupling), so the single cp312-abi3 wheel still holds.
pyo3-arrow = "0.19"
# MUST mirror laterite-ags4-validator's serde_json feature set: the CLI's
# `--json` output is built with `preserve_order` (insertion-ordered
# Map). Byte-faithful CLI JSON parity depends on this matching.
serde_json = { version = "1", features = ["preserve_order"] }
# `chrono` is already transitive via laterite-ags4-core (used by ags_types.rs).
# Naming it explicitly so the `chrono` feature on pyo3 has a matched
# direct dep — that feature gives us IntoPyObject for NaiveDateTime /
# NaiveDate / NaiveTime so `parse_value` returns native Python
# datetime/date/time objects.
chrono = "0.4"
# The compat streaming write (#805): stage to a temp file in the destination's
# directory, rename over it only on success — so a refused cell (embedded
# newline) leaves whatever was at the path untouched.
tempfile = "3"
# Already compiled transitively via laterite-ags4-parse; named as a DIRECT dep so the
# `--dict` overlay helper (laterite-dev#568) can spell `&'static encoding_rs::Encoding` and resolve the
# source encoding once, in the caller, instead of re-resolving the label inside. A direct
# dep costs nothing at build/link time (the crate is already in the tree) — it just lets
# this crate name a type it now legitimately uses. (Revived from the reliquary in laterite-dev#568.)
encoding_rs = "0.8"

# Used only by build.rs (Stage F2b-1 typed-graph codegen): consumes the
# reference leaf's `union` module (union_groups()) to emit OUT_DIR/typed_groups.rs
# — the same union reconstruction the registry/DDL use, so this is no longer a
# third independent reader of ags_dictionary.json (laterite-dev#475 follow-up). No direct
# JSON parsing here any more, so serde_json is no longer a build-dependency.
[build-dependencies]
laterite-ags4-reference = { path = "../laterite-ags4-reference", version = "0.13.0" }

[lints]
workspace = true
