# `laterite-ags4-wasm` — the browser wasm front-end for the clean-room AGS4
# validator (and, in Phase 2, the typed-Arrow parser for the data
# explorer).
#
# A `cdylib` compiled to `wasm32-unknown-unknown` via wasm-pack. It
# depends on `laterite-ags4-validator`'s pure, filesystem-free library API —
# `parse_bytes` + `resolve_dict_version` + `Dictionary::bundled` +
# `rules::run_all(source = None)` — so the entire validator runs
# client-side with nothing uploaded.
#
# NB the workspace's `cargo build/clippy/test --workspace` runs on the
# host; this cdylib compiles there too (wasm-bindgen's macros expand on
# any target), but it is built *for wasm* only via wasm-pack in
# deploy-validator.yml. CI excludes it from the host workspace lint/test
# (see ci.yml `--exclude laterite-ags4-wasm`).

[package]
name = "laterite-ags4-wasm"
# The PRODUCT version, not the engine's — this crate IS the npm `@laterite/ags4-wasm` package,
# so it carries the number people install by. Stamped by
# `[tool.bumpversion]` in the umbrella pyproject.toml.
#
# `wasm-pack` writes the published manifest FROM this line, and release.yml then
# asserts the `wasm-v<tag>` matches it — so on the engine line the first
# product-only release fails its own tag check.
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
description = "Browser wasm wrapper around the clean-room AGS4 validator"
license = "MIT"
# Named explicitly so wasm-pack copies it into `pkg/` — that README is what a
# published wasm package would show, and it documents the constraints (init(),
# bytes-only input, no transport) that don't exist on the native surfaces.
readme = "README.md"
publish = false

[lib]
# Keep the compiled-artifact name `ags4_wasm` even though the package is
# `laterite-ags4-wasm`: wasm-pack derives its output filenames from the lib
# name, and the web app imports them by path (`web/src/wasm/ags4_wasm.js`,
# `ags4_wasm_bg.wasm`). Pinning the lib name keeps the rebrand internal to
# Cargo — the browser bundle's import surface is unchanged.
name = "ags4_wasm"
crate-type = ["cdylib"]

# wasm-pack runs `wasm-opt` on the release build, but the binaryen it
# downloads validates against MVP wasm — while modern Rust/LLVM enables
# `bulk-memory` (memory.copy / memory.fill) and `nontrapping-fptoint`
# (i32.trunc_sat_*) by default for wasm32-unknown-unknown. Without
# telling wasm-opt to accept them the optimize pass aborts with
# "Bulk memory operations require bulk memory [--enable-bulk-memory]"
# (and the matching trunc_sat "all used features should be allowed").
# `-all` enables every feature — all are universally browser-supported —
# so `-O` optimization stays on. (Set this to `false` to skip wasm-opt
# entirely if a future binaryen regresses.)
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '-all']

[dependencies]
# The engine — pure-Rust, wasm-safe leaf after the Phase 0 CLI split.
laterite-ags4-validator = { path = "../laterite-ags4-validator" }
# The content-addressed keychain (#303): `registry()` + `keychain::group_row_ids`
# so `arrow_ipc(code, keys=true)` carries the `_id`/`_parent_id` columns from the
# ONE shared id maths every surface uses (byte-identical to the extension + wheel
# + Node). `default-features = false` drops core's `transport` module — its `age`
# pulls getrandom, which won't build on wasm32, and the crypto has no place in a
# browser binary. The keychain itself is RNG-free (sha2 + uuid-v8-from-bytes).
laterite-ags4-core = { path = "../laterite-ags4-core", default-features = false }
# The certificate trust model — ONE decision about whether a cert may stand in for
# the engine, shared by every surface. This crate used to make that call itself.
laterite-ags4-trust = { path = "../laterite-ags4-trust" }
# The shared parse leaf (#168 Phase 3): `parse_bytes` + the parse types +
# `field_span` come straight from the leaf (encoding_rs + memchr only — wasm-safe).
# Its `ParseError` → ValidatorError via the Phase-2 `From` bridge so the
# `classify`/`to_string` error text is unchanged. Validator dep stays for rules.
laterite-ags4-parse = { path = "../laterite-ags4-parse" }
# The shared AGS4 emit orchestrator (`to_ags4`): typed/string cells ->
# valid AGS4 + AutoFix. Same core the native PyO3 binding uses; depends
# only on laterite-ags4-types + laterite-ags4-validator, so it adds no wasm-hostile weight.
# The `arrow` feature pulls the shared Arrow→Value transpose (group_from_arrow)
# for the columnar `to_ags4_ipc` path — the same conversion the native host
# uses, not a copy. arrow's display fallback stays comfy-table-free.
laterite-ags4-emit = { path = "../laterite-ags4-emit", features = ["arrow"] }
# The KEY-aware/type-aware revision diff core (`diff_parsed`), extracted
# out of this crate as a wasm-safe leaf so the same engine-consistent diff
# is shared by wasm + PyO3 + the CLI. Depends only on the parse leaf +
# validator dict + laterite-ags4-types, all already pulled here — no new weight.
laterite-ags4-diff = { path = "../laterite-ags4-diff" }
# `merge()` — reconcile N deliveries into one file (KEY-aware, argument-order
# recency, widen-to-X). Wasm-safe: it pulls only parse + emit + reference, all
# already here — the same leaf PyO3 + Node + the CLI reuse.
laterite-ags4-merge = { path = "../laterite-ags4-merge" }
# `censor()` — the shared AGS4 scrub engine (#581) behind the browser
# Anonymiser, the SAME engine the corpus `censor` tool drives. Wasm-safe: it
# pulls only parse + reference + types, all already here. The leaf takes a
# precomputed content hash (file_id), so this wrapper hashes the bytes itself
# (sha2 + hex — both already in the wasm dep graph via the keychain).
laterite-ags4-censor = { path = "../laterite-ags4-censor" }
# AGS4 ↔ XLSX conversion (#359). Its FS-free `ags4_bytes_to_xlsx` /
# `xlsx_bytes_to_ags4` cores back the browser Excel surface. calamine +
# rust_xlsxwriter (+ zip / flate2 / zopfli) are wasm-clean; laterite-excel takes
# core with `default-features = false`, so `age` / getrandom never enters this
# binary (the same guard this crate applies to its own core dep above). The
# `wasm` feature swaps rust_xlsxwriter's clock to `js_sys::Date::now()` — its
# default `SystemTime::now()` traps on wasm32 when stamping the workbook's
# creation time.
laterite-excel = { path = "../laterite-excel", features = ["wasm"] }
# The AGS type system — SAME canonical_type / parse_value / parse_datetime
# the native DuckDB conversion uses, so the explorer casts identically
# (parity by construction). The `arrow` feature pulls in arrow_cols, the
# shared typed-Arrow column/record-batch builder both hosts emit through —
# so the browser and the native PyCapsule path cast byte-identically.
laterite-ags4-types = { path = "../laterite-ags4-types", features = ["arrow"] }
# Arrow IPC framing only. The typed columns are built by the shared emitter
# in laterite-ags4-types (arrow_cols); here we just StreamWriter that batch into an
# IPC stream for duckdb-wasm (the native side hands the same batch to
# pyo3-arrow as a zero-copy capsule instead). `ipc` pulls StreamWriter + the
# core array/schema/record_batch crates; default-features=false drops
# prettyprint->comfy-table and other host-only weight. v59 matches the
# native pyo3-arrow 0.18 pin so one arrow version serves both hosts.
arrow = { version = "59", default-features = false, features = ["ipc"] }
wasm-bindgen = "0.2"
# js_sys for the `to_ags4_ipc` input: walk the JS array of {code, ipc} and
# pull each `ipc` Uint8Array's bytes (Reflect + Uint8Array::to_vec).
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
# Bulk byte transfer for the options objects' `dictionary` field. Without it a
# `Vec<u8>` routes through serde's `deserialize_seq`, which serde-wasm-bindgen
# services with `js_sys::try_iter` — one boxed JsValue per BYTE. A 1 MB custom
# dictionary becomes ~1M round trips where the positional `Option<Vec<u8>>`
# parameter was a single bulk copy. `deserialize_byte_buf` restores that
# (serde-wasm-bindgen 0.6.5, de.rs: `Uint8Array::to_vec`).
serde_bytes = "0.11"
# parse_value returns a serde_json::Value; parse() matches its variants
# (Number/Bool/String/Null) to fill the typed Arrow column builders.
serde_json = "1"
# Structured report -> JS object (json_compatible: maps->objects,
# None->null, matching the CLI's --json shape).
serde-wasm-bindgen = "0.6"
# Readable panics in the browser console (set once on first call).
console_error_panic_hook = "0.1"
# Same encoding_rs as the validator so `&'static Encoding` types match
# across the parse_bytes boundary; resolves the UI's encoding select.
encoding_rs = "0.8"
# The `censor()` file-hash: PROJ_ID becomes the full 64-hex SHA-256 of the
# input bytes (a KEY field — full width, collision-safe). Same sha2 the
# keychain content-hash already pulls; hex encodes the digest.
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
# Independent datetime oracle for the typed-Arrow parity test: the
# production cast goes through laterite_ags4_types::parse_datetime, the test
# computes the expected epoch-µs instant straight from chrono.
chrono = { version = "0.4", default-features = false, features = ["std"] }
