# laterite-ags4-emit — the wasm-safe AGS4 producer.
#
# Builds valid AGS4 plaintext from typed/string cell data, for BOTH the
# native (PyO3) and browser (wasm) hosts over one shared orchestrator.
# Extracted as a leaf so `laterite-ags4-wasm` can produce AGS4 without depending
# on all of `laterite-ags4-core` (which drags age/zstd/calamine/rust_xlsxwriter —
# wasm-hostile). It also lifts the AGS4 *writer* out of the original
# DuckDB-branded core, the first concrete step toward relieving that
# naming/scope smell.
#
# Reuses the shipped, well-tested pieces so the only new code is the
# orchestrator:
#   - laterite-ags4-types::ags4_str — typed value -> AGS4 string per canonical type
#                            (the inverse of parse_value); wasm-safe leaf.
#   - laterite-ags4-validator       — the per-edition standard dictionary (UNIT/TYPE
#                            fill) + parse + validate + the safe-fix
#                            machinery (AutoFix). Already wasm-safe.
# Both are already dependencies of `laterite-ags4-wasm`, so this leaf adds no new
# wasm-hostile weight to the browser bundle.

[package]
name = "laterite-ags4-emit"
version = "0.14.0"  # per-crate since #781 — bump via tools/release/bump_crate.py
edition = "2024"
rust-version = "1.85"
description = "AGS4 producer — typed data -> valid AGS4 plaintext, DuckDB-free + wasm-safe"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "writer", "serialization"]
categories = ["science::geo", "encoding"]
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/README.md",
]

[dependencies]
# ags4_str (typed -> AGS4 string) + parse_value (string -> typed), the
# exact casting both hosts already share via laterite-ags4-wasm / the native DuckDB path.
laterite-ags4-types = { workspace = true }
# The per-edition standard Dictionary (UNIT/TYPE fill), parse_bytes,
# rules::run_all (validate), and compute_fixes/apply_fixes (AutoFix).
laterite-ags4-validator = { workspace = true }
# NO serde_json here, and that is load-bearing (#790): cells arrive as the
# laterite-ags4-types `Cell` — a scalar enum immune to the `preserve_order`
# feature-unification that swells `Value` workspace-wide. The absence is the
# ratchet: this crate cannot grow a JSON-value hot path back without a
# Cargo.toml diff saying so.
# parse_bytes wants a &'static Encoding; we always emit/re-read UTF-8.
encoding_rs = "0.8"
# Optional: the Arrow→Cell transpose (`arrow_in`), shared by BOTH
# emit hosts — native (laterite-py, off the DuckDB capsule) and wasm
# (laterite-ags4-wasm, off an Arrow IPC stream) — so the conversion lives in one
# place, not copied per host. default-features=false keeps it lean (no
# csv/json/ipc/prettyprint→comfy-table); v59 matches every other arrow pin.
arrow = { version = "59", default-features = false, optional = true }

[dev-dependencies]
# Property tests for the writer's quote-escaping round-trip. Already vendored +
# cargo-deny-cleared (dev-dep of the validator / parse / types crates too).
proptest = "1"
# Write-path benches (benches/emit.rs). Same criterion the validator uses.
criterion = "0.8"
# Allocation-site attribution for examples/heap_profile.rs (profiling use
# only). dhat replaces the global allocator IN THE EXAMPLE BINARY alone — the
# shipped crate and the cdylibs that link it are untouched, and the numbers it
# reports are requested/live bytes, NOT RSS (no allocator retention).
dhat = "0.3"

[[bench]]
name = "emit"
harness = false

# The memory-attribution harness. Needs `arrow` because the
# whole point is entering the pipeline at the same seam the PyO3 host does —
# `group_from_arrow` — so the typed-vs-string cell split is the real one.
[[example]]
name = "heap_profile"
required-features = ["arrow"]

[features]
# Typed-Arrow input support (the `arrow_in` transpose). Off by default so
# JSON-only consumers don't pull arrow.
arrow = ["dep:arrow"]

[lints]
workspace = true

# Which release train cuts this crate (#806): the nightly engine cut derives
# bumps for `engine` crates only; `product` crates ride the product trains.
[package.metadata.laterite]
release_tier = "engine"
