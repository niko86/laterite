# laterite-ags4-core — DuckDB-free pure-string AGS modules.
#
# Extracted from the original DuckDB-backed engine crate (S3a of
# release/v0.1.0-prep). Carries the
# registry / canonical-types / DDL emitter / AGS4 codec / Excel I/O /
# zstd+age transport / common error type — all the modules that don't
# need DuckDB.
#
# Primary shipped consumer:
# - `laterite-py` (the base PyO3 cdylib for `laterite`, AGS4 surface —
#   ships **without** DuckDB so the AGS4 wheel stays light).
#
# A DuckDB-bound crate re-exports these modules for source compat and adds
# its own database-backed surface on top (convert.rs, db.rs, query.rs, etc.);
# it lives outside this workspace and isn't part of the shipped wheel.

[package]
name = "laterite-ags4-core"
version = "0.13.2"  # per-crate since #781 — bump via tools/release/bump_crate.py
edition = "2024"
rust-version = "1.85"
description = "DuckDB-free pure-string core modules for the AGS4 toolchain"
license = "MIT"
repository.workspace = true
keywords = ["ags", "ags4", "geotechnical", "codec", "index"]
categories = ["science::geo", "encoding", "data-structures"]
publish = true

# What `cargo package` may put in the tarball. Explicit because the default is
# "everything not excluded", and crates.io is append-only — a file that rides one
# publish cannot be taken back. See laterite#159.
include = [
    "/src/**",
    "/data/**",
    "/README.md",
]

[dependencies]
# The AGS type system (canonical types + value casting), extracted to a
# wasm-safe leaf so the browser explorer (`laterite-ags4-wasm`) shares the exact
# casting logic. Re-exported as `laterite_ags4_core::ags_types` (see lib.rs).
laterite-ags4-types = { workspace = true }
# The shared parse leaf (#168 Phase 4): the `.ags.idx` byte-offset index
# (index.rs) now sources GROUP record starts from the leaf's source-true byte
# walk instead of the csv reader — the csv index was off-by-one for CRLF and
# absorbed leading blanks (see O-40). Pure leaf (encoding_rs + memchr). Phase 5
# extends this dep to core's read path.
laterite-ags4-parse = { workspace = true }
# The AGS4 dictionary registry (union projection), extracted to its own leaf
# (laterite-dev#475) so dictionary-only consumers needn't pull the rest of core. Re-exported
# as `laterite_ags4_core::registry` (see registry.rs) — an API-preserving move.
laterite-ags4-reference = { workspace = true }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON output keys in insertion order, matching
# Python's dict-preserving json.dumps. Same rationale used elsewhere in the workspace.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# The pack/unpack/lock/unlock envelope, now the shared laterite-transport leaf
# (#327) — one copy of the age/zstd logic instead of two. Behind the default-on
# `transport` feature (see [features]) so wasm-safe consumers can drop it: the
# leaf's `age` dep pulls getrandom, which does NOT build on wasm32. core's
# transport.rs is a thin CliError-returning face over it (mapping
# TransportError→CliError); the age/zstd/rpassword/secrecy direct deps left with
# the logic.
laterite-transport = { workspace = true, optional = true }
# The deterministic keychain (keychain.rs) hashes the spec key-chain with
# SHA-256 → UUIDv8. (calamine + rust_xlsxwriter + hex left with excel.rs when
# the Excel I/O moved out to the laterite-ags4-excel crate, 2026-06-18.)
sha2 = "0.11"
# Deterministic content-addressed row keys (keychain.rs): SHA-256 over the
# spec key-chain → UUIDv8. `v8` is RFC 9562's custom/application version —
# the correct choice for app-defined deterministic UUIDs (contrast the
# dormant DuckDB store's random, clock-seeded `v7`, which cannot agree across calls).
uuid = { version = "1", features = ["v8"] }

[features]
# `transport` is default-ON — the host consumers (laterite-py binds pack/unpack/
# lock/unlock) get it transparently. wasm (and any other wasm-safe / size-
# sensitive consumer) takes `default-features = false` to compile just the pure
# keychain / registry / codec: `age` pulls getrandom, which won't build on
# wasm32-unknown-unknown, and the crypto has no place in a browser binary. The
# keychain itself is RNG-free (sha2 + uuid-v8-from-bytes). (#303 Phase 5)
default = ["transport"]
transport = ["dep:laterite-transport"]

[dev-dependencies]
# `ags4_codec.rs` test creates an on-disk fixture (temp dir) to exercise
# the file path + parse cycle. The runtime modules don't take a Path
# dependency; this is test-only.
tempfile = "3"
# Read-codec + index benches (benches/read_index.rs).
criterion = "0.8"

[[bench]]
name = "read_index"
harness = false

[lints]
workspace = true

# Which release train cuts this crate (#806): the nightly engine cut derives
# bumps for `engine` crates only; `product` crates ride the product trains.
[package.metadata.laterite]
release_tier = "engine"
