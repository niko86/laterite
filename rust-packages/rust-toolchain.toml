# Pin the toolchain so the `pedantic = warn` + `-D warnings` clippy gate is
# reproducible. Without a pin, a fresh runner installs whatever `stable` is
# newest, and each clippy release expands lints like `doc_markdown` — so the
# same code passes on one machine and fails on another. Bump deliberately.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
