# laterite-py-ags5 — PyO3 cdylib for the experimental AGS5 surface.
#
# Ships as the `laterite-ags5` PyPI wheel (separate from the base
# `laterite` wheel) and is pulled in by the `laterite[ags5]` extra.
# Bundles DuckDB (~50 MB linked) — that's why it's split out of the
# base wheel. Python code: `packages/laterite-ags5/python/laterite_ags5/`.
#
# Looks up typed-graph classes (`PROJ`, `LOCA`, …) at runtime via
# `py.import("laterite._laterite_native").getattr("PROJ")` rather than
# sharing Rust types across cdylibs — see `typed_graph/read.rs:182`.

[package]
name = "laterite-py-ags5"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Experimental AGS5 (.ags5db) PyO3 bindings for laterite"
license = "MIT"
publish = false

[lib]
name = "_laterite_ags5_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Pure-string AGS modules (registry, ags_types, transport, excel, ddl,
# ags4_codec, ags4_writer, error). Shared with laterite-py.
ags5-core = { path = "../ags5-core" }
# DuckDB-bound modules (convert, db, query, attachments, diff,
# introspect, spec_tables, writer, …) — the conversion engine.
ags5db = { path = "../ags5db" }
# Transitively via ags5db, but named explicitly here so the validator
# crate doesn't need to be a separate dep further up the tree.
ags4-validator = { path = "../ags4-validator" }
# abi3-py312: must match the base wheel's pyo3 so both wheels are one
# `cp312-abi3` per platform (3.12+). Rationale: see laterite-py/Cargo.toml.
pyo3 = { version = "0.28", features = ["extension-module", "chrono", "abi3-py312"] }
# preserve_order must match the base wheel's serde_json feature set
# for any cross-wheel JSON to be byte-faithful.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
# Bundled libduckdb. Matches ags5db's pin so the linker sees one copy.
duckdb = { version = "1.4", features = ["bundled"] }
# Blob hashing for `attach_blobs` (matches ags5db's direct deps).
sha2 = "0.10"
hex = "0.4"
