# laterite-excel — AGS4 ↔ XLSX conversion, extracted out of laterite-ags4-core
# (2026-06-18) so the "core" crate stops dragging calamine + rust_xlsxwriter
# (~1.5 MB) into every consumer that never touches Excel (the DuckDB
# extension, ags4-perf). Sole consumer today: laterite-py
# (the `laterite.compat` AGS4_to_excel / excel_to_AGS4 surface).
#
# FLAGGED FOR REWRITE: the current contents are AGS4-specific; the intent is
# to grow this into a proper general-purpose Excel library. Name chosen for
# that destination — see src/lib.rs.

[package]
name = "laterite-excel"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "AGS4 ↔ XLSX conversion (rough extraction from laterite-ags4-core; slated for rewrite into a general Excel library)"
license = "MIT"
publish = false

[lib]
name = "laterite_excel"
path = "src/lib.rs"

[dependencies]
# The AGS4 data parser (read_ags4 / AgsGroup) + the shared CliError. Excel
# sits ABOVE core in the layering: it consumes the parser, never the reverse.
# `default-features = false` drops core's default-on `transport` module (age +
# zstd) — Excel never touches it, and pulling it in dragged `age` → `getrandom`
# into the tree, which blocks the wasm32 build (the browser Excel surface, #359).
# Consumers that DO want transport (laterite-py) enable it on their own core dep;
# cargo feature-unifies it back on for those builds.
laterite-ags4-core = { path = "../laterite-ags4-core", default-features = false }
# The AGS4 writer (write_ags4 / EmitGroup) — imported directly from the
# wasm-safe emit leaf rather than through laterite-ags4-core's ags4_writer shim.
laterite-ags4-emit = { path = "../laterite-ags4-emit" }
# Pure-Rust XLSX I/O (no Python deps): rust_xlsxwriter writes, calamine reads.
rust_xlsxwriter = "0.96"
calamine = "0.36"

[features]
# The browser Excel surface (#359) enables this so rust_xlsxwriter takes its
# clock from `js_sys::Date::now()` instead of `SystemTime::now()`, which traps
# ("unreachable") on wasm32-unknown-unknown when it stamps the workbook's
# creation time. rust_xlsxwriter target-gates the swap (`target_arch = "wasm32"`),
# so the feature is inert on native — but keeping it opt-in means the native
# py/node consumers never compile js-sys / wasm-bindgen.
wasm = ["rust_xlsxwriter/wasm"]

[dev-dependencies]
# The round-trip tests write a workbook to a temp dir and read it back.
tempfile = "3"
# TEST-ONLY authority for the numeric-formatter gate (`formatter_authority`
# module in src/lib.rs). `laterite_ags4_types::ags4_str` is the canonical AGS4
# numeric formatter; excel's `NumericFormat` is a HAND-COPY of the same logic
# (it deps types nowhere at runtime — that copy is why the two can drift). The
# gate imports the real authority so any drift between them is a red test, not a
# silent double-implementation. Dev-only: no runtime coupling, and `laterite-ags4-types`
# is a leaf, so there is no dependency cycle.
laterite-ags4-types = { path = "../laterite-ags4-types" }
# `ags4_str` takes a `serde_json::Value`; the gate builds one with `json!`.
serde_json = "1"

[lints]
workspace = true
