[project]
name = "laterite-ags5"
version = "0.4.0"
description = "Experimental AGS5 (.ags5db) surface for laterite — DuckDB-backed read/write/query"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "niko86", email = "me@niko86.com" }]
keywords = [
    "ags",
    "ags5",
    "geotechnical",
    "ground-investigation",
    "duckdb",
    "rust",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# laterite itself owns the 92 typed PROJ/LOCA/... `#[pyclass]` codegen
# (lives in the base `_laterite_native` cdylib). This package's PyO3
# read/write fns look those classes up at runtime via
# `py.import("laterite._laterite_native")`, so we hard-require laterite
# at the same major.
dependencies = [
    "laterite>=0.4.0",
    "polars>=1.40.1",
]

[project.urls]
Homepage = "https://github.com/niko86/laterite"
Repository = "https://github.com/niko86/laterite"
Issues = "https://github.com/niko86/laterite/issues"
Changelog = "https://github.com/niko86/laterite/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# Second cdylib in the workspace. It bundles DuckDB (~50 MB linked),
# which is why we split it out of the base laterite wheel.
manifest-path = "../../rust-packages/laterite-py-ags5/Cargo.toml"
python-source = "python"
module-name = "laterite_ags5._laterite_ags5_native"
