[project]
name = "laterite"
version = "0.10.1"
description = "Rust-backed AGS4 reader/writer/validator — a fast, drop-in replacement for python-ags4 with born-typed polars/pandas reads and a lean polars+duckdb base install"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "niko86", email = "me@niko86.com" }]
keywords = [
    "ags",
    "ags4",
    "geotechnical",
    "ground-investigation",
    "validator",
    "parser",
    "rust",
    "polars",
    "pandas",
    "duckdb",
]
classifiers = [
    # The only machine-readable status field the project owns — npm, crates.io
    # and GitHub Releases have no equivalent, so everywhere else the claim is a
    # README line. Beta is a declaration about real-world use, not a test-coverage
    # bar; it retires at the product line's 1.0.0. See docs `reference/support.md`.
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Mandatory runtime deps:
#   polars   — the default frame backend; the read boundary hands Rust-built
#              Arrow over zero-copy (a pyo3-arrow capsule), loaded into DuckDB,
#              and materialised back pyarrow-free into born-typed polars frames.
#   duckdb   — the Python-owned in-memory engine: read() loads each group into a
#              born-typed DuckDB table, so ags[code] / ags.sql(...) run real
#              cross-group joins + filter pushdown. NOT bundled in the wheel (the
#              CLI keeps its own); needs no pinned storage version. Floor >=1.4.0
#              (LTS line, in-memory COMPRESS).
# narwhals is GONE — the core returns polars / pandas directly and `compat`
# branches on the native frame; nothing imports narwhals at runtime.
# pyarrow is NOT in the base install NOR the default [compat] extra: the polars
# path uses the Arrow C-stream capsule and the pandas path (core AND compat) goes
# via DuckDB's NumPy `.df()` — both pyarrow-free, object-dtype. pyarrow is an
# OPTIONAL accelerator: `[compat,pyarrow]` (or `[all]` / `[pyarrow]`) adds it,
# which speeds compat's pandas hop a touch and unlocks its Arrow-backed `str`
# dtype (string_dtype='string'), and gives the explicit `pyarrow` backend its
# table. pandas is an optional extra; a python-ags4 install pulls pandas in
# unconditionally, laterite does not.
dependencies = [
    "polars>=1.43.2",
    "duckdb>=1.5.5",
]

[project.urls]
Homepage = "https://github.com/niko86/laterite"
Repository = "https://github.com/niko86/laterite"
Issues = "https://github.com/niko86/laterite/issues"
Changelog = "https://github.com/niko86/laterite/blob/main/CHANGELOG.md"

# `compat` is the python-ags4 drop-in surface — it defaults to returning
# pandas frames, so `pip install laterite[compat]` is what most callers
# want when porting from python_ags4. `set_backend("polars")` (or
# LATERITE_COMPAT_BACKEND=polars) removes the pandas requirement entirely.
[project.optional-dependencies]
# compat (the python-ags4 drop-in, pandas by default) is pyarrow-FREE: its
# AGS4_to_dataframe reads a Rust-built all-Utf8 Arrow table (no per-cell boxing)
# and hands pandas an object-dtype frame via DuckDB's NumPy `.df()` — already
# ~3x faster than python-ags4. Adding pyarrow (`[compat,pyarrow]` or `[all]`)
# swaps that hop for pyarrow's `to_pandas` (a touch faster) and unlocks pandas'
# Arrow-backed `str` dtype (`string_dtype="string"`, the pandas-3 baseline), so
# pyarrow is an opt-in accelerator, never required for the drop-in.
compat = ["pandas<3"]
pyarrow = ["pyarrow>=25.0.0"]
all = ["pandas<3", "pyarrow>=25.0.0"]

[project.scripts]
# `lat` — the Python face of the same CLI, byte-faithful to the Rust `lat`
# binary (same subcommands, --json/--ndjson shape, exit codes). Reachable via
# `uv tool install laterite` / `uvx --from laterite lat …` too.
lat = "laterite._cli:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# The compiled extension is built from the sibling Rust crate; the pure
# Python package lives under python/ (src-layout, maturin "mixed" mode).
manifest-path = "../../rust-packages/laterite-py/Cargo.toml"
python-source = "python"
module-name = "laterite._laterite_native"
# abi3 (cp312-abi3): laterite-py/Cargo.toml sets `abi3-py312` on pyo3, so
# maturin emits ONE `cp312-abi3` wheel per platform that runs on Python 3.12+.
# (The old "pinned to 3.14 / pyo3-polars couples the wheel" note was wrong — the
