[project]
name = "laterite"
version = "0.6.1"
description = "Rust-backed AGS4 reader/writer/validator — a fast, drop-in replacement for python-ags4 with born-typed polars/pandas reads (pyarrow-free)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "niko86", email = "me@niko86.com" }]
keywords = [
    "ags",
    "ags4",
    "geotechnical",
    "ground-investigation",
    "validator",
    "parser",
    "rust",
    "polars",
    "pandas",
    "duckdb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Mandatory runtime deps:
#   polars   — the default frame backend; the read boundary hands Rust-built
#              Arrow over zero-copy (a pyo3-arrow capsule), loaded into DuckDB,
#              and materialised back pyarrow-free into born-typed polars frames.
#   duckdb   — the Python-owned in-memory engine: read() loads each group into a
#              born-typed DuckDB table, so ags[code] / ags.sql(...) run real
#              cross-group joins + filter pushdown. NOT bundled in the wheel (the
#              CLI keeps its own); needs no pinned storage version. Floor >=1.4.0
#              (LTS line, in-memory COMPRESS).
# narwhals is GONE — the core returns polars / pandas directly and `compat`
# branches on the native frame; nothing imports narwhals at runtime.
# pyarrow is NOT a laterite dependency anywhere — not base, not the [compat] extra.
# The polars path uses the Arrow C-stream capsule; the pandas path (core AND compat)
# uses DuckDB's NumPy `.df()`; both are pyarrow-free. An Arrow table is only reachable
# via `ags.connection` (or the explicit `pyarrow` backend/extra) with the user's own
# pyarrow. pandas is an optional extra; a python-ags4 install pulls pandas in
# unconditionally, laterite does not.
dependencies = [
    "polars>=1.40.1",
    "duckdb>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/niko86/laterite"
Repository = "https://github.com/niko86/laterite"
Issues = "https://github.com/niko86/laterite/issues"
Changelog = "https://github.com/niko86/laterite/blob/main/CHANGELOG.md"

# `compat` is the python-ags4 drop-in surface — it defaults to returning
# pandas frames, so `pip install laterite[compat]` is what most callers
# want when porting from python_ags4. `set_backend("polars")` (or
# LATERITE_COMPAT_BACKEND=polars) removes the pandas requirement entirely.
[project.optional-dependencies]
# compat (the python-ags4 drop-in, pandas by default) is now pyarrow-free: its pandas
# output goes polars -> pandas via DuckDB's NumPy `.df()` (the same trick the core
# uses), so the extra is just pandas. `pyarrow` stays for callers who explicitly want
# the Arrow backend (the only thing that pulls pyarrow).
compat = ["pandas<3"]
pyarrow = ["pyarrow>=24.0.0"]
# The experimental DuckDB-backed `.ags5db` surface was decoupled from the
# shipped AGS4 product (#177) — it now lives in the dormant `ags5/` holding
# folder and is no longer installable as an extra. The future AGS5 strand
# will publish it as a separate library.
all = ["pandas<3", "pyarrow>=24.0.0"]

[project.scripts]
# Deliberately named `lat-check` (not `laterite`/`ags4`) so the command,
# its flags, JSON/NDJSON shape and exit codes are byte-faithful to the
# Rust `lat-check` binary. This is the Python face of the same CLI.
lat-check = "laterite._cli:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# The compiled extension is built from the sibling Rust crate; the pure
# Python package lives under python/ (src-layout, maturin "mixed" mode).
manifest-path = "../../rust-packages/laterite-py/Cargo.toml"
python-source = "python"
module-name = "laterite._laterite_native"
# abi3 (cp312-abi3): laterite-py/Cargo.toml sets `abi3-py312` on pyo3, so
# maturin emits ONE `cp312-abi3` wheel per platform that runs on Python 3.12+.
# (The old "pinned to 3.14 / pyo3-polars couples the wheel" note was wrong — the
