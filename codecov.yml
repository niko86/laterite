# Codecov config — consumed only on the PUBLIC repo (niko86/laterite), where CI
# uploads per-language coverage under the rust / python / node / web / wasm
# flags. The private repo never uploads (the upload steps are guarded to
# `github.repository == 'niko86/laterite'`), so this file is inert there.
#
# Coverage here is REPORTED, not gated. The real floors are enforced in CI:
#   * Rust   — cargo llvm-cov --fail-under-lines 93   (.github/workflows/nightly.yml)
#   * wasm   — cargo llvm-cov --fail-under-lines 89   (.github/workflows/nightly.yml)
#   * Python — pytest --cov-fail-under=95             (.github/workflows/ci.yml)
#   * Node   — vitest thresholds {lines 98, branches 91} (laterite-node/vitest.config.ts)
#   * Web    — vitest thresholds {lines 99, branches 95} (web/vitest.config.ts)
# So Codecov's own statuses are INFORMATIONAL — they annotate PRs, never block.
#
# The floors above are DELIBERATELY below the badges, and by different margins:
# they are ratchets sized to each lane's normal fluctuation, not targets. Read
# the badge for where a language actually is.
#
# Note the two measures disagree on purpose. lcov's own "line %" counts a line
# whose branch is half-taken as HIT; Codecov counts it as a PARTIAL, so the badge
# is the stricter number and the one the 95% goal means. A lane gated on lines
# alone cannot see that gap at all — which is exactly how web's badge drifted ten
# points under its own floor before the branch thresholds were added.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Per-language flags. Each CI job uploads under one flag, so the dashboard +
# badges break down by language. carryforward keeps a flag's last value when a PR
# didn't run that job (e.g. a web-only PR doesn't re-run rust/python coverage).
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: rust
    - name: python
    - name: node
    - name: web
    # The browser engine. Its denominator is ONE crate measured on the host, and
    # ~127 of its uncovered lines are wasm-bindgen marshalling that `cargo test`
    # cannot call — so this flag sits below the others by construction, not by
    # neglect. See ags-wiki/concepts/coverage-campaign.md.
    - name: wasm

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
