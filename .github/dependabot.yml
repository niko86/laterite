# Keep our dependencies + the GitHub Actions we depend on current — at a MONTHLY
# cadence. The weekly sweep opened nine PRs in one evening (2026-09-07), and full
# CI times nine is exactly the churn a batching config exists to avoid; security
# updates still arrive promptly, outside both the schedule and the cooldown.
#
# Each CODE ecosystem groups its MINOR + PATCH updates into one PR and its MAJOR
# updates into a SECOND — so a breaking bump can't drag the routine batch red
# (which is exactly what sank the first cargo/npm grouped-everything PRs). Majors
# used to open one PR each; November 2026 brought eight PRs from one monthly run,
# so they now share a PR, and one bad major can hold up only the other majors.
#
# No PR rebases itself when main moves (`rebase-strategy: disabled`). Each
# rebase re-ran full CI on the shared runner pool, so a single merge to main
# set every open dependency PR running at once. Comment `@dependabot rebase` on
# the one about to be merged instead.
# The 0.x caveat, ecosystem-split and both halves observed here: CARGO counts a
# 0.x minor-position bump (zstd 0.13 → 0.14, #960) as MAJOR — solo PR, 30-day
# cooldown — matching cargo's own caret semantics. NPM does NOT: a 0.x minor
# rides the minor/patch group on the 7-day default (eslint-plugin-solid
# 0.16 → 0.17 arrived inside the group twice, #961/#968), so a breaking-by-
# convention npm 0.x dep gets no major treatment and a bad one needs an
# `ignore` below. Actions stay fully grouped (they rarely break). Once
# third-party actions are SHA-pinned, Dependabot bumps the pinned SHA with the
# human-readable version.
#
# Cooldown: a release must age before we take it — 30 days for a major (let the
# ecosystem find a new major's regressions first; vitest 5.0.0 reached us the
# week it shipped), 7 days for the rest (the yanked-next-day and
# compromised-tarball classes are usually caught within days). uv supports only
# the flat default, so every uv bump waits 7 days regardless of size.
#
# Fallout a dependency PR does not fix itself. Each of these went red in CI on a
# bot PR (#1187, #1189, #1191). The fix is a commit pushed to the PR's branch:
#   * `@napi-rs/cli` regenerates `rust-packages/laterite-node/index.js`, which
#     the `node` job's drift check holds.
#   * `lucide-static` writes its version into each icon's licence line:
#     `npm run sync-assets` in web/ and commit the icons (`check:sync-assets`,
#     which needs a clean tree).
#   * An eslint plugin bump can orphan `eslint-disable` directives, which fail
#     `--max-warnings 0`.
#   * A pushed commit leaves the bot's changelog waiver (`check_changelog.py
#     --actor`, which covers version moves only). A maintainer labels the PR
#     `no-changelog` or the commit adds an entry.
# A dep raising its minimum Rust past the crates' `rust-version` fails
# `tools/check_msrv.py`. Either ignore it below or raise the floor.
version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]

  # Rust crates — the workspace under rust-packages/.
  - package-ecosystem: cargo
    directory: /rust-packages
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: build
    rebase-strategy: disabled
    groups:
      # laterite-py hands arrow data to Python through pyo3-arrow, and each
      # pyo3-arrow release pins one arrow major and one pyo3 minor (numpy follows
      # pyo3). Proposed apart, every one of them fails to build; arrow 60 did,
      # twice (#1180, #1190). Listed first so these match before the groups below.
      pyo3-arrow:
        patterns: ["pyo3", "pyo3-*", "arrow", "arrow-*", "numpy"]
      cargo:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]

  # Python deps — the uv workspace (pyproject.toml + uv.lock at the repo root).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    rebase-strategy: disabled
    groups:
      python:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  # npm packages — the Node addon + the SolidJS web frontend.
  - package-ecosystem: npm
    directories:
      - /rust-packages/laterite-node
      - /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: build
    rebase-strategy: disabled
    groups:
      # vitest and @vitest/coverage-v8 are peers pinned to the same version —
      # bumped separately, `npm ci` fails ERESOLVE on BOTH PRs by construction
      # (#963–#966 were the four unresolvable halves of one upgrade). Their
      # majors travel together or not at all; minors already share the npm group.
      vitest-major:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
      npm:
        update-types: ["minor", "patch"]
      # Every other major. Listed after vitest-major so those still match first.
      npm-major:
        update-types: ["major"]
