# The M1 cross-OS go/no-go probe (#833).
#
# WHY this exists: #831 proved the compat read's per-group Arrow release is
# real at the allocator level but invisible to peak RSS on the darwin ledger
# machine (madvise-based returns never leave residency there). Most real
# users run hosted Linux or Windows, where the purge primitives genuinely
# decommit — so the landing decision is measured on those OSes, via
# tools/perf_probe_m1.py, instead of argued from darwin. The results are a
# THIRD labelled claim family (campaign rule 8): they never share a table
# with the darwin lane or the dhat diagnosis numbers.
#
# Dispatch-only, and dispatched AGAINST A REF: the probe's `purge` cell needs
# a ref carrying the temporary `purge_native_heap` hook (#831 has the 12-line
# diff), and the `released` cell measures the fix loop-equivalently without
# landing it — so main's own code never needs to change for a measurement.
#
#   gh workflow run perf-probe.yml --ref main -f ref=<probe-branch>
#
# Runner choice (#833, grilled 2026-08-31): Linux on the self-hosted pool —
# its 8 GB container cap admits the read children (~3.5 GB at the 265 MB
# rung), and peak memory, unlike timing, is robust to shared hardware.
# Windows on GitHub-hosted windows-2022, the only Windows with a proven
# toolchain recipe here (release.yml's wheel leg); the self-hosted Windows
# VM stays release-only by runner discipline.
name: perf-probe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ref to measure (a probe branch with the purge hook, or main)"
        default: "main"
      rungs:
        description: "comma-separated fixture rungs"
        default: "25MB,265MB"

permissions:
  contents: read

# One probe at a time: two concurrent probes on the pool would share the
# container's 8 GB cap and measure each other.
concurrency:
  group: perf-probe
  cancel-in-progress: false

jobs:
  probe-linux:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 45
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold so the maturin + forge compiles hit the shared cache.
      - uses: ./.github/actions/build-accel

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # The abi3 floor interpreter, same reasoning as ci.yml's wheel-smoke
      # (self-hosted runners can't use actions/setup-python).
      - name: Install Python 3.12 via uv
        run: uv python install 3.12

      - name: uv sync (build backend into the venv)
        run: uv sync

      - name: Build the release wheel
        run: (cd packages/laterite && uv run --no-sync maturin build --release --out "$GITHUB_WORKSPACE/dist")

      - name: Build forge (fixture generator)
        run: (cd rust-packages && cargo build --release -p laterite-ags4-forge)

      # The SHIPPED dep shape: wheel + pandas<3, NO pyarrow — the probe
      # records which hop ran and the verdict is only meaningful on the
      # pyarrow-free default (`pip install laterite[compat]`).
      - name: Probe venv (shipped [compat] shape)
        run: |
          set -euxo pipefail
          uv venv --python 3.12 --clear "$GITHUB_WORKSPACE/.probe"
          uv pip install --python "$GITHUB_WORKSPACE/.probe/bin/python" "$GITHUB_WORKSPACE"/dist/laterite-*.whl "pandas<3"

      - name: Run the probe
        run: '"$GITHUB_WORKSPACE/.probe/bin/python" tools/perf_probe_m1.py --rungs "${{ inputs.rungs }}" --out output/perf-probe/linux.json'

      # if: always() — a failed probe's partial JSON is the diagnosis; the
      # first drift-guard failure uploaded nothing and left only a log line.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: perf-probe-linux
          path: output/perf-probe/

  probe-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # PowerShell 5.1 with a per-step ExecutionPolicy bypass, exactly the
      # release.yml Windows-leg pattern (see its comments for the why).
      - name: Install Python 3.12 (Windows)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          uv python install 3.12
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      - name: Setup Rust (Windows)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version

      - name: Install maturin (uv pip path — see release.yml for why not the action)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          uv tool install maturin
          maturin --version

      - name: Build the release wheel (Windows, direct)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: packages/laterite
        run: |
          $py = uv python find 3.12
          maturin build --release -i "$py" --out ../../dist

      - name: Build forge (fixture generator)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: rust-packages
        run: cargo build --release -p laterite-ags4-forge

      - name: Probe venv (shipped [compat] shape)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          uv venv --python 3.12 --clear .probe
          $wheel = (Get-ChildItem dist\laterite-*.whl | Select-Object -First 1).FullName
          uv pip install --python .probe\Scripts\python.exe "$wheel" "pandas<3"

      - name: Run the probe
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          .probe\Scripts\python.exe tools\perf_probe_m1.py --rungs "${{ inputs.rungs }}" --out output/perf-probe/windows.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: perf-probe-windows
          path: output/perf-probe/
