# Release workflow: fires on a `v*` tag.
#
# Three jobs:
#   build-wheels   — matrix over (linux x64, macos arm64, windows x64).
#                    Builds the laterite wheel via maturin, plus a source
#                    distribution once on the Linux leg (so unsupported
#                    platforms `pip install` from source — #175).
#   build-binaries — same matrix; builds the `lat` Rust CLI binary.
#   github-release — collects every artefact + cuts a GitHub release.
#   pypi-publish   — the base `laterite` wheels + the sdist. (The experimental
#                    laterite-ags5 companion was decoupled to the dormant
#                    `ags5/` holding folder in #177 — no longer built or
#                    published; the existing PyPI release stays as-is.)
#
# Free-tier note: matrix parallel keeps wall-clock under ~25 min.
# `fail-fast: false` so one OS failing doesn't block the others —
# we'd rather ship 4/5 wheels than 0/5 on a stragger.

name: release

# Least-privilege default: read-only for any job that doesn't declare its own
# `permissions:`, so a future job added here can't silently inherit a broad
# token (the other workflows already set a top-level default; this was the last
# one without one). The build jobs (build-wheels/binaries/node) need only this
# (checkout); the publish jobs escalate explicitly at the job level —
# github-release: `contents: write`, pypi/npm-publish: `id-token: write`.
permissions:
  contents: read

on:
  push:
    # `v*` drives the Python release (wheels + binaries + PyPI); `node-v*` drives
    # the npm release (build-node + npm-publish) independently; `wasm-v*` drives
    # the browser package (build-wasm + wasm-publish). Each job is gated to its
    # own prefix below, so a `node-v0.1.0` tag never builds wheels and a
    # `v0.3.0` tag never publishes to npm.
    #
    # The build jobs are written as EXCLUSIONS ("everything except the other
    # release trains"), not as a positive `v*` test — so adding a tag prefix
    # here without also excluding it below silently enrols it in the Python
    # release. `build-wheels`/`build-binaries`/`github-release` guard only on
    # `!node-v`, which a `wasm-v0.8.1` push satisfies; without the matching
    # `!wasm-v` added to each, a browser tag would build wheels and cut a
    # GitHub release. Keep the two lists in step.
    tags: ["v*", "node-v*", "wasm-v*"]
  # Publishing a GitHub Release on a NEW tag fires BOTH a `push` (tag) event AND
  # a `release` event. Creating the release from the UI / `gh release create` is
  # how a release is cut (no persistent local clone of the public mirror) — and
  # that path DOES fire `push` (the new tag), so `push` alone covers every cut.
  # ALL build/publish jobs are therefore push/dispatch-gated (an explicit
  # `github.event_name != 'release'` guard, Python and node alike): the `push`
  # run builds + publishes, the `release` run is a no-op. This avoids both the
  # node double-publish (jobs used to run on either event) and the push↔release
  # concurrency cancel that the event-aware concurrency key also guards against
  # (laterite#264). The `release` trigger is kept only so a maintainer who
  # publishes a release on an ALREADY-existing tag still gets a (no-op) run
  # rather than silent nothing; dropping it entirely is a possible follow-up.
  release:
    types: [published]
  # Manual trigger for workflow-debug runs — no tag history pollution.
  # `dry_run: true` (default) builds wheels + binaries but skips the
  # github-release + pypi-publish jobs so we don't create draft
  # releases on every shakedown attempt. Real releases still tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artefacts only; skip github-release + pypi-publish"
        type: boolean
        default: true
      republish_tag:
        description: "Republish wheels from an existing release tag (e.g. 'v0.1.0'). Skips build."
        type: string
        default: ""

# Dedup concurrent runs of the SAME event on the SAME ref (the manual
# workflow_dispatch path). `github.event_name` is part of the key ON PURPOSE:
# publishing a release on a NEW tag fires BOTH a `push` (tag) event and a
# `release` event with the SAME `github.ref`. Keying on ref alone put them in
# one group, so `cancel-in-progress` killed the wheel-building `push` run the
# instant the (no-op) `release` run started — and nothing reached PyPI (the
# v0.5.1 cut hit exactly this; laterite#264). Including the event keeps the
# two in separate groups so the build runs to completion. (Distinct tags
# already have distinct refs, so they never shared a group anyway.)
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: wheels (${{ matrix.target }})
    # Skip the build matrix on a workflow_dispatch republish run —
    # republishing pulls existing wheels from a prior release. Also skip on a
    # `node-v*` tag and on any `release` event (Python releases come via `v*`
    # tag pushes / dispatch, never the Releases UI).
    if: inputs.republish_tag == '' && !startsWith(github.ref, 'refs/tags/node-v') && !startsWith(github.ref, 'refs/tags/wasm-v') && github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    env:
      # macOS Tart VM has CommandLineTools, not full Xcode. Set both:
      #   - DEVELOPER_DIR so xcrun resolves to CLT
      #   - SDKROOT so cc/clang finds standard headers (string.h etc.)
      # cc on macOS auto-detects the SDK only if SDKROOT is set or
      # xcrun is invoked — bare `cc` invocations from cc-rs (the cc
      # build helper used by zstd-sys, ring, etc.) skip xcrun, so
      # SDKROOT is the load-bearing one. Belt-and-braces with the
      # host-side `sudo xcode-select -s /Library/Developer/CommandLineTools`.
      # Both vars are ignored on Linux / Windows.
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
    strategy:
      fail-fast: false
      matrix:
        # Only `x86_64-apple-darwin` (Intel Mac, macos-13 runner)
        # excluded for the rc cycle — those runners stall queued for
        # an hour+ on the free tier, blocking github-release.
        # `aarch64-apple-darwin` (Apple Silicon, macos-latest) is the
        # realistic mac target and allocates fine. Intel mac restored
        # for v0.1.0 GA.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # aarch64-linux dropped from the wheel matrix at the
          # self-hosted cutover: no local ARM-Linux runner (Mac runs
          # ARM macOS via Tart, Proxmox is x86_64), and the previously
          # used GitHub-hosted ubuntu-24.04-arm became a billing
          # dependency we wanted to remove. v0.1.0 still has an ARM
          # Linux wheel on PyPI; future ARM Linux users on newer
          # versions install from source (`pip install laterite` falls
          # back to the sdist). Revisit if PyPI download stats show
          # meaningful ARM Linux usage — at that point a Docker runner
          # on the Mac (native ARM) is the cleanest provisioning path.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tag <-> version guard: the wheel version comes from the STATIC pyproject
      # [project] version, not from the tag — so a `vX` tag against a stale
      # pyproject would ship a mislabeled (or PyPI-rejected) wheel. Fail fast if
      # they disagree. Bump with `bump-my-version` BEFORE tagging (RELEASING.md).
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pp=packages/laterite/pyproject.toml
          ver=$(grep -m1 -E '^version = ' "$pp" | sed -E 's/version = "(.*)"/\1/')
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag != $pp version $ver — run bump-my-version before tagging (RELEASING.md)"; exit 1; }
          echo "tag v$tag matches the laterite pyproject version."

      # Both wheels are abi3-py312: maturin emits ONE `cp312-abi3` wheel per
      # platform that runs on Python 3.12+ (requires-python = ">=3.12"). The
      # boundary uses plain primitives, not pyo3-polars, so there's no per-
      # cpython ABI coupling — building under 3.14 (below) still yields the
      # 3.12-limited-API wheel.
      # Self-hosted runners can't use actions/setup-python: Python 3.14
      # isn't in the action's tool-cache repo yet, and the Docker
      # Linux runner doesn't expose a writable tools directory anyway.
      # uv is the consistent path across all three runner types (Linux
      # Docker, macOS Tart, Windows VM) and resolves Python 3.14 from
      # the official python-build-standalone distribution.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Split the Python install into per-shell steps so we don't
      # depend on bash being on PATH for the Windows runner service.
      # Each step exports the uv-managed python3.14 location to
      # GITHUB_PATH so maturin's `-i python3.14` resolves correctly.
      - name: Install Python 3.14 (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uv python install 3.14
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Python 3.14 (Windows)
        if: runner.os == 'Windows'
        # `powershell` = Windows PowerShell 5.1 (built-in on Win11).
        # `pwsh` = PowerShell 7+ (Core), not pre-installed; we'd have
        # to install it via winget. PS 5.1 has Add-Content and the
        # other cmdlets we need, so stick with the built-in shell.
        # Bypass ExecutionPolicy=Restricted (the Win11 default), which
        # otherwise blocks script execution and dies before any of our
        # cmdlets run. Per-step bypass — no system-wide policy change.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          uv python install 3.14
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.local\bin"

      # The Linux Docker runner has no Rust toolchain pre-installed.
      # macOS Tart and Windows VM both do (rustup installed during
      # provisioning), but adding the action everywhere is harmless
      # and keeps the matrix uniform. On Windows the action wraps
      # bash internally, so split per OS like the other steps.
      - if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — required when hash-pinned
          targets: ${{ matrix.target }}

      - if: runner.os == 'Windows'
        name: Setup Rust (Windows, powershell-native)
        # Bypass ExecutionPolicy=Restricted (the Win11 default), which
        # otherwise blocks script execution and dies before any of our
        # cmdlets run. Per-step bypass — no system-wide policy change.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add ${{ matrix.target }}
          rustc --version

      # maturin needs both the Cargo.toml (for the Rust crate it
      # links) and the pyproject.toml (for `[tool.maturin]` +
      # `[build-system]`). When invoked from the repo root it picks
      # up the workspace umbrella pyproject.toml, which has no
      # build-system block. Setting `working-directory` to each
      # package dir means maturin reads that package's pyproject.toml
      # (which carries the manifest-path back to the Rust crate).
      # On Linux + macOS, use the maturin-action wrapper. It handles
      # download/extract of the maturin binary and is the canonical
      # PyO3 path. On Windows the action's "Install maturin" step
      # uses PowerShell 5.1's Expand-Archive, which rejects archives
      # without a .zip extension — but the action saves maturin's
      # download to an extensionless tempfile. PS 7 doesn't have
      # this quirk; we'd need to install pwsh on the runner VM.
      # Cleaner workaround: bypass the action on Windows and call
      # maturin directly via uv-pip-installed binary.
      - if: runner.os != 'Windows'
        name: Build laterite wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          working-directory: packages/laterite
          args: --release -i python3.14 --out ../../dist
          # sccache off: the macOS Tart VM's CLT Python installs
          # sccache to ~/Library/Python/3.9/bin which isn't on PATH,
          # so maturin-action can't find the executable it just
          # installed. Persistent runner disks mean cargo's target
          # dir already amortises rebuild cost; sccache is redundant.
          sccache: "false"
          # manylinux: off for Linux targets — when the Linux runner
          # is a Docker container with docker.sock mounted, the
          # manylinux child container's bind mounts dereference to
          # the host filesystem (not the runner container's), so the
          # entrypoint script path doesn't resolve. Wheels build with
          # the linux_x86_64 tag; the pypi-publish + pypi-republish
          # jobs re-tag as manylinux2014 before upload. On macOS and
          # Windows this input is ignored.
          manylinux: "off"

      # Source distribution — built ONCE (it's platform-independent) on the
      # Linux leg, so a `pip install laterite` on a platform without a published
      # wheel (e.g. ARM Linux, dropped from the matrix at the self-hosted
      # cutover) builds from source instead of failing. The sdist vendors all
      # six path-dep crates (validator/core/emit/excel/types/py) — verified
      # buildable + installable in an isolated venv (#175). Lands in dist/ →
      # uploaded with this leg's wheels artifact → filtered into the PyPI upload
      # and attached to the GitHub release alongside the wheels.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        name: Build sdist (once, platform-independent)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          working-directory: packages/laterite
          args: --out ../../dist

      - if: runner.os == 'Windows'
        name: Install maturin (Windows, uv pip path)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          uv tool install maturin
          # uv tool install puts maturin in %USERPROFILE%\.local\bin
          # which is already on GITHUB_PATH from the Python step.
          maturin --version

      - if: runner.os == 'Windows'
        name: Build laterite wheel (Windows, direct)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        working-directory: packages/laterite
        # `python3.14` isn't on PATH on Windows: uv on Windows doesn't
        # create the ~/.local/bin/python3.14 symlink it does on Unix.
        # Resolve the absolute path via `uv python find` and pass to
        # maturin's `-i` so it can introspect the right interpreter.
        run: |
          $py = uv python find 3.14
          maturin build --release -i "$py" --out ../../dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

  build-binaries:
    name: binaries (${{ matrix.target }})
    # Python CLI binaries — skip on republish, on a `node-v*` (npm) tag, and on
    # any `release` event.
    if: inputs.republish_tag == '' && !startsWith(github.ref, 'refs/tags/node-v') && !startsWith(github.ref, 'refs/tags/wasm-v') && github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Only Intel mac (macos-13) excluded — see build-wheels.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain is a bash-shell action; it works on
      # Linux (Docker container has bash) and macOS (Tart VM has bash)
      # but fails on the Windows runner ("bash: command not found")
      # because the runner service's PATH doesn't include Git Bash.
      # Use the pre-installed rustup (winget-installed) on Windows.
      - if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — required when hash-pinned
          targets: ${{ matrix.target }}

      - if: runner.os == 'Windows'
        name: Setup Rust (Windows, pwsh-native)
        # Bypass ExecutionPolicy=Restricted (the Win11 default), which
        # otherwise blocks script execution and dies before any of our
        # cmdlets run. Per-step bypass — no system-wide policy change.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add ${{ matrix.target }}
          rustc --version
          cargo --version

      - if: runner.os != 'Windows'
        name: Build CLI binary (Linux / macOS)
        working-directory: rust-packages
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p laterite-ags4-check

      - if: runner.os == 'Windows'
        name: Build CLI binary (Windows)
        working-directory: rust-packages
        # Same ExecutionPolicy bypass as the other Windows steps —
        # the default shell on Windows runners hits Restricted policy.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          cargo build --release --target ${{ matrix.target }} -p laterite-ags4-check

      # Bundle step: bash for Linux/macOS, pwsh for Windows. The
      # archive format differs (tar.gz vs zip) and we no longer want
      # to depend on bash being on PATH for the Windows runner.
      - if: runner.os != 'Windows'
        name: Bundle binaries (Linux / macOS)
        shell: bash
        run: |
          mkdir -p out
          cp rust-packages/target/${{ matrix.target }}/release/lat${{ matrix.ext }} out/
          tar -czf laterite-binaries-${{ matrix.target }}.tar.gz -C out .

      - if: runner.os == 'Windows'
        name: Bundle binaries (Windows)
        # Bypass ExecutionPolicy=Restricted (the Win11 default), which
        # otherwise blocks script execution and dies before any of our
        # cmdlets run. Per-step bypass — no system-wide policy change.
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item "rust-packages\target\${{ matrix.target }}\release\lat${{ matrix.ext }}" out\
          Compress-Archive -Path out\* -DestinationPath "laterite-binaries-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.target }}
          path: |
            laterite-binaries-*.tar.gz
            laterite-binaries-*.zip

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build-wheels, build-binaries]
    # Skip on:
    #   - workflow_dispatch dry_run (the default for shakedowns)
    #   - workflow_dispatch republish (the existing release already exists)
    # Always run on tag push.
    # A GitHub release is the Python artefacts' home — skip on a `node-v*` tag
    # (npm-publish ships to the registry with `--skip-gh-release`) and on any
    # `release` event (a published release must not recurse into building one).
    if: (github.event_name == 'push' || (inputs.dry_run != true && inputs.republish_tag == '')) && !startsWith(github.ref, 'refs/tags/node-v') && !startsWith(github.ref, 'refs/tags/wasm-v') && github.event_name != 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artefacts/
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          # rc/dev tags (PEP 440 canonical, no hyphen) → flagged pre-release so
          # they don't surface as "Latest"; final vX.Y.Z → full release.
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            artefacts/*.whl
            artefacts/*.tar.gz
            artefacts/*.zip

  # Pre-publish gate (#554): install-and-import the EXACT built wheel BEFORE it can
  # reach PyPI, so a wheel that compiles but doesn't import (a broken cdylib, a
  # renamed console script, a bad [project.scripts]) can never be published. The
  # per-PR ci.yml `wheel-smoke` job proves the mechanism on every change; this
  # proves the artefact actually being shipped, and `pypi-publish` gates on it.
  # abi3-py312 forward-compat is checked across the 3.12/3.13/3.14 floor using the
  # Linux wheel — the representative artefact (mac/win wheels ride the same abi3
  # mechanism and are proven to BUILD by the matrix; a per-platform install test
  # would need the self-hosted mac/win runners and is not what the floor claim
  # rests on). uv fetches the interpreters; the wheel installs by path.
  verify-wheel:
    name: verify wheel (install + import)
    runs-on: ubuntu-latest
    needs: build-wheels
    steps:
      # The committed post-install smoke (tools/wheel_smoke.py) at the tagged ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-x86_64-unknown-linux-gnu # the Linux wheel + sdist
          path: dist/

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install Python 3.12 / 3.13 / 3.14 via uv
        run: uv python install 3.12 3.13 3.14

      # Fresh isolated venv per interpreter; install the built wheel BY PATH and
      # prove the console script resolves (`lat --help`, exit 0 — the script has no
      # --version) and the library imports + validates (tools/wheel_smoke.py).
      - name: Install-and-import the built wheel on 3.12 / 3.13 / 3.14
        run: |
          set -euxo pipefail
          wheel=$(echo dist/laterite-*.whl)
          for v in 3.12 3.13 3.14; do
            venv=".verify-$v"
            uv venv --python "$v" --clear "$venv"
            uv pip install --python "$venv/bin/python" "$wheel"
            "$venv/bin/lat" --help >/dev/null
            "$venv/bin/python" --version
            "$venv/bin/python" tools/wheel_smoke.py
          done

  pypi-publish:
    # Trusted-publishing flow (no API token). The PyPI trusted publisher
    # is configured against this repo + this workflow + the `pypi`
    # environment; first release on a tag uploads under the pending
    # publisher, subsequent releases reuse it.
    #
    # Publishes the base `laterite` wheel. (The experimental `laterite-ags5`
    # companion was decoupled to the dormant `ags5/` holding folder in #177, so
    # it is no longer built or published; the existing PyPI release stays as-is.)
    # Trusted publisher = this repo + this workflow + the `pypi` env; the OIDC
    # token from the `pypi` env uploads via PyPI's publisher. See RELEASING.md.
    #
    # Three-layer publish gate (Pro-tier private repo: env reviewers
    # aren't available, so guards are layered at the workflow + env
    # levels instead):
    #
    # 1. **Workflow-level** (this `if:`): only push events on tags
    #    matching `v*` that are FINAL (no rc/dev pre-release suffix)
    #    reach this job. Excludes manual `workflow_dispatch` runs,
    #    branch pushes, and pre-release tags (e.g. v0.2.0rc1 / v0.2.0dev1,
    #    PEP 440 canonical — no hyphen, per RELEASING.md) — those build +
    #    cut a GitHub pre-release but skip the PyPI publish.
    # 2. **Environment-level** (`environment: pypi`'s
    #    `deployment_branch_policy`): the `pypi` env only allows
    #    deployments from refs matching the `v*` tag pattern,
    #    enforced by GitHub regardless of workflow logic.
    # 3. **PyPI-side** (trusted publisher): PyPI validates the
    #    `github.com/niko86/laterite` repo + this workflow + the
    #    `pypi` env via OIDC. A misconfigured publisher or wrong
    #    repo is rejected upstream.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')
    name: pypi (laterite)
    runs-on: ubuntu-latest
    # verify-wheel gates the publish: the exact built wheel must install-and-import
    # on the 3.12/3.13/3.14 floor before it can reach PyPI (#554).
    needs: [build-wheels, verify-wheel]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
          merge-multiple: true

      - name: Filter to the laterite wheel + sdist
        run: |
          mkdir -p pypi/
          mv dist/laterite-*.whl pypi/ || true            # base AGS4 wheels (per platform)
          mv dist/laterite-[0-9]*.tar.gz pypi/ || true    # the source dist (built once, Linux leg).
          #   [0-9] anchors the version digit so this matches `laterite-<ver>.tar.gz`
          #   but NOT the CLI bundle `laterite-binaries-*.tar.gz` (twine rejects it).
          ls -la pypi/

      # The Linux wheel jobs use `manylinux: off` to dodge the
      # docker-in-docker bind-mount issue on the Portainer runner.
      # Wheels are tagged `linux_x86_64` which PyPI rejects (it
      # requires `manylinux_*`). Re-tag as manylinux2014 — the build
      # was on a glibc 2.39+ system but laterite only uses basic
      # glibc symbols, so manylinux2014 (glibc 2.17+) is a defensible
      # practical claim. Same retag also lives in pypi-republish.
      # The proper fix (a real manylinux Docker build) is the v0.x.y+ TODO.
      - name: Re-tag Linux wheels as manylinux2014 (PyPI compatibility)
        run: |
          pip install --quiet wheel
          cd pypi/
          for whl in laterite-*-linux_x86_64.whl; do
            [ -e "$whl" ] || continue
            python -m wheel tags --platform-tag manylinux2014_x86_64 --remove "$whl"
          done
          echo "After re-tag:"
          ls -la

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: pypi/

  pypi-republish:
    # Manual publish path: download wheels from an existing GitHub
    # release tag and upload to PyPI via the same trusted-publisher
    # flow. Used when a prior release-workflow run built artefacts
    # but skipped pypi-publish (e.g. a stale `if: false` on the
    # job) — avoids a full rebuild.
    #
    # Trusted publishing on PyPI is pinned to this workflow file
    # (`release.yml`) + the `pypi` environment, so adding a job
    # here (rather than a separate workflow file) keeps the OIDC
    # claim valid. Dispatch:
    #
    #     gh workflow run release.yml \
    #         -f republish_tag=v0.1.0 --repo niko86/laterite
    #
    # Skips when `republish_tag` is empty (default) — no impact on
    # tag-push releases or dry-run dispatches.
    name: pypi-republish (from existing release)
    if: github.event_name == 'workflow_dispatch' && inputs.republish_tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download laterite wheels from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pypi/
          gh release download "${{ inputs.republish_tag }}" \
            -R "${{ github.repository }}" \
            -p 'laterite-*.whl' \
            -p 'laterite-[0-9]*.tar.gz' \
            -D pypi/
          #   [0-9] anchors the version digit: the `laterite-<ver>.tar.gz` sdist,
          #   not the CLI bundle `laterite-binaries-*.tar.gz` also on the release.
          # Mirrors pypi-publish's filter step: the base `laterite` wheels + sdist.
          ls -la pypi/

      # Stop-gap re-tag: v0.1.0's release-workflow used `manylinux: off`
      # for the Linux wheel jobs (working-around the maturin-action
      # docker-cwd bug), which produces wheels tagged `linux_*`. PyPI
      # refuses those — it requires manylinux tags. The wheels were
      # built on Ubuntu 24.04 (glibc 2.39) but the laterite Rust + PyO3
      # surface only uses basic glibc symbols, so tagging as
      # manylinux2014 (glibc 2.17+) is a defensible practical claim.
      # Proper fix is a manylinux Docker build for v0.1.1+; this step
      # exists so v0.1.0 can ship without rebuilding.
      - name: Re-tag Linux wheels as manylinux2014 (PyPI compatibility)
        run: |
          pip install --quiet wheel
          cd pypi/
          for whl in laterite-*-linux_x86_64.whl; do
            [ -e "$whl" ] || continue
            python -m wheel tags --platform-tag manylinux2014_x86_64 --remove "$whl"
          done
          # aarch64-linux dropped from the wheel matrix at the
          # self-hosted cutover — no retag loop for it.
          echo "After re-tag:"
          ls -la

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: pypi/

  # ── laterite-node (npm) ──────────────────────────────────────────────
  #
  # Per-platform `.node` build (same 3-runner matrix as the wheels/binaries),
  # then a single publish job that assembles + publishes the `laterite` npm
  # package + its `@laterite/native-*` platform packages. Dormant until a final
  # `v*` tag — and gated additionally on owner-side npm setup (see
  # RELEASING-node.md): the `@laterite` org + per-package trusted
  # publishers. The job won't function until that's done; it harms nothing
  # before (the tag gate keeps it from running on PRs/branches).
  build-node:
    name: node (${{ matrix.target }})
    # The npm release rides its OWN tag namespace (`node-v*`), independent of the
    # Python `v*` tags — so build-node + npm-publish only run for `node-v*`.
    # Push-gated (like the Python jobs): a node release on a NEW tag fires BOTH a
    # `push` and a `release` event, and node's jobs used to run on EITHER — so the
    # tag built + published twice (the second npm publish failing on the duplicate
    # version). A new tag always fires `push` (incl. via `gh release create` / the
    # Releases UI), so `push` alone covers every cut; skipping `release` drops the
    # redundant run (laterite#264).
    # `workflow_dispatch` is allowed in so `npm-verify` below can rehearse the
    # packaging checks without cutting a tag. It builds only; publishing stays
    # tag-driven and lives in a separate job.
    if: (startsWith(github.ref, 'refs/tags/node-v') || github.event_name == 'workflow_dispatch') && github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-packages/laterite-node
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same per-OS toolchain split as build-binaries: dtolnay's bash action on
      # Linux/macOS; rustup directly on Windows (no Git Bash on PATH there).
      - if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        name: Setup Rust (Windows, pwsh-native)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      # The platform `@laterite/native-*` deps are unpublished optionals (this
      # job is what builds them) → `npm ci` skips them. Then a release napi build
      # for the matrix target. Per-OS shell (Windows runner has no bash on PATH).
      - if: runner.os != 'Windows'
        name: npm ci + napi build (Linux / macOS)
        shell: bash
        run: |
          npm ci
          npx napi build --platform --release --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        name: npm ci + napi build (Windows)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          npm ci
          npx napi build --platform --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-${{ matrix.target }}
          path: rust-packages/laterite-node/*.node

  # Assemble the real packages and run the packaging checks, WITHOUT publishing.
  #
  # This job deliberately has no `environment:`. `npm-publish` below is bound to
  # the `npm` environment, whose deployment_branch_policy allows only `node-v*`
  # refs — so a `workflow_dispatch` rehearsal aimed at that job is rejected
  # before a single step runs, and leaves a failed deployment marker on the repo
  # for good measure. Splitting the checks out means they are reachable on
  # demand, on any ref, while the publish job's ref policy stays exactly as
  # strict as it is: this adds a rehearsal door, NOT a second door to the
  # registry. No secrets are needed here, and none are available.
  #
  # It runs on real tag pushes too, as a fail-fast gate ahead of the environment.
  npm-verify:
    if: >-
      (github.event_name == 'workflow_dispatch'
       || (github.event_name == 'push'
           && startsWith(github.ref, 'refs/tags/node-v')))
      && github.event_name != 'release'
    name: npm packaging checks (no publish)
    runs-on: ubuntu-latest
    needs: build-node
    defaults:
      run:
        working-directory: rust-packages/laterite-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: rust-packages/laterite-node/artifacts
          pattern: node-*
          merge-multiple: true
      - name: Assemble platform packages + dist
        run: |
          npx napi create-npm-dirs
          npx napi artifacts -d artifacts
          npm run build:ts
      - name: Ship the third-party notice with every npm package
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/LICENSE" ./LICENSE
          for d in npm/*/; do cp "$GITHUB_WORKSPACE/LICENSE" "$d/LICENSE"; done
          ls -1 npm/ | sed 's/^/  staged notice for @laterite\/native-/'
      - name: Verify every package would carry the notice
        run: "$GITHUB_WORKSPACE/tools/release/verify-npm-notice.sh"

  npm-publish:
    # Gated EXACTLY like `pypi-publish`:
    #   1. Workflow-level (this `if:`): only FINAL `v*` tag pushes (no rc/dev).
    #   2. Environment-level (`environment: npm`'s deployment_branch_policy):
    #      the `npm` env only allows deployments from `v*` tag refs.
    #   3. npm-side auth: the `NPM_TOKEN` secret for the FIRST release (npm can't
    #      pre-configure a trusted publisher for a not-yet-existing package, so
    #      OIDC alone can't bootstrap the four packages). After they exist + you
    #      add the per-package trusted publishers (RELEASING-node.md), npm uses
    #      OIDC automatically — `id-token` stays on below — and the token can go.
    # Owner npm prerequisites are in RELEASING-node.md.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')
    name: npm (laterite + @laterite/native-*)
    runs-on: ubuntu-latest
    # `npm-verify` is a fail-fast gate: the packaging checks run in a job with no
    # secrets and no environment, so a packaging fault stops the release before
    # the `npm` environment is ever entered.
    needs: [build-node, npm-verify]
    environment: npm
    permissions:
      id-token: write   # OIDC token exchange for npm trusted publishing
      contents: read
    defaults:
      run:
        working-directory: rust-packages/laterite-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships npm 10.
      - name: Upgrade npm (OIDC trusted-publishing support)
        run: npm install -g npm@latest

      - name: npm ci
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#node-v}"   # node-v0.1.0 → 0.1.0
          test "$PKG" = "$TAG" || { echo "tag node-v$TAG != package $PKG"; exit 1; }

      # Pull the three platform `.node`s built above, place them into the
      # per-platform npm dirs, and build the shippable dual ESM/CJS dist.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: rust-packages/laterite-node/artifacts
          pattern: node-*
          merge-multiple: true
      - name: Assemble platform packages + dist
        run: |
          npx napi create-npm-dirs
          npx napi artifacts -d artifacts
          npm run build:ts

      # The ©AGS third-party notice must ride with every package that carries the
      # data. It does: each `.node` embeds the AGS4 dictionary (build.rs + an
      # include_str! put it in the binary), and `napi create-npm-dirs` generates
      # per-platform packages with only package.json + README + the .node. The
      # published 0.7.0 packages therefore shipped verbatim ©AGS text under a bare
      # `"license": "MIT"` with no notice at all — the wheel carried one, npm never
      # did. npm auto-includes a LICENSE file regardless of the `files` array, so
      # placing it is enough. Copied from the root rather than committed per-package
      # so there is exactly one notice to keep true.
      - name: Ship the third-party notice with every npm package
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/LICENSE" ./LICENSE
          for d in npm/*/; do cp "$GITHUB_WORKSPACE/LICENSE" "$d/LICENSE"; done
          ls -1 npm/ | sed 's/^/  staged notice for @laterite\/native-/'

      # The SAME script `npm-verify` runs, invoked again here on purpose: this
      # job re-assembles the packages, so it must verify the artefacts IT is
      # about to publish rather than trusting another job's copies. One file, so
      # the two callers cannot drift.
      - name: Verify every package to be published carries the notice
        run: "$GITHUB_WORKSPACE/tools/release/verify-npm-notice.sh"

      # Publish the platform packages (napi pre-publish: also syncs the main
      # package's optionalDependencies to this version), then the main package.
      # `--provenance` attaches the build provenance attestation.
      #
      # Auth: `NODE_AUTH_TOKEN` (the `NPM_TOKEN` secret) writes the `.npmrc` line.
      # This is what the FIRST release uses, because npm — unlike PyPI — can't
      # configure a trusted publisher for a package that doesn't exist yet. Once
      # the four packages exist and you've added their trusted publishers (see
      # RELEASING-node.md), npm uses OIDC automatically (it prefers the trusted
      # publisher when `id-token` is available) — no workflow change, and you can
      # then delete the token. `--provenance` works either way.
      - name: Publish @laterite/native-* (platform packages)
        run: npm run prepublish:napi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish laterite (main package)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- the browser package: @laterite/ags4-wasm, on its own `wasm-v*` tag -----
  #
  # A separate tag train from `node-v*` so a browser-only fix can ship without
  # moving the Node package. Under today's lockstep versioning both still carry
  # the same number, so the split buys nothing YET — it is the shape #153
  # (per-surface release tagging) needs, built while the plumbing was open.
  #
  # Built ONCE and carried as an artifact: `wasm-verify` and `wasm-publish` both
  # consume the same bytes, so what was checked is what ships. (The npm side
  # re-assembles in each job because its inputs are three per-platform `.node`s
  # from a build matrix; there is only one wasm artefact, so there is no reason
  # to rebuild it and every reason not to.)
  build-wasm:
    name: wasm (browser package)
    if: >-
      (github.event_name == 'workflow_dispatch'
       || (github.event_name == 'push'
           && startsWith(github.ref, 'refs/tags/wasm-v')))
      && github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked

      # `--target web`: the ESM + explicit `init()` shape the crate's README
      # documents and the web app already consumes. Not `bundler` — that output
      # only works under a webpack-style loader, while `web` works there AND
      # from a plain module script.
      - name: wasm-pack build
        run: wasm-pack build rust-packages/laterite-ags4-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/wasm-pkg"

      # Rewrites the wasm-pack manifest to the published name, sets
      # publishConfig.access (scoped packages default to PRIVATE → E402), and
      # stages the ©AGS notice the .wasm's embedded dictionary requires.
      - name: Prepare the publishable package
        run: tools/release/prepare-wasm-package.sh "$GITHUB_WORKSPACE/wasm-pkg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-pkg
          path: wasm-pkg/
          if-no-files-found: error

  # Packaging checks with no environment and no secrets — the rehearsal door.
  # Same split, and same reasoning, as `npm-verify`: `wasm-publish` is bound to
  # the `npm` environment, so a workflow_dispatch aimed at it is rejected before
  # a step runs. This job is reachable on any ref, so the checks can be exercised
  # without a tag; it also runs on real tag pushes as a fail-fast gate ahead of
  # the environment.
  wasm-verify:
    name: wasm packaging checks (no publish)
    if: >-
      (github.event_name == 'workflow_dispatch'
       || (github.event_name == 'push'
           && startsWith(github.ref, 'refs/tags/wasm-v')))
      && github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-pkg
          path: wasm-pkg
      - name: Verify the package carries the ©AGS notice
        run: tools/release/verify-npm-notice.sh "$GITHUB_WORKSPACE/wasm-pkg"
      - name: Verify the published name and access
        run: |
          set -euo pipefail
          NAME=$(node -p "require('$GITHUB_WORKSPACE/wasm-pkg/package.json').name")
          ACCESS=$(node -p "require('$GITHUB_WORKSPACE/wasm-pkg/package.json').publishConfig?.access ?? ''")
          test "$NAME" = "@laterite/ags4-wasm" || { echo "name is $NAME"; exit 1; }
          test "$ACCESS" = "public" || { echo "access is '$ACCESS' — a scoped package without it fails E402"; exit 1; }
          echo "  ok   $NAME (access=$ACCESS)"

  wasm-publish:
    # Gated exactly like `npm-publish`: workflow-level (this `if:`) for FINAL
    # `wasm-v*` tags only, then environment-level via the `npm` env's
    # deployment_branch_policy, which carries a `wasm-v*` tag rule alongside the
    # existing `node-v*` one (added 2026-07-29; RELEASING-wasm.md).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wasm-v') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')
    name: npm (@laterite/ags4-wasm)
    runs-on: ubuntu-latest
    needs: [build-wasm, wasm-verify]
    environment: npm
    permissions:
      id-token: write   # OIDC token exchange for npm trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; node 22 ships npm 10.
      - name: Upgrade npm (OIDC trusted-publishing support)
        run: npm install -g npm@latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-pkg
          path: wasm-pkg

      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          PKG=$(node -p "require('$GITHUB_WORKSPACE/wasm-pkg/package.json').version")
          TAG="${GITHUB_REF_NAME#wasm-v}"   # wasm-v0.8.1 → 0.8.1
          test "$PKG" = "$TAG" || { echo "tag wasm-v$TAG != package $PKG"; exit 1; }

      # Re-verified HERE as well as in wasm-verify: this job publishes, so it
      # checks the artefact it is about to upload rather than trusting another
      # job's report. One script, so the two callers cannot drift.
      - name: Verify the package to be published carries the notice
        run: tools/release/verify-npm-notice.sh "$GITHUB_WORKSPACE/wasm-pkg"

      # `--access public` is NOT redundant with the manifest's
      # `publishConfig.access`. Creating a BRAND-NEW scoped package is where the
      # two diverge: the first `wasm-v0.8.1` attempt carried publishConfig and
      # still died with `E404 PUT .../@laterite%2fags4-wasm — Not found ... or you
      # do not have permission`, with the token present and provenance already
      # signed. npm reports a permission/visibility refusal on a scoped name as
      # 404 rather than 402/401 (it will not confirm whether the name exists), so
      # the error names neither cause. The sibling `laterite` publish has always
      # passed the flag explicitly (and the `@laterite/native-*` packages get it
      # from `napi pre-publish`, not from a bare `npm publish`) — so match the
      # invocation that is known to work rather than rely on the manifest.
      # NO `NODE_AUTH_TOKEN` here, deliberately. The trusted publisher is wired
      # (2026-07-30), so this job authenticates by OIDC via `id-token: write`
      # above — and a token left in place would be strictly harmful rather than a
      # fallback. It is what made the first `wasm-v0.8.1` attempt so slow to
      # diagnose: an EXPIRED `NPM_TOKEN` turned "OIDC did not engage" into the
      # misleading `E404` documented below, instead of a plain auth error naming
      # the real problem. With nothing to fall back to, a publisher
      # misconfiguration says so. See RELEASING-wasm.md.
      - name: Publish @laterite/ags4-wasm
        working-directory: wasm-pkg
        run: npm publish --provenance --access public
