# A10 (wiki-reliability-hardening plan) — best-effort weekly check that the
# `ext:` allowlisted external-repo citations (ags-wiki/.bootstrap/lint.py's
# A9) still resolve. A9 itself is local-only (no network — it just checks a
# repo-id against EXT_ALLOWLIST), so it can't catch a *path* going stale
# inside an already-allowlisted repo (e.g. the cited repo renaming or
# deleting a file `ags-wiki/` still points at). This is that other half, on
# its own schedule, never touching the PR-blocking path.
#
# Report-only: check_ext_drift.py always exits 0, and this workflow never
# fails on drift or on a flaky GitHub API call — it opens/updates a
# tracking issue instead. "Confirmed missing" (a real 404) is the only
# thing that counts as drift; a timeout/rate-limit/auth hiccup is reported
# as `unknown` and does NOT open an issue (network flakiness must not be
# mistaken for a citation actually going stale).
#
# The issue is driven by `tools/issue_tracker.py`, the same state machine the
# nightly uses. It used to be inline shell here that create-or-commented, which
# had all three defects that tool was written to fix: the issue could never
# close (nothing ran when drift cleared), the body was never rewritten so it
# never said what was missing NOW, and a comment landed on every single run
# whether or not anything had changed.
name: wiki-ext-drift

on:
  workflow_dispatch:
  schedule:
    # Monday 04:00 UTC — low-traffic slot, clear of the parity job's
    # monthly 1st-of-month 03:00 run.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  ext-drift:
    name: "ext: citation drift check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Run drift check
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --no-project python ags-wiki/.bootstrap/check_ext_drift.py | tee drift.log
          # The SET, not a count — the tracker reports what changed, and an
          # empty set is what closes the issue. Multiline, so it goes to
          # $GITHUB_ENV via a heredoc rather than an output.
          {
            echo "ITEMS<<DRIFT_EOF"
            grep -E '^DRIFT_REF=' drift.log | cut -d= -f2- || true
            echo "DRIFT_EOF"
          } >> "$GITHUB_ENV"

      - name: Drive the tracking issue
        # Runs on EVERY run, not just drifting ones: closing is half the job, and
        # gating this step on "drift found" is exactly what left the old issue
        # unable to close.
        #
        # continue-on-error, not `|| true` on the run line — an issue API hiccup
        # must never turn a *report-only* check red. Looked up by exact title,
        # not a label: labels are effectively unused in this repo (1 application
        # across 31 issues), so a label-keyed lookup would assume setup that
        # isn't there.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/issue_tracker.py --tracker ext-drift
