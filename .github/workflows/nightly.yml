# Nightly heartbeat (Stage 2 of the CI two-tier restructure). The heavy
# MEASUREMENT work that doesn't need to gate every PR runs here on a schedule,
# on the warm self-hosted pool:
#
#   - instrumented coverage — its `-C instrument-coverage` build changes RUSTFLAGS
#     so every Rust crate is an sccache MISS (only the bundled-DuckDB C++ stays
#     cached via CC/CXX). That made it the single longest job when it lived on the
#     PR path; the per-PR Rust tests now run plain + cache-warm in ci.yml's `test`
#     job, and the coverage NUMBER is measured here once a day.
#   - a re-run of the supply-chain advisory check (`cargo deny`) so a RustSec
#     advisory published against an UNCHANGED dependency is caught within ~24h,
#     with zero code change — exactly the drift the per-PR `deny` job can't see.
#
# Validate-only: nothing is uploaded or retained (coverage results go to Codecov,
# an external service). A failed run opens or updates ONE tracking issue.
#
# Why run on a schedule even when nothing changed: the point is to catch breakage
# that has nothing to do with our commits — a new advisory, a yanked dep,
# toolchain or platform drift. Gating on "our code changed" would miss exactly
# that class, and on our own pool the cost is ~zero. (GitHub auto-disables a
# scheduled workflow after 60 days of repo inactivity — irrelevant while active.)
#
# Runner: schedule + workflow_dispatch are TRUSTED events with no fork surface
# (dispatch needs write access; schedule runs as the repo), so these jobs go
# straight to the warm `laterite-linux` pool — no fork-routing ternary needed.

name: nightly

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: # the manual "run heavy" button

# Don't cancel a slow night if the next trigger lands — let it finish (a
# half-measured coverage run is worse than a late one).
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Instrumented line-coverage + the floor gate + the Codecov `rust` flag. Lifted
  # off the PR path (was ci.yml's `coverage` job) — same scope, same floor.
  coverage:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (+ llvm-tools)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          # cargo-llvm-cov needs llvm-tools-preview (llvm-profdata/llvm-cov).
          components: llvm-tools-preview

      # sccache + mold: the bundled-DuckDB C++ compile stays cached (CC/CXX);
      # only the instrumented Rust crates recompile here.
      - uses: ./.github/actions/build-accel

      - name: Install cargo-llvm-cov
        # Prebuilt binary (no compile). SHA-pinned; Dependabot bumps it.
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov

      # Split collect + report so the same profdata feeds BOTH the floor gate and
      # the lcov upload. --no-report runs the instrumented tests; the two `report`
      # calls reuse the merged profdata.
      #
      # What this measures is the SHIPPED ENGINE, and the exclude set is what makes
      # that true. Two categories come out, for two different reasons:
      #
      #   1. Binding cdylibs (wasm, tokenizer-wasm, laterite-py, laterite-node) —
      #      exercised by the Python / Node / browser suites. Measuring them in this
      #      denominator would report near-0% for code that IS tested, and would
      #      move the engine's own floor for reasons that have nothing to do with
      #      the engine.
      #
      #      NB this is a denominator argument, NOT "they have no Rust tests".
      #      `laterite-ags4-wasm` has 44 native `#[test]`s that `cargo test` runs on
      #      every PR, and they cover 69% of it — a number nobody could see until
      #      the separate wasm step below existed, because the exclusion here was
      #      read as "unmeasurable" rather than "measured elsewhere".
      #   2. Dev-only QA tooling (xcheck, parity, forge, corpus-qa, perf,
      #      compliance) — harnesses and CLIs that are never shipped to a user.
      #
      # Category 2 is not cosmetic. When parity/forge/corpus-qa/perf/compliance
      # landed on public (#57, #60) they added ~7.3k lines at 43-73% covered, and
      # the workspace total fell 89.6% -> 79.2% overnight with no change to the
      # engine's own coverage — the 2026-07-24 nightly failure (#73). A floor is
      # only meaningful over a fixed denominator; letting dev tooling into it turns
      # "did the engine regress?" into "how much untested tooling did we add?".
      #
      # These crates are still TESTED — ci.yml's `test` job runs the workspace
      # without these excludes on every PR. They are excluded from the MEASUREMENT,
      # not from the test authority.
      - name: cargo llvm-cov (collect)
        working-directory: rust-packages
        run: |
          cargo llvm-cov --no-report --workspace \
            --exclude laterite-ags4-wasm \
            --exclude laterite-ags4-tokenizer-wasm \
            --exclude laterite-py \
            --exclude laterite-node \
            --exclude laterite-ags4-xcheck \
            --exclude laterite-ags4-parity \
            --exclude laterite-ags4-forge \
            --exclude laterite-ags4-corpus-qa \
            --exclude laterite-ags4-perf \
            --exclude laterite-ags4-compliance \
            --features laterite-ags4-emit/arrow,laterite-ags4-types/arrow

      - name: cargo llvm-cov (line-coverage floor)
        working-directory: rust-packages
        # Floor sits just under the real number (89.24% measured 2026-07-24 over
        # the exclude set above WITH the arrow feature edge restored, so 88 leaves
        # a small buffer for normal fluctuation) and is RATCHETED UP as coverage
        # climbs. The old 62 was 28 points below actual — it caught nothing.
        # Ratchet the floor and the exclude set TOGETHER: a number this tight is
        # only comparable run-to-run while the denominator is.
        #
        # The denominator grew on 2026-07-24: `--features` above brought
        # `laterite-ags4-types::{arrow_cols, ipc}` and `laterite-ags4-emit::arrow_in`
        # back into BOTH numerator and denominator. They had been silently absent
        # — not by any decision, but because resolver-2 unifies features across
        # selected packages only, and the four crates that request `arrow` are all
        # excluded here. The honest number came in 0.36 points below the old one
        # (89.6% → 89.24%), so the floor did not have to move.
        #
        # 88 -> 93 (2026-08-03). Actual has been 94.44-95.91 across the last four
        # nightlies (94.88 on 2026-08-02), so the old floor sat ~7 points under
        # reality and would not have caught a whole crate going dark. 93 keeps
        # ~1.4 points under the LOWEST of those runs, which is the margin the
        # denominator churn needs: it moved 15,522 -> 16,659 lines in that window
        # when the `laterite` facade crate landed, and a floor tighter than the
        # denominator's own drift fails on arithmetic rather than on coverage.
        #
        # NB this lane has no strict-vs-lenient gap. llvm-cov's lcov carries no
        # branch records (Branches reads 0/0), so Codecov sees no partials and its
        # badge is ~= this number -- unlike node/web, where the two diverged by ten
        # points. Do not import the branch-floor reasoning from those lanes here.
        run: cargo llvm-cov report --summary-only --fail-under-lines 93

      # Codecov `rust` flag — public repo only (where the badge lives + the token
      # is set). NB: the cargo-only number (PyO3 glue is Python-tested, excluded).
      - name: lcov report for Codecov
        if: github.repository == 'niko86/laterite'
        working-directory: rust-packages
        run: cargo llvm-cov report --lcov --output-path rust.lcov
      - name: Upload Rust coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-packages/rust.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # NB placed AFTER the Codecov upload on purpose. `cargo llvm-cov` clears prior
      # profile data at the start of a run, so measuring the wasm crate before the
      # upload would delete the engine collection this job just made and ship an
      # empty (or wasm-only) lcov under the `rust` flag.
      # The wasm crate, measured on its OWN — a second denominator, deliberately
      # not folded into the engine number above.
      #
      # It had no coverage gate of any kind. The exclusion above is a statement
      # about the engine's denominator, but it read as "cannot be measured", and so
      # for months the browser surface was the one shipped surface with no coverage
      # figure at all. It is not unmeasurable: its tests are plain `#[test]`s that
      # run on the host.
      #
      # The remaining gap is the wasm-bindgen boundary and it is a HARD ceiling
      # here, not a backlog: ~127 of the residual lines are `JsValue`/`JsError`
      # marshalling, which `cargo test` cannot call at all. Covering them needs
      # `wasm-bindgen-test` on wasm32 — a target llvm-cov cannot instrument — so
      # those tests would not move this number even once written. They are
      # exercised end-to-end instead, by the `wasm-engine` xcheck leg (build_ags4)
      # and web/src/lib/content-hash.test.ts (read + arrow_ipc), both of which
      # drive the real .wasm binary through Node.
      #
      # So this gate measures the LOGIC under the boundary. It moved 69% -> 91%
      # by relocating that logic OUT of the fat exports into plain `*_core`
      # functions; what is left inside them is decode -> core -> marshal.
      #
      # Separate step, separate floor: the engine floor above is only comparable
      # run-to-run while ITS denominator is fixed, which is the lesson of the
      # 2026-07-24 failure recorded there.
      - name: cargo llvm-cov (wasm crate, separate floor)
        working-directory: rust-packages
        run: |
          cargo llvm-cov -p laterite-ags4-wasm --summary-only \
            --fail-under-lines 89

      # The `wasm` flag + badge. Emitted from the SAME run as the floor above:
      # a second `cargo llvm-cov` invocation would clear the profile data this
      # one just wrote (the reason the engine upload sits above the wasm step),
      # so `report` re-renders the existing collection rather than re-measuring.
      - name: lcov report for Codecov (wasm)
        if: github.repository == 'niko86/laterite'
        working-directory: rust-packages
        run: cargo llvm-cov report -p laterite-ags4-wasm --lcov --output-path wasm.lcov
      - name: Upload wasm coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-packages/wasm.lcov
          flags: wasm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Re-check the supply-chain advisory + license policy against the CURRENT deps.
  # The per-PR `deny` job only runs when a PR lands; this catches an advisory
  # published against a dependency we already ship, between PRs.
  deny:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain (cargo-deny shells out to `cargo metadata`)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny
      - name: cargo deny check
        working-directory: rust-packages
        run: cargo deny check

  # Link + badge health check. ci.yml's `docs` job runs `mkdocs build --strict`,
  # which only validates INTERNAL links — this catches dead EXTERNAL links + dead
  # badge targets in the README and docs, rot that's otherwise invisible. Runs
  # GitHub-hosted (pure network, no build) so it doesn't tie up a pool lane.
  # Nightly, not per-PR: external checks are inherently flaky (rate limits,
  # transient 5xx), so a slow-changing rot check belongs here, not on a merge gate.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee link + badge check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticated github.com checks dodge the anonymous rate limit (the
          # README + docs carry many github.com links + shields/codecov badges).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # EXTERNAL links + badges only (--scheme http/https). The docs carry
          # ~200 RELATIVE .md cross-links — those are mkdocs's domain, and
          # `mkdocs build --strict` (ci.yml docs job) already gates them. lychee
          # resolves mkdocs link rewriting unreliably, so it must NOT double-check
          # internal links (that's what turned the first run red). --accept adds
          # 429 to the 2xx default (rate-limited = ALIVE); retries smooth transient
          # 5xx. --exclude npmjs.com: the npm PACKAGE PAGE Cloudflare-403s all bots
          # (even a browser UA), a guaranteed false alarm — existence is proven by
          # the shields npm badge (registry API) + the npm-install smoke.
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5
            --scheme https --scheme http
            --accept 200..=299,429
            --exclude 'www\.npmjs\.com'
            README.md 'web/docs-site/docs/**/*.md'
          fail: true
          jobSummary: true

  # The full wheel install matrix (W1). The per-PR ci.yml `wheel-smoke` keeps a
  # cheap 3.12-only build+import gate on the required path; the wider 3.13/3.14
  # legs + the [compat] and [compat,pyarrow] isolated smokes are a once-a-day
  # check here, off the PR path. Same --release build (warm on the pool).
  wheel-smoke:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 45
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      # sccache + mold so the maturin compile hits the warm cache.
      - uses: ./.github/actions/build-accel
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install Python 3.12 / 3.13 / 3.14 via uv
        run: uv python install 3.12 3.13 3.14
      - name: uv sync (build backend into the venv)
        run: uv sync
      - name: Build the release wheel
        run: (cd packages/laterite && uv run --no-sync maturin build --release --out "$GITHUB_WORKSPACE/dist")
      # Isolated install + console-script + import on all three interpreters the
      # abi3-py312 wheel promises to run on (exactly `pip install laterite`).
      - name: Install-and-import the wheel on 3.12 / 3.13 / 3.14
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          for v in 3.12 3.13 3.14; do
            venv="$GITHUB_WORKSPACE/.smoke-$v"
            uv venv --python "$v" --clear "$venv"
            uv pip install --python "$venv/bin/python" "$wheel"
            "$venv/bin/lat" --help >/dev/null
            "$venv/bin/python" --version
            "$venv/bin/python" tools/wheel_smoke.py
          done
      # The drop-in is pyarrow-FREE: [compat] pulls only pandas. This isolated
      # install is the ONLY place the pyarrow-free fallback runs — assert pyarrow
      # is ABSENT and the object-dtype drop-in still works.
      - name: '[compat] is pyarrow-free + object-dtype drop-in'
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          venv="$GITHUB_WORKSPACE/.smoke-compat"
          uv venv --python 3.12 --clear "$venv"
          uv pip install --python "$venv/bin/python" "${wheel}[compat]"
          "$venv/bin/python" tools/compat_smoke.py
      # The opt-in accelerator: [compat,pyarrow] adds pyarrow (swaps the pandas hop
      # for to_pandas + unlocks string_dtype='string').
      - name: '[compat,pyarrow] accelerator: fast hop + string dtype'
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          venv="$GITHUB_WORKSPACE/.smoke-compat-pyarrow"
          uv venv --python 3.12 --clear "$venv"
          uv pip install --python "$venv/bin/python" "${wheel}[compat,pyarrow]"
          "$venv/bin/python" tools/compat_pyarrow_smoke.py
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Cross-surface OUTPUT-VALUE gate (X1). Every OTHER gate compares knob NAMES;
  # this one pushes a committed list of (op × input) cases through all four
  # surface legs (python / node / wasm / CLI) and compares the observed output
  # VALUES N-way, with the in-process Rust leaf (emit-cases) as the AUTHORITY
  # column. `--require-legs all` is the anti-rot switch: locally a leg self-skips
  # when its artifact is missing, but IN CI a skipped leg is a FAILURE — that is
  # how this gate avoids being "built, never wired". `--require-engines all` is the
  # same switch one level down: every leg must also say WHICH ENGINE it is running,
  # so the run can state the legs were comparable rather than assume it. Half these
  # legs drive built artefacts that can be stale while every case still matches, and
  # a leg that stops reporting would otherwise degrade to a warning above a green
  # run. Lives in laterite-ags4-xcheck
  # (split out of the dev ags4-compliance crate — its findings half needs the
  # private ags4-parity oracle; #553 reversal, the public-is-dev-home flip).
  # GitHub-hosted: it builds all four surfaces (~50 min cold), so it runs off the
  # 2-lane pool on free public minutes, in parallel with the pool jobs.
  output-values:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UV_LINK_MODE: copy # see ci.yml's python job — silences the copy-fallback warning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (+ wasm32 target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # sccache + mold if present (no-op off the pool — this job is GitHub-hosted).
      - uses: ./.github/actions/build-accel
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install Python 3.14 via uv
        run: uv python install 3.14
      # --all-extras pulls the [compat] extra (pandas): the python-compat leg
      # drives compat.dataframe_to_AGS4, which needs it.
      - name: uv sync (deps + maturin)
        run: uv sync --all-extras
      # python + python-compat + cli legs: the PyO3 cdylib into the source tree.
      - name: Build python-laterite (maturin develop)
        run: (cd packages/laterite && uv run --no-sync maturin develop --uv)
      # node + cli-npx legs: the napi addon + the tsup dist (emit_js.mjs imports
      # dist/index.mjs).
      - name: Build node (napi debug + tsup dist)
        run: cd rust-packages/laterite-node && npm ci && npm run build:debug
      # wasm-engine leg: the --target web build emit_js.mjs instantiates from bytes.
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - name: Build wasm (release, --target web)
        run: wasm-pack build rust-packages/laterite-ags4-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/src/wasm"
      # cli-native leg: the release binary the launcher-leg subprocesses invoke
      # (emit_cli.py looks for rust-packages/target/release/lat).
      - name: Build lat CLI (release)
        run: cargo build --release --manifest-path rust-packages/Cargo.toml -p laterite-cli
      # Emit one observation file per leg, then compare. `xcheck` exits non-zero on
      # any unexplained split; ZERO normalisation, JSON value equality.
      - name: Cross-surface output-value gate
        run: |
          set -euo pipefail
          M=rust-packages/Cargo.toml
          O=output/xcheck
          cargo run -q --manifest-path "$M" -p laterite-ags4-xcheck --bin emit-cases -- --out "$O"
          uv run --no-sync python tools/xcheck/emit_py.py  --out "$O"
          node                    tools/xcheck/emit_js.mjs --out "$O"
          uv run --no-sync python tools/xcheck/emit_cli.py --out "$O"
          cargo run -q --manifest-path "$M" -p laterite-ags4-xcheck --bin xcheck -- \
            --check "$O" --allow xcheck-allow.json --require-legs all --require-engines all
      - name: upload observations on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xcheck-observations
          path: output/xcheck/
          if-no-files-found: ignore
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Ruleset-drift gate (I2 of the CI/CD audit). The branch-protection ruleset —
  # the required-check SET, enforcement, admin-bypass actors, the strict flag —
  # lives ONLY in repo settings; nothing in the tree pins it, so a silent edit (a
  # required check removed, enforcement dropped to `evaluate`, bypass widened, the
  # protected branch swapped) goes unnoticed until something slips through. Snapshot
  # the canonical ruleset in .github/rulesets/main-protection.expected.json and fail
  # if the live one drifts. Read-only. Needs a fine-grained PAT with
  # `administration: read` in GH_RULESET_TOKEN — the default GITHUB_TOKEN cannot read
  # a ruleset's bypass_actors. GitHub-hosted: pure API + jq, no build, no pool lane.
  ruleset-drift:
    if: github.repository == 'niko86/laterite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the live main-protection ruleset to the committed snapshot
        env:
          GH_TOKEN: ${{ secrets.GH_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          norm=.github/rulesets/normalize.jq
          snapshot=.github/rulesets/main-protection.expected.json
          # Normalise BOTH sides through the SAME filter so formatting / key order
          # can never cause a false diff — only governance content can.
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/19425032" \
            | jq -S -f "$norm" > live.normalized.json
          jq -S -f "$norm" "$snapshot" > expected.normalized.json
          if ! diff -u expected.normalized.json live.normalized.json; then
            echo "::error::The 'main protection' ruleset (19425032) drifted from ${snapshot}. If the change was intentional, regenerate it: gh api repos/${GITHUB_REPOSITORY}/rulesets/19425032 | jq -S -f ${norm} > ${snapshot}"
            exit 1
          fi
          echo "main-protection ruleset matches the committed snapshot."

  # Whole-vault wiki lint — the ENFORCING half of the wiki controls. wiki-lint.yml
  # runs the same checks per-PR, but diff-scoped (`--since`) and deliberately not
  # required: the wiki is the maintainer's to keep aligned, and a contributor
  # shouldn't have a PR blocked because a page they never touched cites a file that
  # moved. So the per-PR run is fast feedback, and THIS run — no `--since`, the full
  # vault, every hard check — is what actually has to stay green. A failure here
  # opens the nightly tracking issue like any other.
  #
  # Stdlib-only (`uv run --no-project`): no wheel, no Rust, ~10s. GitHub-hosted so
  # it doesn't take a pool lane.
  wiki-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: wiki-lint (whole vault, no ratchet)
        run: uv run --no-project python ags-wiki/.bootstrap/lint.py
      # The faithfulness gates. Without these a generator can silently stop
      # generating while its page freezes at whatever it last said — there is no
      # root `tests/` in this repo to catch it.
      - name: reindex --check (index.md == render(the vault))
        run: uv run --no-project python ags-wiki/.bootstrap/reindex.py --check
      - name: gen_wiki_cli --check (verb table == README-cli.md)
        run: uv run --no-project python tools/gen_wiki_cli.py --check
      - name: gen_reference_groups --check (group tier == ags_dictionary.json)
        run: uv run --no-project python tools/gen_reference_groups.py --check
      - name: gen_crate_graph --check (graph == Cargo manifests)
        run: uv run --no-project python tools/gen_crate_graph.py --check
      # gen_wiki_tables was in the per-PR lane but not here, so the ENFORCING half
      # of the wiki controls was one gate short of the advisory half.
      - name: gen_wiki_tables --check (ledger tables == their JSON)
        run: uv run --no-project python tools/gen_wiki_tables.py --check
      - name: gen_observations --check (OBSERVATIONS.md + coverage map == the SSOT)
        run: uv run --no-project python tools/gen_observations.py --check
      - name: gen_observations --check-wiki (O-N pages agree with the SSOT)
        run: uv run --no-project python tools/gen_observations.py --check-wiki

  # Open or update ONE tracking issue when the nightly fails, so a bad night is
  # actionable without watching the Actions tab. GitHub also emails the owner on a
  # scheduled-workflow failure, so this is the durable, dedup'd record — and it
  # no-ops gracefully if the runner has no `gh` (the email still fires).
  notify:
    needs: [coverage, deny, links, wheel-smoke, ruleset-drift, output-values, wiki-lint]
    if: ${{ always() && (needs.coverage.result == 'failure' || needs.deny.result == 'failure' || needs.links.result == 'failure' || needs.wheel-smoke.result == 'failure' || needs.ruleset-drift.result == 'failure' || needs.output-values.result == 'failure' || needs.wiki-lint.result == 'failure') }}
    # GitHub-hosted so `gh` is guaranteed present (the pool image may lack it) —
    # the whole point of this job is to reliably open the tracking issue.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open or update the nightly-failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COV: ${{ needs.coverage.result }}
          DENY: ${{ needs.deny.result }}
          LINKS: ${{ needs.links.result }}
          WHEEL: ${{ needs.wheel-smoke.result }}
          RULESET: ${{ needs.ruleset-drift.result }}
          XCHECK: ${{ needs.output-values.result }}
          WIKI: ${{ needs.wiki-lint.result }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || {
            echo "gh CLI not on runner — relying on the default scheduled-failure email"
            exit 0
          }
          title="Nightly CI failing"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title==\"$title\")][0].number // empty")
          body="The nightly run failed: $RUN_URL (coverage=$COV, deny=$DENY, links=$LINKS, wheel=$WHEEL, ruleset=$RULESET, xcheck=$XCHECK, wiki=$WIKI)."
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
