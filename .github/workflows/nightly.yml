# Nightly heartbeat (Stage 2 of the CI two-tier restructure). The heavy
# MEASUREMENT work that doesn't need to gate every PR runs here on a schedule,
# on the warm self-hosted pool:
#
#   - instrumented coverage — its `-C instrument-coverage` build changes RUSTFLAGS
#     so every Rust crate is an sccache MISS (only the bundled-DuckDB C++ stays
#     cached via CC/CXX). That made it the single longest job when it lived on the
#     PR path; the per-PR Rust tests now run plain + cache-warm in ci.yml's `test`
#     job, and the coverage NUMBER is measured here once a day.
#   - a re-run of the supply-chain advisory check (`cargo deny`) so a RustSec
#     advisory published against an UNCHANGED dependency is caught within ~24h,
#     with zero code change — exactly the drift the per-PR `deny` job can't see.
#
# Validate-only: nothing is uploaded or retained (coverage results go to Codecov,
# an external service). A failed run opens or updates ONE tracking issue.
#
# Why run on a schedule even when nothing changed: the point is to catch breakage
# that has nothing to do with our commits — a new advisory, a yanked dep,
# toolchain or platform drift. Gating on "our code changed" would miss exactly
# that class, and on our own pool the cost is ~zero. (GitHub auto-disables a
# scheduled workflow after 60 days of repo inactivity — irrelevant while active.)
#
# Runner: schedule + workflow_dispatch are TRUSTED events with no fork surface
# (dispatch needs write access; schedule runs as the repo), so these jobs go
# straight to the warm `laterite-linux` pool — no fork-routing ternary needed.

name: nightly

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: # the manual "run heavy" button

# Don't cancel a slow night if the next trigger lands — let it finish (a
# half-measured coverage run is worse than a late one).
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Instrumented line-coverage + the floor gate + the Codecov `rust` flag. Lifted
  # off the PR path (was ci.yml's `coverage` job) — same scope, same floor.
  coverage:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (+ llvm-tools)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          # cargo-llvm-cov needs llvm-tools-preview (llvm-profdata/llvm-cov).
          components: llvm-tools-preview

      # sccache + mold: the bundled-DuckDB C++ compile stays cached (CC/CXX);
      # only the instrumented Rust crates recompile here.
      - uses: ./.github/actions/build-accel

      - name: Install cargo-llvm-cov
        # Prebuilt binary (no compile). SHA-pinned; Dependabot bumps it.
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-llvm-cov

      # Split collect + report so the same profdata feeds BOTH the floor gate and
      # the lcov upload. --no-report runs the instrumented tests; the two `report`
      # calls reuse the merged profdata.
      #
      # What this measures is the SHIPPED ENGINE, and the exclude set is what makes
      # that true. Two categories come out, for two different reasons:
      #
      #   1. Binding cdylibs (wasm, tokenizer-wasm, laterite-py, laterite-node) —
      #      exercised by the Python / Node / browser suites. Measuring them in this
      #      denominator would report near-0% for code that IS tested, and would
      #      move the engine's own floor for reasons that have nothing to do with
      #      the engine.
      #
      #      NB this is a denominator argument, NOT "they have no Rust tests".
      #      `laterite-ags4-wasm` has 44 native `#[test]`s that `cargo test` runs on
      #      every PR, and they cover 69% of it — a number nobody could see until
      #      the separate wasm step below existed, because the exclusion here was
      #      read as "unmeasurable" rather than "measured elsewhere".
      #   2. Dev-only QA tooling (xcheck, parity, forge, corpus-qa, perf,
      #      compliance) — harnesses and CLIs that are never shipped to a user.
      #
      # Category 2 is not cosmetic. When parity/forge/corpus-qa/perf/compliance
      # landed on public (#57, #60) they added ~7.3k lines at 43-73% covered, and
      # the workspace total fell 89.6% -> 79.2% overnight with no change to the
      # engine's own coverage — the 2026-07-24 nightly failure (#73). A floor is
      # only meaningful over a fixed denominator; letting dev tooling into it turns
      # "did the engine regress?" into "how much untested tooling did we add?".
      #
      # These crates are still TESTED — ci.yml's `test` job runs the workspace
      # without these excludes on every PR. They are excluded from the MEASUREMENT,
      # not from the test authority.
      - name: cargo llvm-cov (collect)
        working-directory: rust-packages
        run: |
          cargo llvm-cov --no-report --workspace \
            --exclude laterite-ags4-wasm \
            --exclude laterite-ags4-tokenizer-wasm \
            --exclude laterite-py \
            --exclude laterite-node \
            --exclude laterite-ags4-xcheck \
            --exclude laterite-ags4-parity \
            --exclude laterite-ags4-forge \
            --exclude laterite-ags4-corpus-qa \
            --exclude laterite-ags4-perf \
            --exclude laterite-ags4-compliance \
            --features laterite-ags4-emit/arrow,laterite-ags4-types/arrow

      - name: cargo llvm-cov (line-coverage floor)
        working-directory: rust-packages
        # Floor sits just under the real number (89.24% measured 2026-07-24 over
        # the exclude set above WITH the arrow feature edge restored, so 88 leaves
        # a small buffer for normal fluctuation) and is RATCHETED UP as coverage
        # climbs. The old 62 was 28 points below actual — it caught nothing.
        # Ratchet the floor and the exclude set TOGETHER: a number this tight is
        # only comparable run-to-run while the denominator is.
        #
        # The denominator grew on 2026-07-24: `--features` above brought
        # `laterite-ags4-types::{arrow_cols, ipc}` and `laterite-ags4-emit::arrow_in`
        # back into BOTH numerator and denominator. They had been silently absent
        # — not by any decision, but because resolver-2 unifies features across
        # selected packages only, and the four crates that request `arrow` are all
        # excluded here. The honest number came in 0.36 points below the old one
        # (89.6% → 89.24%), so the floor did not have to move.
        #
        # 88 -> 93 (2026-08-03). Actual has been 94.44-95.91 across the last four
        # nightlies (94.88 on 2026-08-02), so the old floor sat far under reality
        # and would not have caught a whole crate going dark. 93 sits just under
        # the LOWEST of those runs, which is the margin the
        # denominator churn needs: it moved 15,522 -> 16,659 lines in that window
        # when the `laterite` facade crate landed, and a floor tighter than the
        # denominator's own drift fails on arithmetic rather than on coverage.
        #
        # NB this lane has no strict-vs-lenient gap. llvm-cov's lcov carries no
        # branch records (Branches reads 0/0), so Codecov sees no partials and its
        # badge is ~= this number -- unlike node/web, where the two diverged by ten
        # points. Do not import the branch-floor reasoning from those lanes here.
        run: cargo llvm-cov report --summary-only --fail-under-lines 93

      # Codecov `rust` flag — public repo only (where the badge lives + the token
      # is set). NB: the cargo-only number (PyO3 glue is Python-tested, excluded).
      - name: lcov report for Codecov
        if: github.repository == 'niko86/laterite'
        working-directory: rust-packages
        run: cargo llvm-cov report --lcov --output-path rust.lcov
      - name: Upload Rust coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-packages/rust.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # NB placed AFTER the Codecov upload on purpose. `cargo llvm-cov` clears prior
      # profile data at the start of a run, so measuring the wasm crate before the
      # upload would delete the engine collection this job just made and ship an
      # empty (or wasm-only) lcov under the `rust` flag.
      # The wasm crate, measured on its OWN — a second denominator, deliberately
      # not folded into the engine number above.
      #
      # It had no coverage gate of any kind. The exclusion above is a statement
      # about the engine's denominator, but it read as "cannot be measured", and so
      # for months the browser surface was the one shipped surface with no coverage
      # figure at all. It is not unmeasurable: its tests are plain `#[test]`s that
      # run on the host.
      #
      # The remaining gap is the wasm-bindgen boundary and it is a HARD ceiling
      # here, not a backlog: the residual lines are dominated by
      # `JsValue`/`JsError` marshalling, which `cargo test` cannot call at all.
      # Covering them needs
      # `wasm-bindgen-test` on wasm32 — a target llvm-cov cannot instrument — so
      # those tests would not move this number even once written. They are
      # exercised end-to-end instead, by the `wasm-engine` xcheck leg (build_ags4)
      # and web/src/lib/content-hash.test.ts (read + arrow_ipc), both of which
      # drive the real .wasm binary through Node.
      #
      # So this gate measures the LOGIC under the boundary. It moved 69% -> 91%
      # by relocating that logic OUT of the fat exports into plain `*_core`
      # functions; what is left inside them is decode -> core -> marshal.
      #
      # Separate step, separate floor: the engine floor above is only comparable
      # run-to-run while ITS denominator is fixed, which is the lesson of the
      # 2026-07-24 failure recorded there.
      - name: cargo llvm-cov (wasm crate, separate floor)
        working-directory: rust-packages
        run: |
          cargo llvm-cov -p laterite-ags4-wasm --summary-only \
            --fail-under-lines 89

      # The `wasm` flag + badge. Emitted from the SAME run as the floor above:
      # a second `cargo llvm-cov` invocation would clear the profile data this
      # one just wrote (the reason the engine upload sits above the wasm step),
      # so `report` re-renders the existing collection rather than re-measuring.
      - name: lcov report for Codecov (wasm)
        if: github.repository == 'niko86/laterite'
        working-directory: rust-packages
        run: cargo llvm-cov report -p laterite-ags4-wasm --lcov --output-path wasm.lcov
      - name: Upload wasm coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-packages/wasm.lcov
          flags: wasm
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Re-check the supply-chain advisory + license policy against the CURRENT deps.
  # The per-PR `deny` job only runs when a PR lands; this catches an advisory
  # published against a dependency we already ship, between PRs.
  deny:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain (cargo-deny shells out to `cargo metadata`)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: install cargo-deny
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-deny
      - name: cargo deny check
        working-directory: rust-packages
        run: cargo deny check

  # Link + badge health check. ci.yml's `docs` job runs `mkdocs build --strict`,
  # which only validates INTERNAL links — this catches dead EXTERNAL links + dead
  # badge targets in the README and docs, rot that's otherwise invisible. Runs
  # GitHub-hosted (pure network, no build) so it doesn't tie up a pool lane.
  # Nightly, not per-PR: external checks are inherently flaky (rate limits,
  # transient 5xx), so a slow-changing rot check belongs here, not on a merge gate.
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee link + badge check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticated github.com checks dodge the anonymous rate limit (the
          # README + docs carry many github.com links + shields/codecov badges).
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # EXTERNAL links + badges only (--scheme http/https). The docs carry
          # ~200 RELATIVE .md cross-links — those are mkdocs's domain, and
          # `mkdocs build --strict` (ci.yml docs job) already gates them. lychee
          # resolves mkdocs link rewriting unreliably, so it must NOT double-check
          # internal links (that's what turned the first run red). --accept adds
          # 429 to the 2xx default (rate-limited = ALIVE); retries smooth transient
          # 5xx. --exclude npmjs.com: the npm PACKAGE PAGE Cloudflare-403s all bots
          # (even a browser UA), a guaranteed false alarm — existence is proven by
          # the shields npm badge (registry API) + the npm-install smoke.
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5
            --scheme https --scheme http
            --accept 200..=299,429
            --exclude 'www\.npmjs\.com'
            README.md 'web/docs-site/docs/**/*.md'
          fail: true
          jobSummary: true

  # The full wheel install matrix (W1). The per-PR ci.yml `wheel-smoke` keeps a
  # cheap 3.12-only build+import gate on the required path; the wider 3.13/3.14
  # legs + the [compat] and [compat,pyarrow] isolated smokes are a once-a-day
  # check here, off the PR path. Same --release build (warm on the pool).
  wheel-smoke:
    runs-on: ["self-hosted", "linux", "x64", "laterite-linux"]
    timeout-minutes: 45
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      # sccache + mold so the maturin compile hits the warm cache.
      - uses: ./.github/actions/build-accel
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python 3.12 / 3.13 / 3.14 via uv
        run: uv python install 3.12 3.13 3.14
      - name: uv sync (build backend into the venv)
        run: uv sync
      - name: Build the release wheel
        run: (cd packages/laterite && uv run --no-sync maturin build --release --out "$GITHUB_WORKSPACE/dist")
      # Isolated install + console-script + import on all three interpreters the
      # abi3-py312 wheel promises to run on (exactly `pip install laterite`).
      - name: Install-and-import the wheel on 3.12 / 3.13 / 3.14
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          for v in 3.12 3.13 3.14; do
            venv="$GITHUB_WORKSPACE/.smoke-$v"
            uv venv --python "$v" --clear "$venv"
            uv pip install --python "$venv/bin/python" "$wheel"
            "$venv/bin/lat" --help >/dev/null
            "$venv/bin/python" --version
            "$venv/bin/python" tools/wheel_smoke.py
          done
      # The drop-in is pyarrow-FREE: [compat] pulls only pandas. This isolated
      # install is the ONLY place the pyarrow-free fallback runs — assert pyarrow
      # is ABSENT and the object-dtype drop-in still works.
      - name: '[compat] is pyarrow-free + object-dtype drop-in'
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          venv="$GITHUB_WORKSPACE/.smoke-compat"
          uv venv --python 3.12 --clear "$venv"
          uv pip install --python "$venv/bin/python" "${wheel}[compat]"
          "$venv/bin/python" tools/compat_smoke.py
      # The opt-in accelerator: [compat,pyarrow] adds pyarrow (swaps the pandas hop
      # for to_pandas + unlocks string_dtype='string').
      - name: '[compat,pyarrow] accelerator: fast hop + string dtype'
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          venv="$GITHUB_WORKSPACE/.smoke-compat-pyarrow"
          uv venv --python 3.12 --clear "$venv"
          uv pip install --python "$venv/bin/python" "${wheel}[compat,pyarrow]"
          "$venv/bin/python" tools/compat_pyarrow_smoke.py
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Does the LIVE docs site work against the wheel a reader can actually install?
  #
  # Every other docs gate runs against the working-tree cdylib, so all of them
  # answer "is the site consistent with HEAD". Nobody was asking the reader's
  # question, and the reader is not on HEAD: they are on `pip install laterite`.
  # The gap is real and was measured once by hand — the answer that day was yes,
  # every example ran and all 38 output blocks byte-matched — but a one-off
  # measurement decays the moment it is taken.
  #
  # WHY THE TWO STEPS ARE CALIBRATED DIFFERENTLY, and why this job is not wired
  # into `notify`. The docs deliberately track HEAD (see docs-site.md: the API
  # reference is mkdocstrings against the local build, "the owner's call over a
  # published-PyPI wheel"), and the site deploys from main. So between a docs
  # change and the next release the site legitimately documents API the released
  # wheel lacks. That window is short at this cadence — six releases in the four
  # weeks to 0.10.1 — but it is a CHOSEN state, and a gate that opens a tracking
  # issue about a choice already made is noise that gets muted.
  #
  # So: an example that FAILS TO RUN fails this job, because a reader following
  # the live site then gets a traceback rather than a result. A committed `.out`
  # that no longer byte-matches does NOT, because output drift is the ordinary,
  # expected consequence of the tree being ahead. And the job stays out of
  # `notify`'s `needs`, so a red run emails rather than filing an issue against
  # a state the owner intended.
  #
  # GitHub-hosted and toolchain-free: this installs a published wheel from PyPI,
  # so it needs no Rust, no maturin and none of the pool's warm caches.
  docs-vs-released-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # No version pin: the point is whatever `pip install laterite` resolves to
      # today. [all] because the docs exercise the pandas + pyarrow surfaces too.
      - name: Install the PUBLISHED wheel
        run: |
          set -euxo pipefail
          uv venv --python 3.12 --clear "$GITHUB_WORKSPACE/.released"
          uv pip install --python "$GITHUB_WORKSPACE/.released/bin/python" \
            "laterite[all]" pytest pytest-benchmark
      # A gate whose subject depends on the environment must say what it measured
      # — the same reason `gen_doc_outputs.py:_lat()` prints the binary it picked.
      - name: State what is under test
        id: under-test
        run: |
          set -euo pipefail
          py="$GITHUB_WORKSPACE/.released/bin/python"
          released=$("$py" -c 'import importlib.metadata as m; print(m.version("laterite"))')
          tree=$("$py" - <<'EOF'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("packages/laterite/pyproject.toml").read_text())["project"]["version"])
          EOF
          )
          echo "released wheel : $released"
          echo "this tree      : $tree"
          # Whether the tree is AHEAD is a question about commits, not version
          # strings. `main` keeps the tag's version until the next bump, so a merge
          # landing after the tag — #468's verdict split, the day 0.11.0 published —
          # leaves both numbers equal while the documented API has moved on, and this
          # gate then reports the docs' unreleased API as a defect for however many
          # weeks pass before the next release. Ask git which commit shipped instead.
          ahead=true
          if git fetch --no-tags --depth=1 origin \
               "+refs/tags/v$released:refs/tags/v$released" >/dev/null 2>&1; then
            [ "$(git rev-parse "v$released^{commit}")" = "$(git rev-parse HEAD)" ] && ahead=false
          else
            # The tag the released artefact was cut from cannot be resolved. Do NOT
            # quietly fall through to "informational": an undetermined comparison
            # that turns the gate off is the shape this repo keeps re-learning —
            # zero is a bad witness. Stay fatal and say why.
            echo "::warning::cannot resolve refs/tags/v$released — the comparison below is unverified, and this run stays fatal"
            ahead=false
          fi
          echo "tree_ahead=$ahead" >> "$GITHUB_OUTPUT"
          [ "$ahead" = "false" ] \
            && echo "this checkout IS v$released — any failure below is a real defect" \
            || echo "TREE IS AHEAD of v$released — unreleased API in the docs is expected; failures below are reported, not fatal"
      # The actionable class: a documented example that does not RUN.
      - name: Docs examples + snippets execute against the released wheel
        continue-on-error: ${{ steps.under-test.outputs.tree_ahead == 'true' }}
        run: |
          "$GITHUB_WORKSPACE/.released/bin/python" -m pytest \
            tests/test_docs_examples.py tests/test_docs_snippets.py -q --no-header
      # The expected-drift class: reported, never fatal (see the header above).
      - name: Committed .out still byte-matches (informational)
        continue-on-error: true
        run: |
          "$GITHUB_WORKSPACE/.released/bin/python" tools/gen_doc_outputs.py \
            --check --surface python
      # The CLI surface ships in this same wheel and nothing asked it anything
      # (#282). It matters more since #276 put `uvx --from laterite lat validate
      # delivery.ags` in the README — a reader-facing install path resolved
      # entirely from the published wheel.
      #
      # WHICH `lat` this is, and it is not the obvious one. Two programs answer to
      # that name: the shipped Rust binary (`laterite-cli`) the pages are written
      # about and whose output generated every committed `.out`, and the Python
      # console script the wheel installs (`laterite._cli`). `pip install
      # laterite` gives you the SECOND — verified by reading the shebang of
      # `.released/bin/lat`, which is a Python script. So this leg does not
      # re-check the Rust CLI: it asks whether the program a reader actually gets
      # from the wheel does what the pages say. Nothing else asks that, and the
      # 15 scripts in `web/docs-site/examples/cli/` otherwise run only against a
      # locally built Rust binary.
      #
      # `LAT_BIN` is what carries it: `gen_doc_outputs.py:_lat()` reads that first
      # and puts its directory on PATH for the `cli` surface, which is how the
      # scripts' bare `lat` resolves. Running the scripts with plain `bash` and
      # `LAT_BIN` set would NOT work — they never read that variable.
      #
      # Split the same way as the two steps above, and ordered for it: `--check`
      # writes nothing, so it runs first and reports drift without being able to
      # mask anything; the write-mode run that follows is the fatal half, since
      # `run_example` exits hard when a script's exit code is not its
      # `expect-exit`. Its `.out` writes are discarded with the runner.
      - name: CLI examples still byte-match the wheel's own `lat` (informational)
        continue-on-error: true
        env:
          LAT_BIN: ${{ github.workspace }}/.released/bin/lat
        run: |
          "$GITHUB_WORKSPACE/.released/bin/python" tools/gen_doc_outputs.py \
            --check --surface cli
      - name: CLI examples run against the released `lat`
        env:
          LAT_BIN: ${{ github.workspace }}/.released/bin/lat
        run: |
          "$GITHUB_WORKSPACE/.released/bin/python" tools/gen_doc_outputs.py \
            --surface cli

  # The Node twin of docs-vs-released-wheel: does the live docs site work against
  # the package `npm install laterite` actually gives you?
  #
  # This one has already earned its keep before running. Building it is what
  # surfaced that `peerDependencies: {"@duckdb/node-api": ">=1.5.0"}` matched ZERO
  # published versions — every release of that package is a prerelease, which a
  # range without a prerelease component cannot match — so `sql()` and `at()` were
  # unreachable for anyone installing from npm, and the install command the
  # library's own error prints failed with ETARGET. No per-PR gate could see it:
  # `npm ci` installs from the lockfile, so the peer range is never consulted.
  # Fixed in the manifest; `peer-range.test.ts` keeps it fixed.
  #
  # EXPECT THIS RED UNTIL THAT FIX SHIPS. The manifest on npm still carries the
  # old range, so the peer step below fails and the three `sql()`/`at()` examples
  # fail with it. That is the correct signal, not a bug in the job: the published
  # package IS broken for readers right now, and the remedy is a release. It goes
  # green on its own the day one is cut.
  #
  # Calibrated exactly like the wheel leg, and NOT wired into `notify` for the
  # same reason — an example that FAILS TO RUN fails the job, because a reader
  # following the live site gets a traceback; a committed `.out` that no longer
  # byte-matches does not, because output drift is the ordinary consequence of the
  # tree being ahead of the release.
  docs-vs-released-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      # No version pin: the point is whatever `npm install laterite` resolves to
      # today. The peer is attempted EXACTLY as the docs and the runtime error
      # tell a reader to install it — non-fatal here only so the failure is
      # attributed by the step below rather than aborting before it can speak.
      - name: Install the PUBLISHED package, as a reader would
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:-/tmp}/released-npm"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null
          npm install laterite
          npm install @duckdb/node-api || echo "PEER INSTALL FAILED — see the job header"
      - name: State what is under test
        id: under-test
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP:-/tmp}/released-npm"
          released=$(node -p "require('$work/node_modules/laterite/package.json').version")
          tree=$(node -p "require('$GITHUB_WORKSPACE/rust-packages/laterite-node/package.json').version")
          peer=$(node -p "require('fs').existsSync('$work/node_modules/@duckdb/node-api') \
            ? require('$work/node_modules/@duckdb/node-api/package.json').version : 'ABSENT'")
          echo "released npm : $released"
          echo "this tree    : $tree"
          echo "optional peer: $peer"
          # Whether the tree is AHEAD is a question about commits, not version
          # strings. `main` keeps the tag's version until the next bump, so a merge
          # landing after the tag — #468's verdict split, the day 0.11.0 published —
          # leaves both numbers equal while the documented API has moved on, and this
          # gate then reports the docs' unreleased API as a defect for however many
          # weeks pass before the next release. Ask git which commit shipped instead.
          ahead=true
          if git fetch --no-tags --depth=1 origin \
               "+refs/tags/node-v$released:refs/tags/node-v$released" >/dev/null 2>&1; then
            [ "$(git rev-parse "node-v$released^{commit}")" = "$(git rev-parse HEAD)" ] && ahead=false
          else
            # The tag the released artefact was cut from cannot be resolved. Do NOT
            # quietly fall through to "informational": an undetermined comparison
            # that turns the gate off is the shape this repo keeps re-learning —
            # zero is a bad witness. Stay fatal and say why.
            echo "::warning::cannot resolve refs/tags/node-v$released — the comparison below is unverified, and this run stays fatal"
            ahead=false
          fi
          echo "tree_ahead=$ahead" >> "$GITHUB_OUTPUT"
          [ "$ahead" = "false" ] \
            && echo "this checkout IS node-v$released — any failure below is a real defect" \
            || echo "TREE IS AHEAD of node-v$released — unreleased API in the docs is expected; failures below are reported, not fatal"
          [ "$peer" != "ABSENT" ] \
            || echo "PEER ABSENT — sql()/at() examples will fail; if the published peerDependencies range is still >=1.5.0 this is the known ETARGET, and the remedy is a release"
      # The actionable class: a documented example that does not RUN. The examples
      # resolve `import … from "laterite"` through a symlink, so pointing it at the
      # installed package is the whole of the swap.
      - name: Docs examples run against the released package
        continue-on-error: ${{ steps.under-test.outputs.tree_ahead == 'true' }}
        run: |
          set -euo pipefail
          ex="$GITHUB_WORKSPACE/web/docs-site/examples/node"
          mkdir -p "$ex/node_modules"
          rm -rf "$ex/node_modules/laterite"
          ln -s "${RUNNER_TEMP:-/tmp}/released-npm/node_modules/laterite" "$ex/node_modules/laterite"
          cd "$GITHUB_WORKSPACE"
          for f in "$ex"/ex*.mjs; do
            echo "--- $(basename "$f")"
            node "$f" >/dev/null
          done
      # The expected-drift class: reported, never fatal (see the header).
      - name: Committed .out still byte-matches (informational)
        continue-on-error: true
        run: python3 tools/gen_doc_outputs.py --check --surface node

  # The BROWSER twin (#283): does `reference/wasm-api.md` work against the package
  # `npm install @laterite/ags4-wasm` actually gives you?
  #
  # The wasm crate says `publish = false` — for crates.io. It IS the npm package:
  # `wasm-pack` writes the published manifest from its version line and release.yml
  # pushes it on a `wasm-v*` tag. So there is a real published artifact with five
  # docs examples, and until this job the only thing running them was ci.yml's
  # `web` leg, against a local `wasm-pack build`.
  #
  # EQUAL VERSION NUMBERS DO NOT MEAN EQUAL ARTIFACTS HERE, and that is the one
  # way this leg differs from the wheel and node ones. The browser package
  # releases on its OWN tag while the crate's version line only moves at the next
  # umbrella bump — so the tree can carry weeks of unreleased wasm changes at a
  # version string identical to npm's. The wheel leg's "same version — any failure
  # below is a real defect" would be a lie here. The step below prints the npm
  # PUBLISH DATE beside this tree's HEAD date instead, which is the pair that
  # actually separates a defect from ordinary tree-ahead drift.
  #
  # EXPECT THIS RED until the next `wasm-v*` release. `ex03_read.mjs` pulls rows
  # through `rows_json()` — the accessor the slim engine tier exposes — and the
  # published artifact predates it, so the example dies with `dataset.rows_json is
  # not a function` while both version strings read the same. That is the state
  # this leg was built to make visible, not a bug in the job; the remedy is a
  # release. Which release, and how far behind it is, is what the step below
  # prints — don't restate it here, it moves on the next publish.
  #
  # Calibrated like both existing legs, and NOT in `notify` for the same reason: an
  # example that FAILS TO RUN fails the job, a committed `.out` that no longer
  # byte-matches does not. GitHub-hosted and toolchain-free — a published npm
  # package needs no Rust, no wasm-pack and no wasm32 target.
  docs-vs-released-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      # No version pin: the point is whatever `npm install @laterite/ags4-wasm`
      # resolves to today.
      - name: Install the PUBLISHED package, as a reader would
        run: |
          set -euxo pipefail
          work="${RUNNER_TEMP:-/tmp}/released-wasm"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null
          npm install @laterite/ags4-wasm
          # Where the steps below look for the package. `gen_doc_outputs.py`
          # reads this (see `_wasm_pkg()`) and symlinks it into the examples' own
          # `node_modules`, which is how their `@laterite/ags4-wasm` import
          # resolves — the same seam `LAT_BIN` is for the CLI examples.
          #
          # Published from HERE, derived from `$work`, rather than declared as a
          # job-level `env:` — the `runner` context is not available in one, and
          # GitHub rejects the WHOLE FILE for using it there, which is a startup
          # failure: no job runs, no `notify` fires, and the only trace is a run
          # with no jobs in it. Deriving it from `$work` also means the install
          # path and the read path cannot drift apart.
          echo "WASM_PKG_DIR=$work/node_modules/@laterite/ags4-wasm" >> "$GITHUB_ENV"
      - name: State what is under test
        run: |
          set -euo pipefail
          released=$(node -p "require('$WASM_PKG_DIR/package.json').version")
          tree=$(python3 - <<'EOF'
          import pathlib, tomllib
          m = pathlib.Path("rust-packages/laterite-ags4-wasm/Cargo.toml")
          print(tomllib.loads(m.read_text())["package"]["version"])
          EOF
          )
          # The publish date, because the version pair cannot carry this one on its
          # own (see the job header). `npm view` serves it per version — and this
          # is CONTEXT, so it must not be able to take the job down: a registry
          # 5xx or a rate-limit would otherwise abort the step under `pipefail`
          # before either measurement below runs, and the only signal is an email
          # indistinguishable from this leg's documented expected-red. Hence the
          # fetch and the parse are separate: `|| true` keeps a failed lookup out
          # of `pipefail`'s reach, and empty input then falls out of the parse as
          # the same one "unknown" the parse failure gives.
          raw=$(npm view @laterite/ags4-wasm time --json 2>/dev/null || true)
          published=$(printf '%s' "$raw" | python3 -c "
          import json, sys
          try:
              print(json.load(sys.stdin).get('$released', 'unknown'))
          except Exception:
              print('unknown — the registry did not answer')
          ")
          echo "released npm : $released (published $published)"
          echo "this tree    : $tree (HEAD $(git log -1 --format=%cI))"
          echo "The browser package releases on its own \`wasm-v*\` tag, so equal"
          echo "version numbers do NOT mean equal artifacts — compare the dates."
      # The expected-drift class, and it runs FIRST because `--check` writes
      # nothing — so it cannot mask what the fatal step below would find.
      #
      # It does NOT report on every example, and the limit is worth knowing while
      # this leg sits in its expected-red state: `--check` runs the examples
      # before comparing any of them, and `run_example` exits hard on the first
      # wrong exit code. Examples sorted after the failing one are neither run nor
      # compared. That is inherited from the CLI half of the wheel leg rather than
      # chosen here, and it errs the safe way — under-reporting drift, never
      # hiding a failure to run, which the step below answers for all five.
      - name: Committed .out still byte-matches (informational)
        continue-on-error: true
        run: python3 tools/gen_doc_outputs.py --check --surface wasm
      # The actionable class: a documented example that does not RUN. Write mode is
      # the fatal half — `run_example` exits hard when an example's exit code is
      # not its `expect-exit`. Its `.out` writes are discarded with the runner.
      - name: Docs examples run against the released package
        run: python3 tools/gen_doc_outputs.py --surface wasm

  # The crates.io twin (#283). #278 wired every publishable crate's README example
  # into `cargo test --workspace` — but through
  # `#[cfg(doctest)] #[doc = include_str!("../README.md")]`, which compiles it
  # inside the workspace, where each `laterite-*` dependency resolves through a
  # `path =` entry to the source next door. The reader's path is `cargo add
  # laterite-ags4-core` and then the example off the crates.io page: the RELEASED
  # crate plus its RELEASED dependency graph. A re-export or a feature gate that
  # exists only in this tree compiles there and fails for them.
  #
  # So `tools/check_released_crate_readmes.py` builds a scratch consumer per crate
  # with NO path dependency anywhere — that absence is the whole instrument, and
  # `tests/test_released_crate_readmes.py` asserts it rather than trusting the
  # generator to keep it. Unpinned, like the other legs: `cargo add` with no
  # version is what a reader types.
  #
  # ONE CLASS, NOT TWO. The other legs split fatal (an example that fails to run)
  # from informational (a committed `.out` that no longer byte-matches); a README
  # doctest has no committed output, so there is no drift half to report — it
  # compiles and runs, or it does not. Out of `notify`'s `needs` all the same: the
  # tree legitimately documents unreleased API between releases, and the
  # released-vs-tree pair the tool prints per crate is what tells that apart from a
  # defect.
  #
  # GitHub-hosted: a Rust toolchain and a registry, no workspace build.
  docs-vs-released-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: State what is under test
        run: python3 tools/check_released_crate_readmes.py --list
      # No `--work-dir`: the default temp dir keeps ten scratch consumers and their
      # shared target directory out of the checkout entirely. (What actually keeps
      # them from resolving this workspace's `path =` dependencies is the empty
      # `[workspace]` table in each generated manifest, wherever they land.)
      - name: Crate README examples compile against the crates.io release
        run: python3 tools/check_released_crate_readmes.py

  # Does the LIVE docs site work against the extension a reader can actually
  # INSTALL? The fourth and last artifact in #283's set, and the one furthest from
  # this tree: the DuckDB extension ships from a SEPARATE repo
  # (`niko86/laterite-duckdb`) through the community-extensions pipeline, which has
  # its own build, its own toolchain image and its own DuckDB target. Every other
  # DuckDB check in this project — including the dev satellite's monthly
  # compliance leg — loads a locally built cdylib, so "our build works" was the
  # only claim anyone was making, and it is not the claim the pages make.
  #
  # WHAT A RED RUN MEANS HERE, and it differs from its three siblings. There is
  # deliberately no joint release train with `laterite-duckdb`
  # (`ags-wiki/design/dec-duckdb-extension.md`): the extension must merely be
  # CURRENT, which until now was an assertion with nothing behind it. This job is
  # what makes it checkable. So a failure is usually a signal about the OTHER repo
  # — it needs a release, or the community listing needs its version and `ref:`
  # bumped — and the fix lands there. The one case where it lands here is an
  # example rewritten onto API the published extension does not have yet.
  #
  # Out of `notify`'s `needs`, for the same reason as its three siblings: the docs
  # track HEAD, so a window where the tree is ahead of the published extension is a
  # CHOSEN state, and an issue filed about a choice already made is noise that gets
  # muted. A red run emails.
  #
  # NEITHER SIDE IS PINNED, because neither side is pinned for a reader: `uv pip
  # install duckdb` resolves whatever is current, and `INSTALL … FROM community`
  # serves whatever that DuckDB has a build for. The pairing is the thing under
  # test. That does admit one failure this repo cannot fix — DuckDB releases a new
  # version and the community rebuild has not landed yet, which is days, not weeks
  # — so the probe below splits it out: the examples step always RUNS (a skipped
  # step would be a green job that tested nothing), but it is only fatal when the
  # extension actually installed. Same calibration as the wheel and npm legs.
  #
  # GitHub-hosted and toolchain-free: pip `duckdb` and a network install. No Rust,
  # no maturin, no extension build.
  docs-vs-released-duckdb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # Deliberately not `uv sync`: this leg imports `duckdb` and `pytest` and
      # nothing else — building this workspace's wheel would drag in Rust to test
      # an artifact built somewhere else entirely.
      - name: Install duckdb + pytest
        run: |
          set -euxo pipefail
          uv venv --python 3.12 --clear "$GITHUB_WORKSPACE/.duckdb-leg"
          uv pip install --python "$GITHUB_WORKSPACE/.duckdb-leg/bin/python" duckdb pytest
      # A gate whose subject depends on the environment must say what it measured
      # — the same reason `gen_doc_outputs.py:_lat()` prints the binary it picked.
      - name: State what is under test
        id: under-test
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.duckdb-leg/bin/python" - >> "$GITHUB_OUTPUT" <<'EOF'
          import duckdb

          print(f"duckdb={duckdb.__version__}")
          con = duckdb.connect()
          try:
              con.execute("INSTALL laterite_ags4 FROM community")
              con.execute("LOAD laterite_ags4")
          except Exception as exc:
              # One line, truncated: $GITHUB_OUTPUT is line-oriented and a DuckDB
              # HTTP error carries a multi-line hint.
              print("installable=false")
              print(f"why={' '.join(str(exc).split())[:300]}")
          else:
              (version,) = con.execute(
                  "SELECT extension_version FROM duckdb_extensions()"
                  " WHERE extension_name = 'laterite_ags4'"
              ).fetchone()
              print("installable=true")
              print(f"extension={version}")
          EOF
          echo "--- under test ---"
          cat "$GITHUB_OUTPUT"
      - name: No community build for this DuckDB yet
        if: steps.under-test.outputs.installable != 'true'
        run: |
          echo "::warning::laterite_ags4 did not install from the community repository on duckdb ${{ steps.under-test.outputs.duckdb }} — ${{ steps.under-test.outputs.why }}. The examples step below runs anyway and is NON-FATAL this run; if this persists past a DuckDB release cycle it is a real gap."
      # Non-fatal only when the extension could not be installed at all — see the
      # header. If it installed, an example that fails to run means a reader
      # following the live site gets an error instead of a result, and that is red.
      - name: Docs SQL examples run against the community-published extension
        continue-on-error: ${{ steps.under-test.outputs.installable != 'true' }}
        env:
          LATERITE_DUCKDB_COMMUNITY: "1"
        run: |
          "$GITHUB_WORKSPACE/.duckdb-leg/bin/python" -m pytest \
            tests/test_docs_duckdb_examples.py -q -rs -s

  # Cross-surface OUTPUT-VALUE gate (X1). Every OTHER gate compares knob NAMES;
  # this one pushes a committed list of (op × input) cases through all four
  # surface legs (python / node / wasm / CLI) and compares the observed output
  # VALUES N-way, with the in-process Rust leaf (emit-cases) as the AUTHORITY
  # column. `--require-legs all` is the anti-rot switch: locally a leg self-skips
  # when its artifact is missing, but IN CI a skipped leg is a FAILURE — that is
  # how this gate avoids being "built, never wired". `--require-engines all` is the
  # same switch one level down: every leg must also say WHICH ENGINE it is running,
  # so the run can state the legs were comparable rather than assume it. Half these
  # legs drive built artefacts that can be stale while every case still matches, and
  # a leg that stops reporting would otherwise degrade to a warning above a green
  # run. Lives in laterite-ags4-xcheck
  # (split out of the dev ags4-compliance crate — its findings half needs the
  # private ags4-parity oracle; laterite-dev#553 reversal, the public-is-dev-home flip).
  # GitHub-hosted: it builds all four surfaces (~50 min cold), so it runs off the
  # 2-lane pool on free public minutes, in parallel with the pool jobs.
  output-values:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      UV_LINK_MODE: copy # see ci.yml's python job — silences the copy-fallback warning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (+ wasm32 target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # sccache + mold if present (no-op off the pool — this job is GitHub-hosted).
      - uses: ./.github/actions/build-accel
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install Python 3.14 via uv
        run: uv python install 3.14
      # --all-extras pulls the [compat] extra (pandas): the python-compat leg
      # drives compat.dataframe_to_AGS4, which needs it.
      - name: uv sync (deps + maturin)
        run: uv sync --all-extras
      # python + python-compat + cli legs: the PyO3 cdylib into the source tree.
      - name: Build python-laterite (maturin develop)
        run: (cd packages/laterite && uv run --no-sync maturin develop --uv)
      # node + cli-npx legs: the napi addon + the tsup dist (emit_js.mjs imports
      # dist/index.mjs).
      - name: Build node (napi debug + tsup dist)
        run: cd rust-packages/laterite-node && npm ci && npm run build:debug
      # wasm-engine leg: the --target web build emit_js.mjs instantiates from bytes.
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - name: Build wasm (release, --target web)
        run: wasm-pack build rust-packages/laterite-ags4-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/src/wasm"
      # cli-native leg: the release binary the launcher-leg subprocesses invoke
      # (emit_cli.py looks for rust-packages/target/release/lat).
      - name: Build lat CLI (release)
        run: cargo build --release --manifest-path rust-packages/Cargo.toml -p laterite-cli
      # Emit one observation file per leg, then compare. `xcheck` exits non-zero on
      # any unexplained split; ZERO normalisation, JSON value equality.
      - name: Cross-surface output-value gate
        run: |
          set -euo pipefail
          M=rust-packages/Cargo.toml
          O=output/xcheck
          cargo run -q --manifest-path "$M" -p laterite-ags4-xcheck --bin emit-cases -- --out "$O"
          uv run --no-sync python tools/xcheck/emit_py.py  --out "$O"
          node                    tools/xcheck/emit_js.mjs --out "$O"
          uv run --no-sync python tools/xcheck/emit_cli.py --out "$O"
          cargo run -q --manifest-path "$M" -p laterite-ags4-xcheck --bin xcheck -- \
            --check "$O" --allow xcheck-allow.json --require-legs all --require-engines all
      - name: upload observations on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xcheck-observations
          path: output/xcheck/
          if-no-files-found: ignore
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Ruleset-drift gate (I2 of the CI/CD audit). The branch-protection ruleset —
  # the required-check SET, enforcement, admin-bypass actors, the strict flag —
  # lives ONLY in repo settings; nothing in the tree pins it, so a silent edit (a
  # required check removed, enforcement dropped to `evaluate`, bypass widened, the
  # protected branch swapped) goes unnoticed until something slips through. Snapshot
  # the canonical ruleset in .github/rulesets/main-protection.expected.json and fail
  # if the live one drifts. Read-only. Needs a fine-grained PAT with
  # `administration: read` in GH_RULESET_TOKEN — the default GITHUB_TOKEN cannot read
  # a ruleset's bypass_actors. GitHub-hosted: pure API + jq, no build, no pool lane.
  ruleset-drift:
    if: github.repository == 'niko86/laterite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the live main-protection ruleset to the committed snapshot
        env:
          GH_TOKEN: ${{ secrets.GH_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          norm=.github/rulesets/normalize.jq
          snapshot=.github/rulesets/main-protection.expected.json
          # Normalise BOTH sides through the SAME filter so formatting / key order
          # can never cause a false diff — only governance content can.
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/19425032" \
            | jq -S -f "$norm" > live.normalized.json
          jq -S -f "$norm" "$snapshot" > expected.normalized.json
          if ! diff -u expected.normalized.json live.normalized.json; then
            echo "::error::The 'main protection' ruleset (19425032) drifted from ${snapshot}. If the change was intentional, regenerate it: gh api repos/${GITHUB_REPOSITORY}/rulesets/19425032 | jq -S -f ${norm} > ${snapshot}"
            exit 1
          fi
          echo "main-protection ruleset matches the committed snapshot."

  # Whole-vault wiki lint — the ENFORCING half of the wiki controls. wiki-lint.yml
  # runs the same checks per-PR, but diff-scoped (`--since`) and deliberately not
  # required: the wiki is the maintainer's to keep aligned, and a contributor
  # shouldn't have a PR blocked because a page they never touched cites a file that
  # moved. So the per-PR run is fast feedback, and THIS run — no `--since`, the full
  # vault, every hard check — is what actually has to stay green. A failure here
  # opens the nightly tracking issue like any other.
  #
  # Stdlib-only (`uv run --no-project`): no wheel, no Rust, ~10s. GitHub-hosted so
  # it doesn't take a pool lane.
  wiki-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: wiki-lint (whole vault, no ratchet)
        run: uv run --no-project python ags-wiki/.bootstrap/lint.py
      # The faithfulness gates. Without these a generator can silently stop
      # generating while its page freezes at whatever it last said — there is no
      # root `tests/` in this repo to catch it.
      - name: reindex --check (index.md == render(the vault))
        run: uv run --no-project python ags-wiki/.bootstrap/reindex.py --check
      - name: gen_wiki_cli --check (verb table == README-cli.md)
        run: uv run --no-project python tools/gen_wiki_cli.py --check
      - name: gen_reference_groups --check (group tier == ags_dictionary.json)
        run: uv run --no-project python tools/gen_reference_groups.py --check
      - name: gen_crate_graph --check (graph == Cargo manifests)
        run: uv run --no-project python tools/gen_crate_graph.py --check
      # gen_wiki_tables was in the per-PR lane but not here, so the ENFORCING half
      # of the wiki controls was one gate short of the advisory half.
      - name: gen_wiki_tables --check (ledger tables == their JSON)
        run: uv run --no-project python tools/gen_wiki_tables.py --check
      - name: gen_observations --check (OBSERVATIONS.md + coverage map == the SSOT)
        run: uv run --no-project python tools/gen_observations.py --check
      - name: gen_observations --check-wiki (O-N pages agree with the SSOT)
        run: uv run --no-project python tools/gen_observations.py --check-wiki
      - name: gen_modality --check (modality-register.md == the SSOT)
        run: uv run --no-project python tools/gen_modality.py --check
      # The structural half of the doc-output gate (#164). The half that RUNS the
      # examples needs the built surfaces and lives in ci.yml's python + node jobs;
      # this one only reads Markdown, so the enforcing lane can carry it too.
      - name: gen_doc_outputs --check-pages (every output block is wired to its example)
        run: uv run --no-project python tools/gen_doc_outputs.py --check-pages

  # Drive ONE tracking issue from the night's results, so a bad night is
  # actionable without watching the Actions tab. GitHub also emails the owner on a
  # scheduled-workflow failure, so this is the durable, dedup'd record — and it
  # no-ops gracefully if the runner has no `gh` (the email still fires).
  #
  # Runs on EVERY night, not just bad ones, because closing is half the job: the
  # old step fired only on failure, so nothing ever closed the tracker. #245 sat
  # open after its cause was fixed, and — because the step comments when a tracker
  # already exists — the next failure would have been a quiet comment on a stale
  # issue instead of a new one anyone would notice.
  #
  # The job list is `toJSON(needs)` rather than a third hand-written copy. It used
  # to appear in `needs:`, in this `if:`, and in `env:`; adding a nightly job and
  # missing one copy silently dropped it from the tracker — a reporter that covers
  # less than it appears to, which is #207's shape. One list now, and it is the
  # dependency list itself.
  notify:
    needs: [coverage, deny, links, wheel-smoke, ruleset-drift, output-values, wiki-lint]
    if: always()
    # GitHub-hosted so `gh` is guaranteed present (the pool image may lack it) —
    # the whole point of this job is to reliably open the tracking issue.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: drive the nightly tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || {
            echo "gh CLI not on runner — relying on the default scheduled-failure email"
            exit 0
          }
          # Stdlib-only by design, so this job needs no Python/uv setup step —
          # see the module docstring. Every decision lives in `plan_items()`,
          # which tests/test_issue_tracker.py exercises branch by branch. The
          # same module drives wiki-ext-drift.yml's issue, hence the name.
          python3 tools/issue_tracker.py
