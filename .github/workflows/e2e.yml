# Web app tests, isolated from ci.yml (rust/python) and deploy-validator.yml so
# a web change/flake never blocks them. Two jobs:
#   * unit — fast, pure-TS vitest (the agsline lossless invariant, severity
#     classification, fix-preview geometry). No wasm, no browser. NOTE: tsc is
#     NOT here — typecheck needs the generated `src/wasm/*.d.ts` (the worker
#     imports them), which only exists after a wasm build; so it lives in e2e.
#   * e2e  — builds the production bundle (wasm + Vite), typechecks against the
#     generated wasm bindings, then runs the Playwright specs (web/e2e/) in
#     headless Chromium against a local `vite preview` — the real
#     validator-in-a-worker + DuckDB-wasm stack on a synthetic fixture.
name: e2e (web)

on:
  # `!web/docs-site/**` subtracts the docs site from `web/**`: the MkDocs docs
  # live under web/ but don't touch the validator app, so a docs-only change
  # must NOT run the app's e2e (the docs have their own `docs` gate in ci.yml,
  # and the deploy still publishes them). The negation must follow `web/**`.
  push:
    branches: [main]
    paths: ["web/**", "!web/docs-site/**", "rust-packages/laterite-ags4-wasm/**", "rust-packages/laterite-ags4-tokenizer-wasm/**", "rust-packages/laterite-ags4-parse/**", "rust-packages/laterite-ags4-censor/**", "rust-packages/laterite-types/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["web/**", "!web/docs-site/**", "rust-packages/laterite-ags4-wasm/**", "rust-packages/laterite-ags4-tokenizer-wasm/**", "rust-packages/laterite-ags4-parse/**", "rust-packages/laterite-ags4-censor/**", "rust-packages/laterite-types/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: build + test only. The failure-path artifact upload uses the
# Actions runtime token, not this one, so contents:read is enough.
permissions:
  contents: read

jobs:
  unit:
    # Fast pure-TS lane: no Rust/wasm toolchain, no Chromium download. The
    # vitest suite imports only wasm-free modules, so it needs no build. (tsc
    # is in the e2e job — it requires the generated wasm bindings.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Unit tests + coverage gate
        # --coverage turns on the v8 provider; the lines threshold lives in
        # vitest.config.ts so local `npm test -- --coverage` enforces the same
        # floor. @vitest/coverage-v8 comes in via `npm ci` above (devDep).
        working-directory: web
        run: npm test -- --coverage

      # Codecov `web` flag — only from the public repo (niko86/laterite), where
      # the badge lives and CODECOV_TOKEN is set. The private mirror skips it
      # (no token set there).
      - name: Upload web coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    # GitHub-hosted: public runs are free minutes, and the warm pool is kept for
    # ci.yml's per-PR builds. Cold wasm build here; e2e runs only on web changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — required when hash-pinned
          targets: wasm32-unknown-unknown

      # sccache + mold (if present) for the wasm-pack install + wasm build.
      - uses: ./.github/actions/build-accel

      - name: Install wasm-pack
        # Install wasm-pack when the runner doesn't already have it (GitHub-hosted
        # doesn't); it then fetches a matching wasm-bindgen + binaryen on first build.
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked

      - name: Build wasm (release)
        run: wasm-pack build rust-packages/laterite-ags4-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/src/wasm"

      - name: Build tokenizer wasm (release)
        # The tiny AGS4 tokenizer/quoter wasm (#533) the app uses on the main
        # thread — separate ~30 KB module, built from the parse + types leaves.
        # Before typecheck, which needs its generated .d.ts (App.tsx → tokenizer.ts).
        run: wasm-pack build rust-packages/laterite-ags4-tokenizer-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/src/wasm-tokenizer"

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps + Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Typecheck
        # After the wasm build above, so `src/wasm/*.d.ts` (imported by the
        # validator worker) resolves; vite build doesn't run tsc itself.
        working-directory: web
        run: npm run typecheck

      - name: Tokenizer wasm — size gate + wasm test lane (#533)
        # Prove the tokenizer wasm stayed tiny (a heavy dep creeping in would
        # balloon it), then run the tokenizer-dependent vitest lane (agsline
        # display helpers + fix-preview geometry) against the real wasm — these
        # are excluded from the fast pure-node `unit` job above.
        working-directory: web
        run: |
          npm run check:wasm-tokenizer-size
          npm run test:wasm

      - name: Build site
        working-directory: web
        run: npm run build

      - name: Run e2e
        working-directory: web
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        # v7: v4 runs on Node 20, which GitHub deprecates (forced to Node 24 from
        # 2026-06-16); v7 is the current major and runs on Node 24.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
