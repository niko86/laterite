# Build the client-side AGS4 validator site (Rust wasm + SolidJS/Vite)
# and deploy it to GitHub Pages.
#
# AUTO on push to main when the site's sources change (see the `paths`
# filter), plus manual workflow_dispatch. Runs GitHub-hosted (ubuntu-latest):
# public repos get free Actions minutes, and Pages deploy via OIDC is the
# well-trodden GitHub-hosted path, so there's no reason to tie up the warm
# pool for a deploy. The runner needs the wasm32 target installable, Node, and
# network reach to GitHub releases for wasm-pack's wasm-bindgen/binaryen.
#
# The one dispatch input, `base`, is Vite's deploy path; it defaults to `/`
# (what the custom domain serves) — the same default a push uses. It exists
# so a base change can be bridged in ONE build: the domain setting and this
# default cannot change atomically, so dispatch with the other value across
# the gap rather than leaving every asset 404ing until a PR merges.

name: Deploy AGS4 validator site

on:
  # Auto-deploy when the built artifact's sources change on main. The
  # site embeds laterite-ags4-wasm, which wraps laterite-ags4-validator + laterite-ags4-types, so a
  # change to any of those (or the web app, or this workflow) should
  # rebuild + republish.
  push:
    branches: [main]
    paths:
      - "web/**"
      - "rust-packages/laterite-ags4-wasm/**"
      - "rust-packages/laterite-ags4-validator/**"
      - "rust-packages/laterite-ags4-types/**"
      # The tiny main-thread tokenizer wasm (#533) + its other leaf source
      # (parse; types already listed above).
      - "rust-packages/laterite-ags4-tokenizer-wasm/**"
      - "rust-packages/laterite-ags4-parse/**"
      # The shared scrub engine (#581) — the engine wasm's `censor()` export
      # drives the browser Anonymiser off it.
      - "rust-packages/laterite-ags4-censor/**"
      - ".github/workflows/deploy-validator.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Vite base path (must match the site URL path; / on the custom domain)"
        type: string
        default: /

# Pages deploy needs an OIDC id-token + pages:write; contents:read to
# checkout. Least privilege otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys against Pages at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # GitHub-hosted: the standard Pages/OIDC deploy path (public repos get free
    # Actions minutes, so no reason to tie up the warm pool for a deploy).
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — required when hash-pinned
          targets: wasm32-unknown-unknown

      # sccache + mold (if present) for the wasm-pack install + wasm build.
      # Complements the Swatinem target/ cache below (different layers).
      - uses: ./.github/actions/build-accel

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust-packages

      - name: Install wasm-pack
        # Install wasm-pack when the runner doesn't already have it (GitHub-hosted
        # doesn't; self-contained, no third-party action). wasm-pack then fetches a
        # matching wasm-bindgen + binaryen (wasm-opt) on first build.
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked

      - name: Build wasm (release, optimized)
        run: wasm-pack build rust-packages/laterite-ags4-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/src/wasm"

      - name: Build tokenizer wasm (release, optimized)
        # The tiny AGS4 tokenizer/quoter wasm (#533) the app instantiates on the
        # main thread — a separate ~30 KB module the production bundle needs.
        run: wasm-pack build rust-packages/laterite-ags4-tokenizer-wasm --target web --release --out-dir "$GITHUB_WORKSPACE/web/src/wasm-tokenizer"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        env:
          # On a push, inputs.base is empty — fall back to the same default
          # the dispatch input uses so the Pages base path is always set.
          VITE_BASE: ${{ inputs.base || '/' }}
          # Where the two oversized DuckDB bundles are served from. Setting this
          # both rewrites their URLs and MOVES them out of dist/ into
          # web/r2-upload/ (see vite.config.ts) — without it the app is 73 MiB
          # over Cloudflare's 25 MiB-per-asset cap and the deploy is rejected.
          VITE_DUCKDB_CDN: https://cdn.laterite.dev
        run: |
          npm ci
          npm run build

      # mkdocs builds into web/docs-dist (its site_dir) — its OWN directory,
      # not inside web/dist. It used to build into web/dist/docs because one
      # Pages artifact carried the app and the docs together; on separate hosts
      # that would ship a second copy of the whole documentation inside the app
      # Worker.
      #
      # `uv sync --group docs` builds the local working-tree `laterite` wheel +
      # installs mkdocs-material + mkdocstrings (the API reference introspects the
      # installed wheel) + gen-files/literate-nav (the group catalogue). The Rust
      # toolchain is already present (wasm-pack installed it above; the host
      # target builds the PyO3 wheel). Non-strict on purpose: a docs link nit must
      # never block the deploy — the PR-time `docs` job (ci.yml) is the strict gate.
      - name: Set up uv (docs build)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build docs
        run: |
          uv sync --group docs
          # uv sync installs laterite editable but does NOT build the PyO3 cdylib;
          # mkdocstrings' runtime import + the catalogue generator need it built +
          # co-located, so run maturin develop (same as the ci.yml docs job).
          (cd packages/laterite && uv run --no-sync maturin develop --uv)
          cd web/docs-site && uv run --no-sync mkdocs build

      # Two Workers, one per host. Each config carries its own `custom_domain`
      # route, so Cloudflare creates the DNS record and issues the certificate
      # on deploy — nothing pre-creates app./docs. records, and pre-creating one
      # would actively BREAK the deploy (Cloudflare refuses a custom domain on a
      # hostname that already has a CNAME).
      # The DuckDB bundles, to R2. Their filenames are content-hashed by Vite,
      # so an unchanged engine keeps the same key and re-uploading is a no-op
      # in effect — but 73 MiB per deploy is worth skipping, hence the `get`
      # probe. There is no bulk `r2 sync`, so this is a loop over two files.
      #
      # Ordering matters: upload BEFORE the Worker deploy. The app's JS already
      # points at these URLs, so shipping the app first leaves a window where
      # the first Explore click 404s.
      - name: Upload the DuckDB engine to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: web
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in r2-upload/assets/*.wasm; do
            key="assets/$(basename "$f")"
            if npx wrangler r2 object get "laterite-cdn/$key" --remote >/dev/null 2>&1; then
              echo "== $key already in R2, skipping $(du -h "$f" | cut -f1)"
              continue
            fi
            echo "-> uploading $key ($(du -h "$f" | cut -f1))"
            npx wrangler r2 object put "laterite-cdn/$key" \
              --file "$f" --content-type application/wasm --remote
          done

      - name: Deploy the app Worker (app.laterite.dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy

      - name: Deploy the docs Worker (docs.laterite.dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/docs-site
          command: deploy

      # GitHub Pages outlives the move as a REDIRECT SHIM, and nothing else.
      #
      # laterite 0.8.x and 0.9.0 shipped READMEs to PyPI, npm and crates.io
      # pointing at niko86.github.io/laterite/... A published README cannot be
      # edited, so those links must keep resolving forever. The alternative —
      # keeping a full copy of the site here — would mean building the app twice
      # (Pages needs base=/laterite/, the Worker needs base=/) to serve bytes
      # nobody looks at.
      #
      # Pages serves 404.html for any path it does not recognise, and this
      # artifact contains almost nothing, so one file catches every legacy URL
      # and routes it to the right new host.
      - name: Upload Pages artifact (redirect shim)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/legacy-pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
