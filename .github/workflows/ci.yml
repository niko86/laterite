# PR-tier CI: build + test on every push to a branch + every PR.
#
# Two jobs: `rust` then `python`. The Python job needs the compiled
# PyO3 cdylibs, so it depends on `rust` to fail fast — if the Rust
# build is red, no point spending matrix minutes on Python.
#
# Sticks to Linux only on the free tier — the per-OS wheel build is
# the release workflow's job (matrix on tag), not every PR.

name: ci

on:
  push:
    branches: [main, master, "release/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "CHANGELOG.md"
      - "LICENSE"

# Cancel previous runs on the same ref when a new commit lands —
# keeps the free-tier minute budget under control.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    # 35 min: bundled-DuckDB linkage in ags5db is the long pole on a
    # cold cache; warmed runs typically finish in <8 min.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache understands cargo's directory layout
      # (registry, git, target/{debug,release}) and only caches what
      # actually changes — much better hit rate than a hand-rolled
      # actions/cache key on Cargo.lock alone.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-packages

      - name: cargo fmt --check
        working-directory: rust-packages
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: rust-packages
        run: cargo clippy --workspace --release -- -D warnings

      - name: cargo test
        working-directory: rust-packages
        run: cargo test --workspace --release

  python:
    runs-on: ubuntu-latest
    needs: rust
    # 35 min: maturin develop on both wheels triggers full Rust rebuild
    # for the PyO3 cdylibs (different feature set than the rust job's
    # build, so cache hits are partial).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        # Pin to a specific v8 patch — astral-sh/setup-uv hasn't
        # published a floating `v8` major tag yet (only `v7`).
        # Revisit once `v8` floating exists.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Install Python 3.14 via uv
        run: uv python install 3.14

      - name: Cache cargo (python job)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-packages
          # Separate cache key from the `rust` job — the cdylib build
          # has a different feature/target set, so sharing a key
          # produces near-misses that slow both jobs down.
          key: python

      - name: uv sync (builds both wheels via maturin)
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: pytest
        run: |
          uv run pytest \
            packages/laterite/tests \
            packages/laterite-ags5/tests \
            -q --tb=short
