# PR-tier CI: build + test on every PR (the single validation gate).
#
# Runner routing (the public-repo rule). A PR from a FORK runs on
# GitHub-hosted `ubuntu-latest` — untrusted code must never execute on the
# self-hosted pool (LAN + shared-sccache reach). Our own same-repo PRs,
# pushes, schedules and dispatches run on the warm `laterite-linux` pool
# (sccache-on-NFS, switched on by ./.github/actions/build-accel), so the
# redundant per-job compiles are cache hits rather than cold rebuilds. Every
# `runs-on` below is that same fork-routing ternary.
#
# The Python job needs the compiled PyO3 cdylib, so it `needs: rust` to fail
# fast — no point spending build minutes on Python if the Rust build is red.
# Per-OS wheels are the release workflow's job (matrix on tag), not every PR.

name: ci

on:
  # Single validation gate: `pull_request`. Every change reaches master via a
  # PR (owner-merged) and GitHub runs CI against the merge result, so a `push`
  # trigger adds nothing but a duplicate run. Previously `push: release/**` also
  # fired here, which DOUBLE-ran the heavy maturin+DuckDB suite on every
  # release-prep branch — it matches `release/**` AND has a PR, and the two
  # events carry different refs (`refs/heads/release/x` vs `refs/pull/N/merge`)
  # so the `concurrency` group below can't collapse them. One run per PR now.
  pull_request:
    branches: [main]
    # NO trigger-level `paths-ignore`. Path-filtering lives ENTIRELY in the
    # `changes` job below (the single source of truth) so the heavy jobs report a
    # status on EVERY PR — they run, or skip-as-SUCCESS via their `if:` when the
    # filter says no code changed. That's what lets rust/python/node be REQUIRED
    # status checks WITHOUT a docs/web-only PR blocking forever on a check that a
    # trigger-skip would leave eternally "pending". The only cost is a ~7s
    # `changes` job on a docs PR; the bundled-DuckDB suite still skips.
  workflow_dispatch:
  # Nightly health check on `main`. A scheduled run executes against the default
  # branch, so it — and only it — refreshes the `ci.yml` badge with a real recent
  # run: PR runs happen on the merge-ref and never feed the badge, so without this
  # the badge freezes at the last push-to-main run. Also catches environmental
  # drift (a yanked dep, a toolchain shift) a static `main` develops. Routed to
  # ubuntu-latest below (like the other nightlies) so it doesn't depend on the
  # self-hosted pool being up overnight.
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily (nightly.yml runs at 04:00)

# Cancel previous runs on the same ref when a new commit lands —
# keeps the free-tier minute budget under control.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege: both jobs only check out + build + test — no writes to the repo,
# releases, or deployments. Scope the token down from the repo default.
permissions:
  contents: read

jobs:
  # Gate the heavy jobs on actual CODE changes. A docs / tools / assets PR (no
  # Rust or Python source change) skips rust/test/python — they'd only
  # re-measure what master already passed, and the redundant bundled-DuckDB
  # compiles pile up and starve the ephemeral pool under PR contention (the
  # "empty step conclusion + missing log" runner deaths). Web tests have their
  # own paths filter in e2e.yml. On NON-PR events (push to release/**, manual
  # dispatch) the heavy jobs always run — the gate only filters pull_requests.
  changes:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads the PR's changed files
    outputs:
      code: ${{ steps.filter.outputs.code }}
      node: ${{ steps.filter.outputs.node }}
      docs: ${{ steps.filter.outputs.docs }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `code` = anything that can change a Rust/Python test outcome: the
          # crates, the wheels (source + tests), the deps, this workflow, the
          # build-accel action, the pyi generator (its drift test lives in the
          # python job), and the docs EXAMPLES + their shared fixture
          # (tests/test_docs_examples.py runs them in the python job). The docs
          # *pages* deliberately DON'T trip `code` — they're link-gated by the
          # cheap `docs` job below; tools/assets/release-tooling don't either.
          # `node` = the laterite-node crate + TS package (drives the `node` job).
          # `docs` = the MkDocs site (drives the `docs` strict-build link gate).
          filters: |
            code:
              - 'rust-packages/**'
              - 'packages/**'
              - 'tests/**'              # the root suite = AGS4 dictionary-faithfulness tests (run below)
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tools/generate_pyi.py'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-accel/**'
              - 'web/docs-site/examples/**'  # docs example sources — test_docs_examples.py executes these
              - 'examples/sample_site.ags'   # the fixture that gate reads (subprocess cwd = repo root)
              - 'web/docs-site/scripts/**'   # catalogue_data/gen_* — its drift gate (test_groups_catalogue_faithful) runs in the python job
              # SSOT paths whose faithfulness gate lives in the root `tests/`
              # suite — which is private-only (blocklisted from this public
              # mirror). On this repo those gates aren't present, so an SSOT / doc
              # edit here would fire the ~12-min `python` job for a gate that can't
              # run (a README badge bump rebuilding the whole wheel is the visible
              # symptom). Keep ONLY the paths a test or job IN THIS REPO actually
              # reads; the rest return alongside the private faithfulness suite.
              - 'modality.json'          # read by test_modality_parity (packages/laterite/tests)
              - 'COMPAT.md'              # referenced by test_laterite (packages/laterite/tests)
              - 'tools/gen_census.py'    # referenced by test_merge (packages/laterite/tests)
              - 'tools/wheel_smoke.py'   # the wheel-smoke job's post-install smoke (#554)
            node:
              # The napi addon links sibling crates — laterite-ags4-validator,
              # laterite-types, laterite-ags4-emit (see laterite-node/Cargo.toml) —
              # so a change to ANY of them rebuilds + can break the node addon.
              # Watching only laterite-node/** silently SKIPPED the node job on a
              # dependency change (a validator/types/emit edit ran rust + python but
              # not node). Watch all of rust-packages/** so node can never drift out
              # of sync with its deps; the node job is ~40s, so the occasional run on
              # an unrelated crate is cheap insurance against a silent skip.
              - 'rust-packages/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-accel/**'
              - 'web/docs-site/examples/node/**'  # docs Node snippets — test/docs-examples.test.ts executes these in vitest
              - 'examples/sample_site.ags'        # the fixture those snippets read (subprocess cwd = repo root)
            docs:
              # The MkDocs site + its nav/config drive the `docs` job's
              # `mkdocs build --strict` build. The examples under
              # web/docs-site/examples/** ALSO sit in `code`, so the python job
              # re-runs the RUNTIME example gate — link/autodoc half here, example
              # runtime there. The importable Python source is here too because
              # the mkdocstrings API reference introspects it: a docstring edit
              # that renames/removes a cross-ref target must re-run --strict.
              - 'web/docs-site/**'
              - 'packages/laterite/python/**'
              # The docs DEPENDENCY set: the `docs` group here and the resolved
              # lock. A dep/lock change silently alters what `mkdocs build` runs
              # against, and this was the only job that would notice — so it must
              # re-run. Learned the hard way: `properdocs` (an ad-injecting MkDocs
              # fork pulled in transitively by mkdocs-gen-files/literate-nav)
              # entered via a lock re-resolve and shipped unseen precisely because
              # a lockfile change did not trigger the strict build.
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            web:
              # ts-lint's web surface (the Solid browser validator's TS): eslint +
              # prettier over web/**. The laterite-node TS half is covered by the
              # `node` output (rust-packages/**), which ts-lint is ALSO gated on, so
              # a wasm-crate change still re-lints web (its generated .d.ts feeds
              # web's type-aware rules). A web/docs-site-only change over-triggers
              # here (harmless — the job only lints), so no negation is used.
              - 'web/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-accel/**'

  # Supply-chain gate: RustSec advisories + the permissive-license policy +
  # crates.io-only sources + duplicate-version warnings. Config + the documented
  # advisory exceptions live in rust-packages/deny.toml. Fast — no compilation.
  deny:
    needs: changes
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, #561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain (cargo-deny shells out to `cargo metadata`)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: install cargo-deny
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: cargo-deny
      - name: cargo deny check
        working-directory: rust-packages
        run: cargo deny check

  rust:
    needs: changes
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, #561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    # 35 min ceiling (generous): the AGS5 crates (the bundled-DuckDB long pole)
    # were decoupled to ags5/, so the kept workspace links no bundled DuckDB and
    # a cold build is much faster; warmed runs (sccache hits) finish in minutes.
    timeout-minutes: 35
    steps:
      # Ephemeral pool runners start each job with a fresh _work, so there's
      # no persisted target/ to keep — the warm cache is sccache (content-
      # addressed, on the shared NFS mount), turned on by build-accel below.
      # See concepts/ci-and-runners.md for the sccache/ephemeral model.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Name the channel explicitly: pinned to a SHA there's no `@stable` ref
          # for the action to infer the toolchain from (and Dependabot bumps the
          # SHA over time, so don't rely on the action's default staying `stable`).
          toolchain: stable
          components: rustfmt, clippy

      # Turn on sccache + mold IF the runner has them (the laterite-runner pool
      # image does; a GitHub-hosted fallback doesn't → no-op). Must run before the
      # build steps so the env it exports is in scope.
      - uses: ./.github/actions/build-accel

      # No Swatinem/rust-cache: sccache (shared, on NFS) is the build cache
      # now, so a ~0.5 GB network target/-cache round-trip would be pure
      # overhead — and it wouldn't cache the bundled-DuckDB C++ that sccache,
      # wrapping CC/CXX, does.

      - name: cargo fmt --check
        working-directory: rust-packages
        run: cargo fmt --all -- --check

      # laterite-ags4-wasm is a wasm32 cdylib (the browser validator); it is
      # built + linted for its real target via wasm-pack in
      # deploy-validator.yml. Exclude it from the host workspace
      # clippy — compiling wasm-bindgen macro output on the host
      # under -D warnings is toolchain-fragile and serves no purpose.
      # Debug, not --release: nothing in CI asserts wall-clock (no perf gate), so
      # the release profile's thin-LTO + codegen-units=1 just burned compile time.
      # The `laterite_ags4` DuckDB loadable extension is NOT built here — it lives
      # in its own canonical repo `niko86/laterite-duckdb` with its own CI (it
      # path-deps the library crates via a submodule of the public mirror). It
      # couldn't co-build anyway: its `loadable-extension` libduckdb-sys is
      # mutually exclusive with the *bundled* DuckDB the rest of the workspace
      # links ("DuckDB API not initialized" at runtime).
      - name: cargo clippy
        working-directory: rust-packages
        # --all-targets lints tests/benches/examples too, not just lib/bin code.
        run: cargo clippy --workspace --all-targets --exclude laterite-ags4-wasm --exclude laterite-ags4-tokenizer-wasm -- -D warnings

      # The shared parse leaf (#168) becomes a wasm dependency of the browser
      # validator from Phase 3 on. Build it for wasm32 NOW so a
      # wasm-incompatible change (name-allowlist ≠ wasm-compilability — memchr's
      # std::arch paths, encoding_rs) fails here, not at adoption.
      - name: cargo build (parse leaf + tokenizer wasm, wasm32)
        working-directory: rust-packages
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p laterite-ags4-parse --target wasm32-unknown-unknown
          # The tiny browser tokenizer wasm (#533) is built from parse + types;
          # compile it for wasm32 here so a wasm-incompatible change to either
          # leaf (or the wrapper) fails in this fast job, not only in e2e/deploy.
          cargo build -p laterite-ags4-tokenizer-wasm --target wasm32-unknown-unknown
          # The shared scrub engine (#581) becomes a wasm dependency of the
          # engine wasm (browser Anonymiser) in Phase 2. Build it for wasm32 NOW
          # so a wasm-hostile change (it pulls parse + reference + types) fails
          # in this fast job, not at adoption.
          cargo build -p laterite-ags4-censor --target wasm32-unknown-unknown

      # No `cargo test --workspace` here: the parallel `test` job below is the
      # PR-tier Rust test authority (plain, sccache-warm), and the nightly
      # (nightly.yml) runs the heavier INSTRUMENTED coverage measurement. Keeping
      # the workspace test out of THIS job is deliberate — folding it in would
      # lengthen the `rust` -> `python` critical path (python `needs: rust`) and
      # make every PR slower, for no gain over running it in parallel.

      # laterite-ags4-wasm is a wasm32 cdylib built elsewhere, so it's excluded
      # from the `test` / nightly-coverage workspace runs. Its host-compilable
      # unit tests (the typed-Arrow parse() parity guard) run fine on the host
      # without the wasm target, so run them on their own here — in this fast
      # job, beside the wasm32 build check above.
      - name: cargo test (laterite-ags4-wasm parity)
        working-directory: rust-packages
        run: cargo test -p laterite-ags4-wasm

      # sccache hit/miss visibility (no-op if sccache isn't on this runner).
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # build-ext: compile the PyO3 cdylib ONCE ("build once"). The python and
  # docs jobs both used to run their own `maturin develop`, compiling the same
  # debug _laterite_native .so twice per PR (wheel-smoke builds a third, but that
  # is a RELEASE wheel install-smoke and legitimately its own artefact — left
  # alone). Here the debug cdylib is built a single time and uploaded; python and
  # docs download it into the package source tree instead of recompiling. sccache
  # already made the repeat compiles cache-hits, so the win is the redundant LINK
  # plus a freed slot on the 2-runner pool, not raw wall-clock.
  build-ext:
    needs: changes
    # Runs whenever EITHER consumer runs: `code` (python) OR `docs` (docs). Same
    # !cancelled() + filter-failed-means-run discipline as the other jobs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true'
        || needs.changes.outputs.docs == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    env:
      UV_LINK_MODE: copy
    # This job now carries the one cold cdylib build (PyO3 + the workspace as a
    # lib), so it gets the generous ceiling the python job used to need.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — see the rust job's note above
      # sccache + mold for the maturin (PyO3) build, if the runner has them.
      - uses: ./.github/actions/build-accel
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install Python 3.14 via uv
        run: uv python install 3.14
      - name: uv sync (deps + maturin into the venv)
        run: uv sync --all-extras
      # Build the debug abi3 cdylib into packages/laterite/python/laterite/ —
      # byte-identical to the `maturin develop` the python/docs jobs used to run
      # (same maturin from the venv, same 3.14 interpreter), so the artefact they
      # download is exactly what they would have compiled themselves.
      - name: Build native extension (maturin develop)
        run: (cd packages/laterite && uv run --no-sync maturin develop --uv)
      - name: Upload prebuilt cdylib
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: laterite-cdylib
          # Glob so the abi3 (`_laterite_native.abi3.so`) or interpreter-tagged
          # name both match; error rather than silently upload nothing.
          path: packages/laterite/python/laterite/_laterite_native*.so
          if-no-files-found: error
          retention-days: 1
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # laterite-node: the napi addon + TS package. The `rust` job above already
  # compiles the crate (workspace clippy/test); this gate is the TS half —
  # build the native addon, typecheck, and run the vitest suite (read/validate/
  # emit, DuckDB sql/at + arrow output, typed-graph drift, transport). Same
  # self-hosted Linux runner + sccache (the napi build reuses the warm cache).
  node:
    needs: changes
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, #561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.node == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust-packages/laterite-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold (no-op if the runner lacks them) — the napi build's Rust
      # half shares the same content-addressed cache as the `rust` job.
      - uses: ./.github/actions/build-accel

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      # `npm ci` requires package-lock.json to stay in sync with the registry.
      # The `@laterite/native-*` optional deps are pinned to the package version;
      # once a version is published, the lockfile must record its resolved entry
      # (an unresolved/empty entry → EUSAGE). So regenerate + commit the lockfile
      # after each platform-package publish (see RELEASING-node.md). The matching
      # platform `.node` gets installed here but the local napi build below
      # overrides it (the loader prefers ./laterite-node.<triple>.node).
      - name: npm ci
        run: npm ci

      # Debug napi build (no --release: CI asserts no wall-clock) + the tsup dist
      # — proves the native addon AND the shippable dual ESM/CJS bundle build.
      - name: Build (napi debug + tsup dist)
        run: npm run build:debug

      # The napi loader (index.js) + types (index.d.ts) are committed (the
      # npm-publish job needs them and never runs `napi build`). `napi build`
      # above just regenerated them — assert they match the tracked copies so an
      # edit to the #[napi] surface can't ship a stale loader/types.
      - name: napi loader/types drift guard
        run: git diff --exit-code -- index.js index.d.ts

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      # vitest: read/validate/emit, the typed-graph generator drift guard, and
      # the DuckDB sql/at suite (the optional @duckdb/node-api peer is a devDep;
      # the { arrow: true } path fetches DuckDB's `arrow` community extension).
      # --coverage (v8) instruments the ts/ wrapper the tests import directly and
      # writes coverage/lcov.info for the Codecov `node` flag below.
      - name: vitest (+ coverage)
        run: npm run test:coverage

      # Codecov `node` flag — public repo only (where the badge lives + the token
      # is set). Measures the TS wrapper; the Rust engine's number is the nightly
      # cargo-llvm-cov `rust` flag. codecov-action is a `uses:` step so it runs at
      # the repo root — hence the full path to the node package's lcov.
      - name: Upload Node coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-packages/laterite-node/coverage/lcov.info
          flags: node
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Packaging smoke: `npm pack` the package and run read/table/validate/emit
      # against the PACKED dist + native binary — the thing `npm install laterite`
      # ships. CI builds the addon itself, so a publish-only gap (the npm-publish
      # job consumes prebuilt .nodes, never running `napi build`) is invisible to
      # every build-first job; this exercises the consumer artifact instead.
      - name: packaging smoke (pack + run the built library)
        run: npm run smoke:pack

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # TS lint + format gate (#585 / #615): the two shipped TS surfaces — web/ (the
  # Solid browser validator) and rust-packages/laterite-node (the npm bindings) —
  # run `eslint . --max-warnings 0` (0 errors AND 0 warnings) + `prettier --check`.
  # The #615/#621 burn-down fixed every rule at source and flipped them to `error`;
  # `--max-warnings 0` (#65) makes a future regression to `warn` fatal too, so the
  # "flip to error" can't silently erode. This is the CI-enforcement half, so a
  # regression can't merge (until now the gate was runnable locally via `npm run
  # lint` / `format:check` but nothing enforced it per-PR).
  #
  # web/ MUST build its wasm bindings first: eslint's type-aware rules
  # (`no-unsafe-*`) resolve the `../wasm/ags4_wasm.js` import through its GENERATED
  # .d.ts. With no wasm built the import is `any` and every call through it trips a
  # FALSE no-unsafe error (75 of them) — so the wasm build is a lint prerequisite,
  # not a test artefact. node/ needs no wasm (it links its own napi addon).
  ts-lint:
    needs: changes
    # Runs when either TS surface (or its inputs) changed. Same !cancelled() +
    # filter-failed-means-run discipline as the other jobs. `node` covers the
    # laterite-node TS + the rust-packages/** wasm crates web's types derive from;
    # `web` covers web/**.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.node == 'true'
        || needs.changes.outputs.web == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (+ wasm32 for web's wasm bindings)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # sccache + mold (no-op off the pool) — the wasm crate compile shares the
      # cache the `rust` job populated (it builds the same crates for wasm32).
      - uses: ./.github/actions/build-accel

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked

      # --- laterite-node (npm bindings): lint + format, no wasm needed ---
      - name: node — install
        working-directory: rust-packages/laterite-node
        run: npm ci
      - name: node — eslint + prettier
        working-directory: rust-packages/laterite-node
        run: |
          npm run lint
          npm run format:check

      # --- web (browser validator): build wasm bindings, then lint + format ---
      - name: web — install
        working-directory: web
        run: npm ci
      - name: web — build wasm bindings (generates the .d.ts the type-aware rules need)
        working-directory: web
        run: npm run build:wasm:all
      - name: web — eslint + prettier
        working-directory: web
        run: |
          npm run lint
          npm run format:check

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # PR-tier Rust test authority. The heavier INSTRUMENTED coverage MEASUREMENT
  # moved to the nightly (nightly.yml) — `-C instrument-coverage` changes
  # RUSTFLAGS so every Rust crate is an sccache MISS (only the bundled-DuckDB
  # C++ stays cached via CC/CXX), which made it the single longest job on the PR
  # board. This plain `cargo test` uses the SAME non-instrumented profile the
  # rest of CI builds, so it is cache-warm run over run, not a cold recompile.
  # PARALLEL — no `needs` beyond `changes` — so it never slows the fast
  # `rust` -> `python` critical path (folding it into `rust` would).
  #
  # Scope: the workspace minus laterite-ags4-wasm (a wasm32 cdylib, built +
  # host-tested in the `rust` job) and the binding cdylibs laterite-py (PyO3) +
  # laterite-node (napi) — exercised by the Python / Node suites, never by
  # `cargo test` (laterite-node further can't even link a standalone lib-test
  # under napi 3: its N-API symbols only resolve once the Node host loads the
  # addon). The nightly coverage run uses the identical exclude set.
  test:
    needs: changes
    # `!cancelled()` is load-bearing (see the rust job's note): a failed `needs`
    # must not silently skip us, and `!= 'success'` means any non-answer runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold (no-op off the pool) — the plain profile shares the cache
      # the `rust` job populated.
      - uses: ./.github/actions/build-accel

      - name: cargo test (workspace)
        working-directory: rust-packages
        run: |
          cargo test --workspace \
            --exclude laterite-ags4-wasm \
            --exclude laterite-ags4-tokenizer-wasm \
            --exclude laterite-py \
            --exclude laterite-node

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  python:
    needs: [changes, build-ext]
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, #561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    #
    # NB there is deliberately NO `needs.build-ext.result == 'success'` guard:
    # build-ext (the prebuilt-cdylib producer) is NOT a required check, so if it
    # fails python must FAIL — its download-artifact step 404s — not SKIP. A
    # skipped required check counts as success (the #561 trap), which would let a
    # broken build merge. `!cancelled()` runs python despite a build-ext failure
    # so the missing artefact surfaces as red here (python IS required).
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    env:
      # uv's download cache (persistent runner home) and the workspace venv
      # land on different filesystems on the Docker runner, so uv can't
      # hardlink packages into the venv and warns on every sync/run. The
      # copy fallback is what already happens (≈ms for our handful of
      # packages); this just acknowledges it so the log isn't noisy. NOT a
      # perf fix — that would need the cache to share the venv's filesystem.
      UV_LINK_MODE: copy
    # 30 min ceiling: the cdylib is now built ONCE in build-ext and downloaded
    # here (see the download step below), so this job's only compile is the lean
    # lat CLI (no bundled DuckDB) plus uv sync + pytest — comfortably under 30 on
    # a warm sccache. (Was 50 when this job compiled the PyO3 cdylib itself.)
    timeout-minutes: 30
    steps:
      # needs: build-ext gives this job the prebuilt _laterite_native cdylib
      # (downloaded below) instead of recompiling it. The Rust toolchain +
      # build-accel below are STILL needed — not for the cdylib, but for the lean
      # lat CLI build further down (the byte-parity tests exercise the shipped
      # binary at target/release/lat).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — see the rust job's note above

      # sccache + mold for the maturin (PyO3 + bundled-DuckDB) build, if present.
      - uses: ./.github/actions/build-accel

      - name: Install uv
        # Pin to a specific v8 patch — astral-sh/setup-uv hasn't
        # published a floating `v8` major tag yet (only `v7`).
        # Revisit once `v8` floating exists.
        # enable-cache: false — uv keeps its own download cache under the
        # persistent runner home, so resolution stays warm locally; the
        # GitHub cache round-trip (+ the Windows tar/gzip save quirk) was
        # avoidable overhead.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install Python 3.14 via uv
        run: uv python install 3.14

      # No Swatinem/rust-cache (python job): sccache is the shared build
      # cache, so maturin's compile hits it directly — no separate network
      # target/-cache key to download.

      - name: uv sync (deps + maturin into the venv)
        run: uv sync --all-extras

      - name: Download prebuilt cdylib
        # The _laterite_native .so that build-ext compiled once. uv sync
        # above installed laterite EDITABLE (import resolves to the package's
        # python/ source tree) but did not build the extension; dropping the
        # prebuilt .so into that same tree makes `import laterite` work with
        # exactly the layout `maturin develop` used to produce — one extension,
        # nothing recompiled, so no editable-vs-wheel shadowing. A missing
        # artefact (build-ext failed) 404s here → this required job goes red.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: laterite-cdylib
          path: packages/laterite/python/laterite/

      - name: Build lat CLI (for the byte-parity tests)
        # The byte-parity tests (test_cli_json_ndjson_exit_byte_parity et al.)
        # compare the Python `laterite._cli` output against the Rust lat
        # binary at target/release/lat, and @skipif when it's absent.
        # The maturin step above builds only the PyO3 cdylibs, so without this
        # the parity tests SILENTLY SKIP in CI — the Rust↔Python CLI contract
        # goes unchecked on every PR. lat is lean (no bundled DuckDB),
        # so this release build is cheap and sccache-accelerated (build-accel
        # above wraps CC/CXX/rustc). Release, not debug: the test hard-codes
        # the target/release path (matching how the binary ships).
        working-directory: rust-packages
        run: cargo build --release -p laterite-ags4-check

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        # Enforce the formatter (#547): pyproject ignores E501 ("let the formatter
        # handle it"), but until now nothing RAN a formatter, so line length was
        # enforced by nobody. Beside `ruff check` — both Astral, both fast, no
        # build needed. `ruff format .` is the fix if this goes red.
        run: uv run ruff format --check .

      - name: ty check (type-faithfulness gate)
        # Astral `ty` over the SHIPPED `laterite` package (scope + the abi3-py312
        # floor are set in pyproject `[tool.ty]`). Runs in the project venv (`uv
        # run`, NOT `uvx`) so it resolves polars/duckdb + the generated
        # `_laterite_native.pyi` and checks the hints against real types — the
        # #303 Phase-1 gate that the type hints can't lie. Beside `ruff check`:
        # both Astral, both fast. Blocking from the start — the surface is clean
        # (its first run caught 3 py3.14-only `except A, B:` clauses that are a
        # SyntaxError on the 3.12/3.13 the wheel ships to; now parenthesized).
        run: uv run ty check

      - name: pytest (+ coverage floor)
        # -n 4: parallel across 4 xdist workers (the host has 8 cores;
        # 4 leaves headroom for the other services sharing it). The
        # suites isolate via per-test tmp_path, so workers don't collide.
        # --durations=20: surface the slowest tests so heavy fixtures can
        # be targeted (session scope, parametrize) over time.
        #
        # --cov gates the laterite Python surface (scope set in pyproject
        # [tool.coverage.run]); pytest-cov combines the per-xdist-worker data
        # automatically. --cov-fail-under is a FLOOR, ratcheted up.
        #
        # History: introduced at 68 (CI ~71%); RATCHETED to 80 after the
        # laterite coverage push. #91 drove the CLI in-process (_cli.py 0% ->
        # 99%) and replaced the python-ags4 sibling-clone compat fixtures with
        # committed clean-room synthetic ones; #88 did the same for the
        # round-trip/dedup fixture. So those tests now RUN in CI instead of
        # silently skipping, and local + CI agree (~83%) — the old "local
        # over-reports because the sibling clone is absent in CI" caveat is
        # gone. (compat.py's remaining uncovered blocks are Rust-backed Excel
        # I/O — covered in laterite-ags4-core/excel.rs, not via Python.)
        run: |
          # The root `tests/` (the AGS4 dictionary-faithfulness suite) is
          # private-only — it's blocklisted from the public mirror
          # (niko86/laterite) — so include it only when present. Handed a
          # missing path, pytest aborts collection entirely (0 tests →
          # coverage-floor fail), which broke the public repo's python job. The
          # conditional is a no-op on the private repo (the dir exists, so
          # behaviour + coverage are unchanged). A broken import in `tests/`
          # surfaces as a collection error here (non-zero exit) — no separate
          # sentinel step needed.
          uv run pytest \
            packages/laterite/tests \
            $([ -d tests ] && echo tests) \
            -n 4 --durations=20 -q --tb=short \
            --cov=laterite \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # Codecov `python` flag — public repo only (niko86/laterite), where the
      # badge lives + CODECOV_TOKEN is set. coverage.xml is written by the
      # --cov-report=xml above (repo root).
      - name: Upload Python coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # sccache hit/miss visibility (no-op if sccache isn't on this runner).
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Published-wheel smoke (#554): the per-PR proof that the ARTEFACT users receive
  # actually installs-and-imports. Every OTHER Python gate reaches `laterite`
  # through `maturin develop` (an editable install with the cdylib compiled into
  # the source tree) and reaches the CLI's `main()` through the `__main__` guard —
  # so the real wheel, and the `[project.scripts] lat` console script, are never
  # exercised. An ordinary rename can rot the console script or break the wheel
  # install while every existing gate stays green. This builds the real `--release`
  # abi3 wheel ONCE, then installs it into a FRESH isolated venv (by path, not
  # editable — exactly `pip install laterite`) on real 3.12, 3.13 AND 3.14
  # interpreters — the abi3-py312 floor the wheel claims and that NO other job runs
  # (every Python job today uses only 3.14). `lat --help` proves the console script
  # resolves; a real import+validate proves the wheel works. Plus a `[compat]` leg
  # that is the only pandas-present / pyarrow-absent environment there is.
  wheel-smoke:
    needs: [changes, rust]
    # Same guard shape as `python` (see its note): !cancelled() so a failed need
    # doesn't silently skip us, and code-gated so a docs-only PR doesn't pay for a
    # release wheel build.
    if: ${{ !cancelled() && needs.rust.result == 'success' && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    env:
      UV_LINK_MODE: copy
    # A --release maturin build (PyO3 + bundled DuckDB) plus ONE isolated
    # floor-interpreter install; well under the `python` job's 50 on warm sccache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold so the maturin compile hits the cache the rust job populated.
      - uses: ./.github/actions/build-accel

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # The abi3-py312 FLOOR interpreter (fetched from python-build-standalone;
      # self-hosted runners can't use actions/setup-python — see release.yml). The
      # full 3.12/3.13/3.14 + compat/pyarrow matrix runs daily in nightly.yml's
      # wheel-smoke; this PR gate just proves the RELEASE wheel builds, installs
      # and imports on the floor — the wider matrix is a once-a-day check, not a
      # per-PR cost (W1 of the CI two-tier split).
      - name: Install Python 3.12 via uv
        run: uv python install 3.12

      # Put the build backend (`maturin` + linux `patchelf`, both in the `dev`
      # dependency-group) on PATH. Plain `uv sync` — NOT --all-extras: the wheel
      # build needs only the backend, and `uv sync` installs the workspace editable
      # WITHOUT compiling the cdylib (see the `python` job), so the single compile
      # is the `maturin build` below, not doubled. The runtime test extras get
      # installed into the ISOLATED smoke venvs from the built wheel instead.
      - name: uv sync (build backend into the venv)
        run: uv sync

      # The artefact users receive: the RELEASE abi3 wheel (one cp312-abi3 wheel
      # per platform), built ONCE into dist/ and reused across all three venvs.
      - name: Build the release wheel
        run: (cd packages/laterite && uv run --no-sync maturin build --release --out "$GITHUB_WORKSPACE/dist")

      # Isolated install + console-script + import on the FLOOR interpreter. The
      # wheel is installed BY PATH into a fresh venv — no workspace, no editable
      # .pth, no develop cdylib — so this is exactly `pip install laterite`.
      # `lat --help` (exit 0) is the [project.scripts] resolution proof: the
      # console script is argparse with add_help=False and has no --version (an
      # unknown flag exits 5), so --help, not --version, is the honest probe. The
      # 3.13/3.14 legs + the [compat] / [compat,pyarrow] smokes run nightly.
      - name: Install-and-import the wheel on 3.12
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          venv="$GITHUB_WORKSPACE/.smoke-3.12"
          uv venv --python 3.12 --clear "$venv"
          uv pip install --python "$venv/bin/python" "$wheel"
          "$venv/bin/lat" --help >/dev/null
          "$venv/bin/python" --version
          "$venv/bin/python" tools/wheel_smoke.py

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Docs-site gate (#201). The MkDocs site under web/docs-site/ is example-led
  # (every page `--8<--`-includes a file from examples/) AND carries the
  # mkdocstrings Python API reference, which introspects the *installed*
  # `laterite` wheel at build time. So `--strict` here catches BOTH a broken
  # link / missing nav page / unresolved snippet file AND a broken autodoc
  # cross-reference (e.g. a docstring `[`x`][laterite.x]` whose target moved) —
  # the published docs can't silently rot. This IS the "PR-time `mkdocs build
  # --strict` gate" deploy-validator.yml defers to (its mirror build is
  # non-strict so a link nit never blocks the app deploy).
  #
  # `uv sync --group docs` builds the local working-tree wheel (the docs track
  # HEAD, not the last release — the owner's call) + installs mkdocs-material +
  # mkdocstrings; the Rust toolchain + sccache make the maturin build a warm-
  # cache hit. The examples' RUNTIME behaviour is gated separately by
  # tests/test_docs_examples.py in the `python` job (also `code`-filtered, so an
  # example or fixture edit re-runs it there).
  docs:
    # needs build-ext for the prebuilt cdylib (downloaded below). No
    # build-ext-success guard, same reason as the python job: build-ext isn't
    # required, so a build-ext failure must fail THIS (required) job via the
    # 404ing download, not skip-pass it.
    needs: [changes, build-ext]
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, #561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.docs == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust toolchain / build-accel here any more: the cdylib is built once
      # in build-ext and downloaded below, so this job no longer compiles
      # anything — it is a pure Python (uv + mkdocs) job.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python 3.14 via uv
        # Pin the interpreter to the one build-ext built the cdylib against (the
        # python job pins 3.14 too). The shipped wheel is abi3, so a single .so
        # would load on 3.12+ regardless, but pinning removes the assumption.
        run: uv python install 3.14
      - name: Build the working-tree wheel + docs deps
        run: uv sync --group docs
      # `uv sync` installs laterite EDITABLE but does NOT build the PyO3 cdylib
      # (same gotcha the python job documents) — so mkdocstrings' runtime import
      # AND the group-catalogue generator need `_laterite_native` co-located in
      # the package source tree. Download the prebuilt .so (from build-ext) into
      # that tree instead of recompiling it with `maturin develop`. A missing
      # artefact (build-ext failed) 404s here → this required job goes red.
      - name: Download prebuilt cdylib
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: laterite-cdylib
          path: packages/laterite/python/laterite/
      - name: mkdocs build --strict
        working-directory: web/docs-site
        run: uv run --no-sync mkdocs build --strict
