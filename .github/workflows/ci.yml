# PR-tier CI: build + test on every PR (the single validation gate).
#
# Runner routing (the public-repo rule). A PR from a FORK runs on
# GitHub-hosted `ubuntu-latest` — untrusted code must never execute on the
# self-hosted pool (LAN + shared-sccache reach). Our own same-repo PRs,
# pushes, schedules and dispatches run on the warm `laterite-linux` pool
# (sccache-on-NFS, switched on by ./.github/actions/build-accel), so the
# redundant per-job compiles are cache hits rather than cold rebuilds. Every
# `runs-on` below is that same fork-routing ternary.
#
# The Python job needs the compiled PyO3 cdylib, so it `needs: rust` to fail
# fast — no point spending build minutes on Python if the Rust build is red.
# Per-OS wheels are the release workflow's job (matrix on tag), not every PR.

name: ci

on:
  # Single validation gate: `pull_request`. Every change reaches master via a
  # PR (owner-merged) and GitHub runs CI against the merge result, so a `push`
  # trigger adds nothing but a duplicate run. Previously `push: release/**` also
  # fired here, which DOUBLE-ran the heavy maturin+DuckDB suite on every
  # release-prep branch — it matches `release/**` AND has a PR, and the two
  # events carry different refs (`refs/heads/release/x` vs `refs/pull/N/merge`)
  # so the `concurrency` group below can't collapse them. One run per PR now.
  pull_request:
    branches: [main]
    # NO trigger-level `paths-ignore`. Path-filtering lives ENTIRELY in the
    # `changes` job below (the single source of truth) so the heavy jobs report a
    # status on EVERY PR — they run, or skip-as-SUCCESS via their `if:` when the
    # filter says no code changed. That's what lets rust/python/node be REQUIRED
    # status checks WITHOUT a docs/web-only PR blocking forever on a check that a
    # trigger-skip would leave eternally "pending". The only cost is a ~7s
    # `changes` job on a docs PR; the bundled-DuckDB suite still skips.
  workflow_dispatch:
  # Nightly health check on `main`. A scheduled run executes against the default
  # branch, so it — and only it — refreshes the `ci.yml` badge with a real recent
  # run: PR runs happen on the merge-ref and never feed the badge, so without this
  # the badge freezes at the last push-to-main run. Also catches environmental
  # drift (a yanked dep, a toolchain shift) a static `main` develops. Routed to
  # ubuntu-latest below (like the other nightlies) so it doesn't depend on the
  # self-hosted pool being up overnight.
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC daily (nightly.yml runs at 04:00)

# Cancel previous runs on the same ref when a new commit lands —
# keeps the free-tier minute budget under control.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege: both jobs only check out + build + test — no writes to the repo,
# releases, or deployments. Scope the token down from the repo default.
permissions:
  contents: read

jobs:
  # Gate the heavy jobs on actual CODE changes. A docs / tools / assets PR (no
  # Rust or Python source change) skips rust/test/python — they'd only
  # re-measure what master already passed, and the redundant bundled-DuckDB
  # compiles pile up and starve the ephemeral pool under PR contention (the
  # "empty step conclusion + missing log" runner deaths). Web tests have their
  # own paths filter in e2e.yml. On NON-PR events (push to release/**, manual
  # dispatch) the heavy jobs always run — the gate only filters pull_requests.
  changes:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads the PR's changed files
    outputs:
      code: ${{ steps.filter.outputs.code }}
      node: ${{ steps.filter.outputs.node }}
      docs: ${{ steps.filter.outputs.docs }}
      web: ${{ steps.filter.outputs.web }}
      prose: ${{ steps.filter.outputs.prose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # `code` = anything that can change a Rust/Python test outcome: the
          # crates, the wheels (source + tests), the deps, this workflow, the
          # build-accel action, the pyi generator (its drift test lives in the
          # python job), and the docs EXAMPLES + their shared fixture
          # (tests/test_docs_examples.py runs them in the python job). The docs
          # *pages* deliberately DON'T trip `code` — they're link-gated by the
          # cheap `docs` job below. Individual `tools/` scripts trip it when a
          # code-gated job EXECUTES them and only then — this was `tools/**`
          # while `ruff check .` ran in the python job, and the glob outlived
          # that. Assets and the wiki still don't.
          # `node` = the laterite-node crate + TS package (drives the `node` job).
          # `docs` = the MkDocs site (drives the `docs` strict-build link gate).
          filters: |
            code:
              - 'rust-packages/**'
              # There were two `!` rules here — `!rust-packages/laterite-node/**/*.ts`
              # and the `.json` twin — meant to keep a bench/config-only edit in
              # laterite-node from firing the heavy `python` job. They did the
              # exact opposite (#230). dorny/paths-filter treats each entry as an
              # independent pattern and OR's the results, and picomatch's `!x`
              # matches EVERYTHING THAT IS NOT x — so `!…/*.ts` matched CHANGELOG.md,
              # codecov.yml, every wiki page. Measured before removal: `code` was
              # true for 1385 of 1385 tracked files. The filter had not narrowed
              # anything since the day those lines were added.
              #
              # There is no way to spell the intended exclusion in an OR'd list, so
              # it is gone rather than rewritten: a `.ts`-only edit in laterite-node
              # now fires `code`. That over-triggers on a rare change, which is the
              # side to err on — the alternative is a gate that stops firing.
              # `tests/test_paths_filter.py` bans the pattern class outright.
              - 'packages/**'
              - 'tests/**'              # the root suite = AGS4 dictionary-faithfulness tests (run below)
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-accel/**'
              - 'web/docs-site/examples/**'  # docs example sources — test_docs_examples.py executes these
              - 'examples/sample_site.ags'   # the fixture that gate reads (subprocess cwd = repo root)
              - 'web/docs-site/scripts/**'   # catalogue_data/gen_* — its drift gate (test_groups_catalogue_faithful) runs in the python job
              - 'web/docs-site/hooks/**'    # mkdocs build hooks — ruff lints them in the python job, so they must fire `code`
              # The docs stylesheets were listed here for test_docs_band_containment
              # (#401) — band colour may only paint the nav, the TOC rail, the
              # masthead hairline and the catalogue cap, never prose. That test
              # reads files and imports nothing, so it now runs in `repo-gates`,
              # which has no filter and therefore cannot fail to fire. The entry
              # is gone rather than kept "just in case": a path listed for a gate
              # that no longer runs here is how a CSS edit comes to rebuild a
              # wheel, which is the cost this block exists to avoid.
              # SSOT paths a gate IN THIS REPO actually reads. That is the rule
              # every block below invokes: an entry earns its place by naming a
              # path some test or step here opens. List a path for a gate that
              # doesn't run and an SSOT / doc edit fires the heavy `python` job
              # for nothing (a README badge bump rebuilding the whole wheel is the
              # visible symptom); leave a live gate's inputs unlisted and it never
              # fires at all (#207). This block used to open by saying the root
              # `tests/` suite was private-only and absent from this mirror — it
              # is present, and its gates are part of why entries below exist.
              # ...and by the modality drift gate. The generator half needs no
              # entry: `gen_modality.py` runs in `repo-gates`, unconditionally.
              - 'modality.json'          # read by test_modality_parity (packages/laterite/tests)
              - 'COMPAT.md'              # referenced by test_laterite (packages/laterite/tests)
              # The O-N catalogue SSOT + its render + the generator. These belong
              # in `code` for the same reason as the entries above and NOT for the
              # reason the block warns against: the drift gate genuinely runs in
              # THIS repo now (the `observations drift gate` step in the python
              # job). Without these paths the gate exists and nothing fires it —
              # an edit to the SSOT alone would sail past, which is precisely how
              # the census gate came to be unpassable-by-construction (#207).
              # `observations.json` / `OBSERVATIONS.md` are NOT listed: their drift
              # gate moved to the unconditional `repo-gates` job, and so did the
              # generator — nothing here needs to reach either.
              # divergences.md joined that render in #320 and follows it to
              # `repo-gates` for the same reason.
              # The changelog trio, for the identical reason — its drift gate
              # ("changelog drift gate" in the python job) also runs in THIS
              # repo, and the leak gate + the `breaking` marker cross-check ride
              # in the same `--check`. Missed when the observations trio above
              # was added. Listing it does not currently CHANGE which PRs run
              # python (see #230 — the two `!` rules above make `code` true for
              # essentially everything), and that is the point: a gate must fire
              # by declaration, not by an accident that a filter fix would undo.
              # Likewise the changelog pair — the drift gate and every root test
              # that reads them are buildless and now run unconditionally. This
              # is the entry that made a three-line CHANGELOG.md regeneration
              # wait on `cargo build --release` (#443).
              # The prose docs check_doc_refs reads. `COMPAT.md` is already above
              # (a test reads it); these are the rest. Without them a
              # RELEASING/CONTRIBUTING-only edit would not fire the gate that
              # exists to check exactly those files.
              # RELEASING.md and CONTRIBUTING.md were here only for check_doc_refs,
              # which is now unconditional. README.md STAYS: test_docs_snippets
              # doctests it and that test needs the wheel, so a README edit does
              # still build one. Splitting that test is the remaining half of
              # this problem and is not attempted here.
              - 'README.md'
              # The tools a `code`-gated job RUNS — and only those.
              #
              # This was `tools/**`, plus `ags-wiki/.bootstrap/**/*.py` and
              # `examples/**/*.py`, and all three were declared for one reason:
              # `ruff check .` and `ruff format --check .` were steps in the
              # python job, so every linted file had to fire it or go unlinted.
              # Ruff has since moved to `repo-gates`, which has no filter and
              # therefore cannot fail to run. The globs outlived their reason and
              # kept charging for it — editing a stdlib-only release helper, or a
              # wiki script whose only gate lives in `wiki-lint.yml`, bought a
              # cargo build, the PyO3 cdylib, pytest and a wheel smoke.
              #
              # Enumerated rather than glob'd, because "a heavy job runs this" is
              # a property of the script and nothing about the directory implies
              # it. That is the #207 side of the trade, so it is not left to
              # care: `test_every_executed_tool_fires_its_job` reads ci.yml's own
              # `run:` blocks and fails if a filtered job invokes a tool no rule
              # here reaches — a narrowing cannot quietly disarm a gate.
              - 'tools/check_msrv.py'              # publish-gates
              - 'tools/check_package_contents.py'  # rust + publish-gates
              - 'tools/check_public_api.py'        # publish-gates
              - 'tools/check_semver.py'            # publish-gates
              - 'tools/check_speed_claims.py'      # python
              - 'tools/check_support_matrix.py'    # python
              - 'tools/gen_census.py'              # python — `--check` vs the built launchers
              - 'tools/gen_doc_outputs.py'         # python (python+cli surfaces); also in `node`
              - 'tools/wheel_smoke.py'             # wheel-smoke's post-install smoke (laterite-dev#554)
              # Reached by a TEST rather than a `run:` line, so the derived check
              # above cannot see them. Declared by hand, with the reader named:
              - 'tools/generate_pyi.py'            # imported by test_pyi_stubs_match_generator
              - 'tools/release/public-api/**'      # read by test_modality_parity
              # The surface census: `gen_census.py --check` runs as its own step in
              # the python job and compares the SSOT against the live launchers, so
              # both the SSOT and its render are inputs to a gate that already exists.
              - 'surface-census.json'
              - 'ags-wiki/concepts/surface-census.md'
            node:
              # The napi addon links sibling crates — laterite-ags4-validator,
              # laterite-ags4-types, laterite-ags4-emit (see laterite-node/Cargo.toml) —
              # so a change to ANY of them rebuilds + can break the node addon.
              # Watching only laterite-node/** silently SKIPPED the node job on a
              # dependency change (a validator/types/emit edit ran rust + python but
              # not node). Watch all of rust-packages/** so node can never drift out
              # of sync with its deps. The trade is deliberate and holds at any job
              # duration: a silent skip is a correctness failure, while a run on an
              # unrelated crate is only cost.
              - 'rust-packages/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-accel/**'
              - 'web/docs-site/examples/node/**'  # docs Node snippets — test/docs-examples.test.ts executes these in vitest
              # The node job runs `gen_doc_outputs.py --check --surface node`,
              # and nothing declared it: an edit to the generator re-ran the
              # PYTHON surface's drift gate and not this one. A live #207, found
              # by the derived check rather than by a reading of this list.
              # `ts-lint` runs the wasm surface and is gated `node || web`, so
              # this entry covers it too; `web` needs no twin.
              - 'tools/gen_doc_outputs.py'
              - 'examples/sample_site.ags'        # the fixture those snippets read (subprocess cwd = repo root)
            docs:
              # The MkDocs site + its nav/config drive the `docs` job's
              # `mkdocs build --strict` build. The examples under
              # web/docs-site/examples/** ALSO sit in `code`, so the python job
              # re-runs the RUNTIME example gate — link/autodoc half here, example
              # runtime there. The importable Python source is here too because
              # the mkdocstrings API reference introspects it: a docstring edit
              # that renames/removes a cross-ref target must re-run --strict.
              - 'web/docs-site/**'
              - 'packages/laterite/python/**'
              # The docs DEPENDENCY set: the `docs` group here and the resolved
              # lock. A dep/lock change silently alters what `mkdocs build` runs
              # against, and this was the only job that would notice — so it must
              # re-run. Learned the hard way: `properdocs` (an ad-injecting MkDocs
              # fork pulled in transitively by mkdocs-gen-files/literate-nav)
              # entered via a lock re-resolve and shipped unseen precisely because
              # a lockfile change did not trigger the strict build.
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            web:
              # ts-lint's web surface (the Solid browser validator's TS): eslint +
              # prettier over web/**. The laterite-node TS half is covered by the
              # `node` output (rust-packages/**), which ts-lint is ALSO gated on, so
              # a wasm-crate change still re-lints web (its generated .d.ts feeds
              # web's type-aware rules). A web/docs-site-only change over-triggers
              # here (harmless — the job only lints), so no negation is used.
              - 'web/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-accel/**'
              # The wasm artifact gates (slim, tier-1) also RUN in ts-lint, and
              # editing one can only weaken it — raise a ceiling, widen a surface
              # list. Without this a PR whose entire diff is "make the gate stop
              # failing" would never run the gate. Narrow on purpose: the rest of
              # `tools/release/**` has no business waking a job that installs a Rust
              # toolchain and the wasm32 target and builds every wasm crate before
              # it lints a line.
              - 'tools/release/*wasm*.mjs'
            prose:
              # `prose` = the cadence gate's inputs, and they really are this
              # broad: tests/test_stated_cadences_faithful.py walks every tracked
              # file of these suffixes, because a sentence stating a workflow's
              # cadence can be written in any of them. Both drifts it exists for
              # landed outside ags-wiki/ — one in a docs-site page, one in a Rust
              # doc comment — so a filter naming just those two trees would be a
              # narrowing the gate does not actually make.
              #
              # Wide, but not costly: the job is stdlib + pytest, no wheel, no
              # Rust, ~1s of work. It is deliberately NOT folded into `code` —
              # that would make a README typo rebuild the wheel in the heavy
              # python job, which is how a cheap gate acquires an expensive
              # reputation and then a paths filter that quietly kills it.
              - '**/*.md'
              - '**/*.rs'
              - '**/*.py'
              - '**/*.yml'
              - '**/*.yaml'
              # The mirror itself: it supplies the derived cadence every claim in
              # the tree is checked against, so editing it re-checks all of them.
              - 'external-authorities.json'

  # Stated cadences vs the crons they claim to describe. Its own job rather than
  # a step in `python` because its inputs are every .md/.rs/.py/.yml in the tree:
  # riding in there would mean a docs typo pays for a wheel build, and the filter
  # someone would then add to stop that is what stops the gate firing at all
  # (#207). Standing alone it costs a checkout and ~1s.
  #
  # Half a gate on its own — it proves prose agrees with
  # external-authorities.json, and only the dev satellite can prove that mirror
  # agrees with the crons it mirrors (tools/check_external_authorities.py, run
  # there). See ags-wiki/tools/stated-cadences-faithful.md.
  cadence:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.prose == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # `--no-project --with pytest`: the test is stdlib + pytest and reads the
      # tree with `git ls-files`. A `uv sync` here would build the PyO3 wheel to
      # run a one-second file walk.
      #
      # `-o addopts=""` is load-bearing. The root pyproject sets
      # `addopts = "--benchmark-disable"`, which pytest reads from the inifile
      # even under `--no-project` — and pytest-benchmark is NOT in this
      # ephemeral env, so pytest exits 4 on an unrecognised argument before it
      # collects anything. This job wants the file and nothing else from the
      # project's pytest config.
      #
      # It passed locally and failed here, because a local `--with pytest` env
      # can inherit a cached pytest-benchmark that a clean runner never has.
      # Reproduce the runner's view with `-p no:benchmark`.
      - name: Stated cadences match their workflows' crons
        run: >-
          uv run --no-project --with pytest
          pytest -o addopts="" tests/test_stated_cadences_faithful.py -q

  # ── The buildless repo gates ───────────────────────────────────────────────
  #
  # Everything here reads files and compares them. None of it needs the wheel,
  # the cdylib or the `lat` binary — which is exactly why it used to be the
  # slowest feedback in the run: these checks were steps in the `python` job,
  # queued behind an artifact download and `cargo build --release`. A stale
  # CHANGELOG.md took two minutes to report a string comparison.
  #
  # NO PATH FILTER, deliberately. The #207 failure mode is a gate that stops
  # firing because nobody declared its inputs; an unconditional job cannot have
  # that bug, and at this cost there is nothing to buy by risking it. It also
  # means the SSOT documents no longer need to appear in the `code` filter to
  # stay gated — which is what lets `code` shed them and stop a README edit
  # rebuilding the wheel.
  #
  # The split of `tests/` is by MARKER, not by a list here: a list in a workflow
  # is a second place to remember. tests/test_build_marker_faithful.py holds the
  # marker to the tree, in both directions.
  repo-gates:
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check_issue_refs.py` (below) derives its watermark from the merged-PR
          # history of the default branch, which a shallow (default) checkout does
          # not have. The gate REFUSES on a shallow clone rather than reading a low
          # watermark, so this is load-bearing and its absence fails loudly — the
          # same bargain changelog.yml struck for the same reason.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # ruff lints the WHOLE repo, not the shipped package, so it has no reason
      # to wait for one to be built. Moving it here is also what let `code` drop
      # `tools/**`: while lint ran in the python job every linted file had to
      # fire that job, and here there is no filter to fire.
      - name: ruff check
        run: uv run --no-project --with ruff ruff check .

      - name: ruff format --check
        run: uv run --no-project --with ruff ruff format --check .

      # The generated-view drift gates. Each compares a rendered file against
      # the JSON it is rendered from; all are stdlib.
      - name: changelog drift gate (CHANGELOG.md == changelog.json render)
        run: uv run --no-project python tools/gen_changelog.py --check

      - name: observations drift gate (OBSERVATIONS.md == observations.json render)
        run: uv run --no-project python tools/gen_observations.py --check

      - name: modality drift gate (modality-register.md == modality.json render)
        run: uv run --no-project python tools/gen_modality.py --check

      - name: crate cards match the manifests
        run: uv run --no-project python tools/gen_crate_graph.py --check

      - name: install grid names only what we publish
        run: uv run --no-project python tools/gen_install_channels.py --check

      - name: doc references resolve (incl. crates.io-strict for published READMEs)
        run: uv run --no-project python tools/check_doc_refs.py --check

      # Sibling of the gate above, and here for the same reason it is: no build,
      # a file walk, and an unconditional job so it cannot stop firing. A bare
      # `#N` is a claim that a number is OURS — #458 is the write-up of what
      # that costs once the numbering climbs past a number being borrowed,
      # which it now has.
      #
      # This one needs the job's `fetch-depth: 0` (see the checkout above): its
      # watermark is the highest PR number merged into the default branch, read
      # off git rather than the API because this job has none. A shallow clone
      # cannot answer that, so the gate REFUSES rather than reading a low
      # watermark and rejecting correct references to recent numbers.
      - name: bare `#N` means an issue in this repo
        run: uv run --no-project python tools/check_issue_refs.py

      # The repo-truth suite, minus the handful that need a build. See the
      # `cadence` job above for why `-o addopts=""` is load-bearing (the root
      # pyproject sets --benchmark-disable, and pytest-benchmark is absent from
      # this ephemeral env) and why `-p no:benchmark` is how you reproduce a
      # clean runner locally, where a cached plugin can hide the failure.
      - name: repo-truth gates (buildless subset)
        run: >-
          uv run --no-project --with pytest --with pyyaml --with ruff
          pytest tests -m "not needs_env"
          -o addopts="" -p no:benchmark -q --tb=short

  # Supply-chain gate: RustSec advisories + the permissive-license policy +
  # crates.io-only sources + duplicate-version warnings. Config + the documented
  # advisory exceptions live in rust-packages/deny.toml. Fast — no compilation.
  deny:
    needs: changes
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, laterite-dev#561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust toolchain (cargo-deny shells out to `cargo metadata`)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: install cargo-deny
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-deny
      - name: cargo deny check
        working-directory: rust-packages
        run: cargo deny check

  # The three gates that have to work BEFORE the first crates.io publish, not
  # after — a published version's API and its MSRV are both frozen, and the only
  # remedy for either being wrong is a version bump every consumer must follow.
  #
  # Its own job rather than steps on `rust` because it needs two extra
  # toolchains (nightly for rustdoc JSON, 1.85 for the MSRV floor) and two extra
  # cargo subcommands. Putting that on the critical path of every PR to run a
  # check that only matters to ten of the twenty-four crates is a poor trade;
  # `rust` stays lean and this runs beside it.
  #
  # NOTE for branch protection: this is a NEW status-check context
  # (`publish-gates`). It gates nothing until it is marked required.
  publish-gates:
    needs: changes
    # See the `deny` job for why `!cancelled()` is load-bearing here.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    # NOT the fork-routing ternary every other job uses — ubuntu-latest
    # unconditionally, which is the one job here that needs it.
    #
    # `cargo-public-api` publishes no prebuilt binaries, so taiki-e/install-action
    # can only build it from source, and it depends (not optionally) on `curl` →
    # `curl-sys` → `openssl-sys`. The self-hosted image carries no OpenSSL
    # development headers, so the install fails there before any gate runs. The
    # GitHub-hosted image has them.
    #
    # The pool is not much of a loss here anyway: its value is sccache-on-NFS for
    # the bundled-DuckDB and PyO3 builds, and this job touches neither — the ten
    # engine crates are the lean half of the workspace. Swatinem's cache covers
    # the rest, including `~/.cargo/bin`, so the two source-built tools are
    # rebuilt once and then restored.
    runs-on: ubuntu-latest
    # Generous: the first run on a cold cache builds both cargo subcommands from
    # source, then rustdoc-JSONs ten crates and builds a semver baseline of each.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 is REQUIRED, not a default worth trimming: cargo
      # semver-checks resolves `--baseline-rev origin/main` by checking that
      # commit out, and a shallow clone does not have it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # The two extra toolchains, installed by hand because the action above
      # takes one channel and makes it the default — and the default must stay
      # stable so the tools below behave as they do locally.
      #
      # `nightly`: rustdoc's JSON output is unstable, and cargo public-api reads
      # it. There is no flag to point it elsewhere; it finds nightly via rustup.
      #
      # `1.85`: the `rust-version` every crate declares. It is a promise to a
      # stranger's toolchain, and until this job existed nothing tested it — the
      # first run found a let chain (stable in 1.88) in laterite-ags4-emit, so
      # the promise had already been broken for a while.
      - name: Install the nightly + MSRV toolchains
        run: |
          rustup toolchain install nightly --profile minimal
          rustup toolchain install 1.85 --profile minimal

      # No build-accel: that turns on the self-hosted pool's sccache + mold, and
      # this job does not run there. Swatinem is the cache instead — same reason
      # deploy-validator.yml uses it, and `cache-bin` (on by default) is what
      # keeps the two source-built cargo subcommands from being rebuilt every run.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rust-packages

      - name: install cargo-public-api + cargo-semver-checks
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-public-api,cargo-semver-checks

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # LIBRARIES ONLY — no `--all-targets`. A consumer on 1.85 compiles the
      # library; they never build our benches, and `criterion` (a dev-dependency)
      # requires 1.86. Widening this to --all-targets would fail on a dependency
      # that is not part of the promise, and the obvious "fix" — raising
      # rust-version — would break the promise to make the gate green.
      - name: MSRV (the publish set builds on the rust-version it declares)
        run: uv run --no-project python tools/check_msrv.py

      # Puts the whole public surface into the PR diff. laterite#178 restored two
      # deleted public functions by being branched before the PR that removed
      # them; the tree compiled, every test passed, and it went unnoticed for
      # nine days. A snapshot makes that a red line on the reviewer's screen.
      - name: public API snapshot (crates.io freezes what ships)
        run: uv run --no-project python tools/check_public_api.py

      # The snapshot says WHAT changed; this says whether it is BREAKING.
      # Baseline is `main`, because nothing is on crates.io yet — at first
      # publish the stronger baseline (the released version) becomes available
      # and should replace it.
      # The explicit fetch is belt-and-braces on top of fetch-depth: 0 — on a
      # pull_request event the checked-out ref is the merge ref, and a missing
      # `origin/main` would read as a tooling failure rather than the
      # configuration mistake it is.
      #
      # A script rather than one cargo command because a crate that does not
      # exist at the baseline aborts the WHOLE run rather than being skipped —
      # see the module docstring. It reports what it skipped and why.
      - name: cargo semver-checks (against main)
        run: |
          git fetch --no-tags origin main
          uv run --no-project python tools/check_semver.py

  rust:
    needs: changes
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, laterite-dev#561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    # The ceiling below is generous: the AGS5 crates (the bundled-DuckDB long pole)
    # were decoupled to ags5/, so the kept workspace links no bundled DuckDB and
    # a cold build is much faster; warmed runs (sccache hits) finish in minutes.
    timeout-minutes: 35
    steps:
      # Ephemeral pool runners start each job with a fresh _work, so there's
      # no persisted target/ to keep — the warm cache is sccache (content-
      # addressed, on the shared NFS mount), turned on by build-accel below.
      # See concepts/ci-and-runners.md for the sccache/ephemeral model.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Name the channel explicitly: pinned to a SHA there's no `@stable` ref
          # for the action to infer the toolchain from (and Dependabot bumps the
          # SHA over time, so don't rely on the action's default staying `stable`).
          toolchain: stable
          components: rustfmt, clippy

      # Turn on sccache + mold IF the runner has them (the laterite-runner pool
      # image does; a GitHub-hosted fallback doesn't → no-op). Must run before the
      # build steps so the env it exports is in scope.
      - uses: ./.github/actions/build-accel

      # No Swatinem/rust-cache: sccache (shared, on NFS) is the build cache
      # now, so a ~0.5 GB network target/-cache round-trip would be pure
      # overhead — and it wouldn't cache the bundled-DuckDB C++ that sccache,
      # wrapping CC/CXX, does.

      - name: cargo fmt --check
        working-directory: rust-packages
        run: cargo fmt --all -- --check

      # The two wasm32 cdylibs used to be excluded here, justified as "built +
      # linted for its real target via wasm-pack in deploy-validator.yml".
      # That was not true: deploy-validator.yml runs `wasm-pack build`, which
      # BUILDS and does not lint, and no other workflow linted them either — so
      # the browser validator, the largest single source file in the workspace,
      # was linted nowhere at all. The cost showed up in 0.9.0: four dead
      # constants and three `ok_expect` hits sat in laterite-ags4-wasm, found
      # only by running clippy on it by hand.
      #
      # Both crates are clippy-clean under -D warnings on the HOST, which is
      # also where their tests already run (see the `test` job) — wasm-bindgen's
      # macros expand on any target. If a future toolchain does make the macro
      # output noisy, that is a loud failure to handle, not a reason to lint
      # nothing.
      #
      # Debug, not --release: nothing in CI asserts wall-clock (no perf gate), so
      # the release profile's thin-LTO + codegen-units=1 just burned compile time.
      # The `laterite_ags4` DuckDB loadable extension is NOT built here — it lives
      # in its own canonical repo `niko86/laterite-duckdb` with its own CI (it
      # path-deps the library crates via a submodule of the public mirror). It
      # couldn't co-build anyway: its `loadable-extension` libduckdb-sys is
      # mutually exclusive with the *bundled* DuckDB the rest of the workspace
      # links ("DuckDB API not initialized" at runtime).
      - name: cargo clippy
        working-directory: rust-packages
        # --all-targets lints tests/benches/examples too, not just lib/bin code.
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The shared parse leaf (#168) becomes a wasm dependency of the browser
      # validator from Phase 3 on. Build it for wasm32 NOW so a
      # wasm-incompatible change (name-allowlist ≠ wasm-compilability — memchr's
      # std::arch paths, encoding_rs) fails here, not at adoption.
      - name: cargo build (parse leaf + tokenizer wasm, wasm32)
        working-directory: rust-packages
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p laterite-ags4-parse --target wasm32-unknown-unknown
          # The tiny browser tokenizer wasm (laterite-dev#533) is built from parse + types;
          # compile it for wasm32 here so a wasm-incompatible change to either
          # leaf (or the wrapper) fails in this fast job, not only in e2e/deploy.
          cargo build -p laterite-ags4-tokenizer-wasm --target wasm32-unknown-unknown
          # The shared scrub engine (laterite-dev#581) becomes a wasm dependency of the
          # engine wasm (browser Anonymiser) in Phase 2. Build it for wasm32 NOW
          # so a wasm-hostile change (it pulls parse + reference + types) fails
          # in this fast job, not at adoption.
          cargo build -p laterite-ags4-censor --target wasm32-unknown-unknown

      # No `cargo test --workspace` here: the parallel `test` job below is the
      # PR-tier Rust test authority (plain, sccache-warm), and the nightly
      # (nightly.yml) runs the heavier INSTRUMENTED coverage measurement. Keeping
      # the workspace test out of THIS job is deliberate — folding it in would
      # lengthen the `rust` -> `python` critical path (python `needs: rust`) and
      # make every PR slower, for no gain over running it in parallel.

      # laterite-ags4-wasm is a wasm32 cdylib built elsewhere, so it's excluded
      # from the `test` / nightly-coverage workspace runs. Its host-compilable
      # unit tests (the typed-Arrow parse() parity guard) run fine on the host
      # without the wasm target, so run them on their own here — in this fast
      # job, beside the wasm32 build check above.
      - name: cargo test (laterite-ags4-wasm parity)
        working-directory: rust-packages
        run: cargo test -p laterite-ags4-wasm

      # The six feature gates (#330) each have to hold on their own, not just in
      # the two combinations anyone builds. A gate is only real if the crate
      # compiles without it — and the way that rots is quiet: an ungated `use`,
      # or a helper that drifts onto a gated type, breaks `--no-default-features`
      # while `default = full` stays green everywhere else in CI.
      #
      # `--no-default-features` runs the tests too: the slim shape is what npm
      # ships, so its 89 tests are a shipped artifact's tests, not a compile
      # check. The per-feature loop is `clippy` only — `-D warnings` is the
      # point there, since an unused import under one gate is exactly the
      # symptom, and it costs a check rather than a link per feature.
      - name: cargo test + clippy (laterite-ags4-wasm, feature gates)
        working-directory: rust-packages
        run: |
          set -euo pipefail
          cargo test -p laterite-ags4-wasm --no-default-features
          for f in excel arrow certify diff merge censor; do
            echo "::group::laterite-ags4-wasm --features $f"
            cargo clippy -p laterite-ags4-wasm --no-default-features --features "$f" \
              --target wasm32-unknown-unknown -- -D warnings
            echo "::endgroup::"
          done

      # What each publish-set crate would put in its `.crate` tarball, compared
      # against a checked-in manifest. A step in THIS job rather than a workflow
      # of its own: it needs the Rust toolchain already set up here, and a new
      # job would mean a new status-check context to keep in sync with the
      # ruleset by hand (changelog.yml and wiki-lint.yml both carry the warning
      # about what a renamed `name:` does to a required check).
      #
      # Why it must predate the first publish rather than follow it: crates.io
      # is append-only. `yank` stops new resolution; it does not remove the
      # tarball. A fixture or a stray directory that rides one publish is public
      # for good, and the repo's grep-the-diff habit never sees a tarball,
      # because the tarball is assembled at publish time from `include` rules
      # nobody re-reads.
      #
      # `--verify-buildable` additionally BUILDS each packaged tarball wherever
      # the dependency versions allow it — which today is the three
      # dependency-free leaves, because the in-workspace deps still carry no
      # version requirement. It prints what it skipped and why, so a run that
      # verified almost nothing cannot be mistaken for one that verified
      # everything.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: cargo package contents (crates.io allowlist)
        run: uv run --no-project python tools/check_package_contents.py --verify-buildable

      # sccache hit/miss visibility (no-op if sccache isn't on this runner).
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # build-ext: compile the PyO3 cdylib ONCE ("build once"). The python and
  # docs jobs both used to run their own `maturin develop`, compiling the same
  # debug _laterite_native .so twice per PR (wheel-smoke builds a third, but that
  # is a RELEASE wheel install-smoke and legitimately its own artefact — left
  # alone). Here the debug cdylib is built a single time and uploaded; python and
  # docs download it into the package source tree instead of recompiling. sccache
  # already made the repeat compiles cache-hits, so the win is the redundant LINK
  # plus a freed slot on the 2-runner pool, not raw wall-clock.
  build-ext:
    needs: changes
    # Runs whenever EITHER consumer runs: `code` (python) OR `docs` (docs). Same
    # !cancelled() + filter-failed-means-run discipline as the other jobs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true'
        || needs.changes.outputs.docs == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    env:
      UV_LINK_MODE: copy
    # This job now carries the one cold cdylib build (PyO3 + the workspace as a
    # lib), so it gets the generous ceiling the python job used to need.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — see the rust job's note above
      # sccache + mold for the maturin (PyO3) build, if the runner has them.
      - uses: ./.github/actions/build-accel
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python 3.14 via uv
        run: uv python install 3.14
      - name: uv sync (deps + maturin into the venv)
        run: uv sync --all-extras
      # Build the debug abi3 cdylib into packages/laterite/python/laterite/ —
      # byte-identical to the `maturin develop` the python/docs jobs used to run
      # (same maturin from the venv, same 3.14 interpreter), so the artefact they
      # download is exactly what they would have compiled themselves.
      - name: Build native extension (maturin develop)
        run: (cd packages/laterite && uv run --no-sync maturin develop --uv)
      - name: Upload prebuilt cdylib
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: laterite-cdylib
          # Glob so the abi3 (`_laterite_native.abi3.so`) or interpreter-tagged
          # name both match; error rather than silently upload nothing.
          path: packages/laterite/python/laterite/_laterite_native*.so
          if-no-files-found: error
          retention-days: 1
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # laterite-node: the napi addon + TS package. The `rust` job above already
  # compiles the crate (workspace clippy/test); this gate is the TS half —
  # build the native addon, typecheck, and run the vitest suite (read/validate/
  # emit, DuckDB sql/at + arrow output, typed-graph drift, transport). Same
  # self-hosted Linux runner + sccache (the napi build reuses the warm cache).
  node:
    needs: changes
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, laterite-dev#561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.node == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust-packages/laterite-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold (no-op if the runner lacks them) — the napi build's Rust
      # half shares the same content-addressed cache as the `rust` job.
      - uses: ./.github/actions/build-accel

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      # `npm ci` requires package-lock.json to stay in sync with the registry.
      # The `@laterite/native-*` optional deps are pinned to the package version;
      # once a version is published, the lockfile must record its resolved entry
      # (an unresolved/empty entry → EUSAGE). So regenerate + commit the lockfile
      # after each platform-package publish (see RELEASING-node.md). The matching
      # platform `.node` gets installed here but the local napi build below
      # overrides it (the loader prefers ./laterite-node.<triple>.node).
      - name: npm ci
        run: npm ci

      # Debug napi build (no --release: CI asserts no wall-clock) + the tsup dist
      # — proves the native addon AND the shippable dual ESM/CJS bundle build.
      - name: Build (napi debug + tsup dist)
        run: npm run build:debug

      # The napi loader (index.js) + types (index.d.ts) are committed (the
      # npm-publish job needs them and never runs `napi build`). `napi build`
      # above just regenerated them — assert they match the tracked copies so an
      # edit to the #[napi] surface can't ship a stale loader/types.
      - name: napi loader/types drift guard
        run: git diff --exit-code -- index.js index.d.ts

      - name: typecheck (tsc --noEmit)
        run: npm run typecheck

      # vitest: read/validate/emit, the typed-graph generator drift guard, and
      # the DuckDB sql/at suite (the optional @duckdb/node-api peer is a devDep;
      # the { arrow: true } path fetches DuckDB's `arrow` community extension).
      # --coverage (v8) instruments the ts/ wrapper the tests import directly and
      # writes coverage/lcov.info for the Codecov `node` flag below.
      - name: vitest (+ coverage)
        run: npm run test:coverage

      # Node 24 on the SAME native build, so the declared floor (`engines.node`
      # >=22) and the tested ceiling are both real. Deliberately a second step
      # rather than a matrix over the job: `node` is a REQUIRED check context in
      # the ruleset, and a matrix renames it to `node (22)` / `node (24)` — the
      # requirement would then reference a context nothing ever reports and
      # every PR would pend forever.
      #
      # One napi build serves both because the addon is Node-API (ABI-stable
      # across major versions) — that portability is the property being tested
      # here, so a rebuild would test the wrong thing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: vitest on Node 24 (no coverage — the 22 run owns the report)
        run: npm test

      # The Node half of #164's doc-output gate. docs-examples.test.ts already RUNS
      # every .mjs example — but it only checks that the asserts hold, never what the
      # example printed, so an example could assert correctly and be documented
      # incorrectly. That is exactly what happened. This compares stdout to the
      # committed `.out` the pages include. Here because this job is where `dist/`
      # exists; the python + cli surfaces run in the python job.
      #
      # Plain `python3`, not uv: this job installs no Python at all, and the
      # generator is stdlib-only — pulling in setup-uv to run one stdlib script
      # would be the more fragile choice, not the safer one.
      - name: gen_doc_outputs --check (docs example output == real stdout, node)
        working-directory: ${{ github.workspace }}
        run: |
          # PRINTED, not asserted. The version this must clear is decided by the
          # runner image, so asserting it here would put that number in a second
          # place to keep in step — the defect #521 was opened about. A print
          # costs nothing and puts the interpreter above the traceback.
          python3 -V
          python3 tools/gen_doc_outputs.py --check --surface node

      # Codecov `node` flag — public repo only (where the badge lives + the token
      # is set). Measures the TS wrapper; the Rust engine's number is the nightly
      # cargo-llvm-cov `rust` flag. codecov-action is a `uses:` step so it runs at
      # the repo root — hence the full path to the node package's lcov.
      - name: Upload Node coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-packages/laterite-node/coverage/lcov.info
          flags: node
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Packaging smoke: `npm pack` the package and run read/table/validate/emit
      # against the PACKED dist + native binary — the thing `npm install laterite`
      # ships. CI builds the addon itself, so a publish-only gap (the npm-publish
      # job consumes prebuilt .nodes, never running `napi build`) is invisible to
      # every build-first job; this exercises the consumer artifact instead.
      - name: packaging smoke (pack + run the built library)
        run: npm run smoke:pack

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # TS lint + format gate (laterite-dev#585 / laterite-dev#615): the two shipped TS surfaces — web/ (the
  # Solid browser validator) and rust-packages/laterite-node (the npm bindings) —
  # run `eslint . --max-warnings 0` (0 errors AND 0 warnings) + `prettier --check`.
  # The laterite-dev#615/#621 burn-down fixed every rule at source and flipped them to `error`;
  # `--max-warnings 0` (#65) makes a future regression to `warn` fatal too, so the
  # "flip to error" can't silently erode. This is the CI-enforcement half, so a
  # regression can't merge (until now the gate was runnable locally via `npm run
  # lint` / `format:check` but nothing enforced it per-PR).
  #
  # web/ MUST build its wasm bindings first: eslint's type-aware rules
  # (`no-unsafe-*`) resolve the `../wasm/ags4_wasm.js` import through its GENERATED
  # .d.ts. With no wasm built the import is `any` and every call through it trips a
  # FALSE no-unsafe error, in bulk — so the wasm build is a lint prerequisite,
  # not a test artefact. node/ needs no wasm (it links its own napi addon).
  ts-lint:
    needs: changes
    # Runs when either TS surface (or its inputs) changed. Same !cancelled() +
    # filter-failed-means-run discipline as the other jobs. `node` covers the
    # laterite-node TS + the rust-packages/** wasm crates web's types derive from;
    # `web` covers web/**.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.node == 'true'
        || needs.changes.outputs.web == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (+ wasm32 for web's wasm bindings)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # sccache + mold (no-op off the pool) — the wasm crate compile shares the
      # cache the `rust` job populated (it builds the same crates for wasm32).
      - uses: ./.github/actions/build-accel

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked

      # --- laterite-node (npm bindings): lint + format, no wasm needed ---
      - name: node — install
        working-directory: rust-packages/laterite-node
        run: npm ci
      - name: node — eslint + prettier
        working-directory: rust-packages/laterite-node
        run: |
          npm run lint
          npm run format:check

      # --- web (browser validator): build wasm bindings, then lint + format ---
      - name: web — install
        working-directory: web
        run: npm ci
      - name: web — build wasm bindings (generates the .d.ts the type-aware rules need)
        working-directory: web
        run: npm run build:wasm:all
      - name: web — eslint + prettier
        working-directory: web
        run: |
          npm run lint
          npm run format:check

      # No emoji in product UI (#406) — a design-system rule that review is bad
      # at catching, because an emoji arrives one character at a time in a diff
      # about something else. The sanctioned Unicode glyphs (the theme toggle's
      # sun and moon, the verdict marks, the paging arrows) are allowlisted in
      # the script, so this bans the thing and not the vocabulary.
      - name: web — no emoji in product UI
        working-directory: web
        run: npm run check:no-emoji

      # The docs' copy of the shared token layer (#401). docs.laterite.dev has no
      # bundler, so it cannot follow the @import chain into src/shared/styles or
      # into the Fontsource packages — its tokens and its three self-hosted
      # families are GENERATED into web/docs-site/docs/ and committed.
      #
      # A copy nobody re-generates is the whole risk: a retuned colour would ship
      # to the app and the apex and silently leave the docs on the old palette,
      # and nothing about the docs would look broken enough to notice. HERE
      # because this job already runs `npm ci` in web/, which is all the check
      # needs — it reads node_modules and compares, it does not build.
      - name: web — docs token bundle matches the shared layer
        working-directory: web
        run: npm run check:docs-tokens

      # The wasm half of #164's doc-output gate. The examples on
      # reference/wasm-api.md import `@laterite/ags4-wasm` by its PUBLISHED name
      # and run headless here, and their committed `.out` is compared to what
      # they actually print — so the page documenting the browser package cannot
      # drift from the package.
      #
      # HERE because this is the only job that builds the wasm bindings (the step
      # above), and it is gated on BOTH `web/**` and `rust-packages/**` — so a
      # change to the wasm crate re-runs it, not just a change to the examples.
      # The python/node/cli surfaces run in their own jobs; the structural half
      # (`--check-pages`, no build needed) runs unfiltered in wiki-lint.yml.
      - name: gen_doc_outputs --check (docs example output == real stdout, wasm)
        working-directory: ${{ github.workspace }}
        run: |
          python3 -V
          python3 tools/gen_doc_outputs.py --check --surface wasm

      # The SLIM wasm (#330) — the artifact npm actually gets, which the step
      # above does NOT build: `build:wasm:all` builds the app's two engines,
      # tier 1 and the full one, and npm's is neither. Built and checked here rather than only
      # in release.yml for the reason prepare-wasm-package.sh's header records
      # about the npm notice guard: a publish-path check whose first execution
      # is a live release takes three tag moves to get right. This is the same
      # check, reachable on every PR.
      #
      # Cheap where it sits: wasm-pack and the wasm32 toolchain are already
      # installed for the step above, and sccache has the dependency crates warm
      # from the full build, so only the slim leaf recompiles.
      - name: wasm — build the slim artifact and hold it to its ceiling
        working-directory: ${{ github.workspace }}
        run: |
          wasm-pack build rust-packages/laterite-ags4-wasm --target web --release \
            --out-dir "$RUNNER_TEMP/wasm-slim" -- --no-default-features
          node tools/release/check-wasm-slim.mjs "$RUNNER_TEMP/wasm-slim"

      # The TIER-1 wasm (#352) — the engine minus `arrow` and `excel`, which the
      # browser precaches since #355 (#338, ags-wiki/design/dec-engine-tiering.md).
      # It is what `build:wasm` produces and what `src/wasm` now holds, so this
      # measures the artifact the app actually ships rather than a second build
      # of the same flags: the step above already built it.
      #
      # The gzip and raw ceilings live in tools/release/check-wasm-tier1.mjs,
      # which fails this step when either is crossed — the only place either
      # number belongs. The raw one is load-bearing downstream as well:
      # `maximumFileSizeToCacheInBytes` in web/vite.config.ts sits above it and
      # below the full engine, so raising this gate without moving that setting
      # would quietly stop the engine being precached at all.
      - name: wasm — hold the tier-1 artifact to its ceiling
        working-directory: web
        run: npm run check:wasm-tier1

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # PR-tier Rust test authority. The heavier INSTRUMENTED coverage MEASUREMENT
  # moved to the nightly (nightly.yml) — `-C instrument-coverage` changes
  # RUSTFLAGS so every Rust crate is an sccache MISS (only the bundled-DuckDB
  # C++ stays cached via CC/CXX), which made it the single longest job on the PR
  # board. This plain `cargo test` uses the SAME non-instrumented profile the
  # rest of CI builds, so it is cache-warm run over run, not a cold recompile.
  # PARALLEL — no `needs` beyond `changes` — so it never slows the fast
  # `rust` -> `python` critical path (folding it into `rust` would).
  #
  # Scope: the workspace minus laterite-ags4-wasm (a wasm32 cdylib, built +
  # host-tested in the `rust` job) and the binding cdylibs laterite-py (PyO3) +
  # laterite-node (napi) — exercised by the Python / Node suites, never by
  # `cargo test` (laterite-node further can't even link a standalone lib-test
  # under napi 3: its N-API symbols only resolve once the Node host loads the
  # addon).
  #
  # The nightly coverage run excludes MORE than this, and deliberately so: it also
  # drops the dev-only QA crates (xcheck, parity, forge, corpus-qa, perf,
  # compliance) so its floor measures the shipped engine over a stable denominator.
  # They are excluded from that MEASUREMENT, not from testing — this job is the
  # test authority for them, and it must keep running them.
  test:
    needs: changes
    # `!cancelled()` is load-bearing (see the rust job's note): a failed `needs`
    # must not silently skip us, and `!= 'success'` means any non-answer runs.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold (no-op off the pool) — the plain profile shares the cache
      # the `rust` job populated.
      - uses: ./.github/actions/build-accel

      - name: cargo test (workspace)
        working-directory: rust-packages
        # `--features` is load-bearing, not decoration. The `arrow` feature is
        # enabled ONLY by the four crates excluded here, and resolver-2 unifies
        # features across the SELECTED packages only — so without this flag
        # `laterite-ags4-types::{arrow_cols, ipc}` and `laterite-ags4-emit::arrow_in`
        # are `#[cfg]`-ed out and their tests never compile, let alone run. That
        # is the Arrow boundary that ships inside the wheel and the node binding.
        run: |
          cargo test --workspace \
            --exclude laterite-ags4-wasm \
            --exclude laterite-ags4-tokenizer-wasm \
            --exclude laterite-py \
            --exclude laterite-node \
            --features laterite-ags4-emit/arrow,laterite-ags4-types/arrow

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  python:
    needs: [changes, build-ext]
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, laterite-dev#561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    #
    # NB there is deliberately NO `needs.build-ext.result == 'success'` guard:
    # build-ext (the prebuilt-cdylib producer) is NOT a required check, so if it
    # fails python must FAIL — its download-artifact step 404s — not SKIP. A
    # skipped required check counts as success (the laterite-dev#561 trap), which would let a
    # broken build merge. `!cancelled()` runs python despite a build-ext failure
    # so the missing artefact surfaces as red here (python IS required).
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    env:
      # uv's download cache (persistent runner home) and the workspace venv
      # land on different filesystems on the Docker runner, so uv can't
      # hardlink packages into the venv and warns on every sync/run. The
      # copy fallback is what already happens (≈ms for our handful of
      # packages); this just acknowledges it so the log isn't noisy. NOT a
      # perf fix — that would need the cache to share the venv's filesystem.
      UV_LINK_MODE: copy
    # The ceiling below is generous: the cdylib is now built ONCE in build-ext
    # and downloaded here (see the download step below), so this job's only
    # compile is the lean lat CLI (no bundled DuckDB) plus uv sync + pytest —
    # comfortably inside it on a warm sccache. (It was 50 minutes when this job
    # compiled the PyO3 cdylib itself.)
    timeout-minutes: 30
    steps:
      # needs: build-ext gives this job the prebuilt _laterite_native cdylib
      # (downloaded below) instead of recompiling it. The Rust toolchain +
      # build-accel below are STILL needed — not for the cdylib, but for the lean
      # lat CLI build further down (the byte-parity tests exercise the shipped
      # binary at target/release/lat).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The root `tests/` suite runs here in full, and it includes
          # `test_check_issue_refs.py`, whose gate derives a watermark from the
          # merged-PR history of the default branch. A shallow clone has none, so
          # the gate REFUSES — correctly — and four tests fail on a checkout
          # setting rather than on anything in the diff. `repo-gates` carries the
          # same line for the same gate; `tests/test_check_issue_refs.py` asserts
          # every job that collects it has this.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — see the rust job's note above

      # sccache + mold for the maturin (PyO3 + bundled-DuckDB) build, if present.
      - uses: ./.github/actions/build-accel

      - name: Install uv
        # Pin to a specific v8 patch — astral-sh/setup-uv hasn't
        # published a floating `v8` major tag yet (only `v7`).
        # Revisit once `v8` floating exists.
        # enable-cache: false — uv keeps its own download cache under the
        # persistent runner home, so resolution stays warm locally; the
        # GitHub cache round-trip (+ the Windows tar/gzip save quirk) was
        # avoidable overhead.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python 3.14 via uv
        run: uv python install 3.14

      # No Swatinem/rust-cache (python job): sccache is the shared build
      # cache, so maturin's compile hits it directly — no separate network
      # target/-cache key to download.

      - name: uv sync (deps + maturin into the venv)
        run: uv sync --all-extras

      - name: Download prebuilt cdylib
        # The _laterite_native .so that build-ext compiled once. uv sync
        # above installed laterite EDITABLE (import resolves to the package's
        # python/ source tree) but did not build the extension; dropping the
        # prebuilt .so into that same tree makes `import laterite` work with
        # exactly the layout `maturin develop` used to produce — one extension,
        # nothing recompiled, so no editable-vs-wheel shadowing. A missing
        # artefact (build-ext failed) 404s here → this required job goes red.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: laterite-cdylib
          path: packages/laterite/python/laterite/

      - name: Build lat CLI (for the byte-parity tests)
        # The byte-parity tests (test_cli_json_ndjson_exit_byte_parity et al.)
        # compare the Python `laterite._cli` output against the Rust lat
        # binary at target/release/lat, and @skipif when it's absent.
        # The maturin step above builds only the PyO3 cdylibs, so without this
        # the parity tests SILENTLY SKIP in CI — the Rust↔Python CLI contract
        # goes unchecked on every PR. lat is lean (no bundled DuckDB),
        # so this release build is cheap and sccache-accelerated (build-accel
        # above wraps CC/CXX/rustc). Release, not debug: the test hard-codes
        # the target/release path (matching how the binary ships).
        working-directory: rust-packages
        run: cargo build --release -p laterite-cli

      - name: gen_doc_outputs --check (docs example output == real stdout, python + cli)
        # #164: a docs page single-sources its CODE by reference and then hand-wrote
        # what that code PRINTS. The example could not drift; the output block could,
        # and did — a behaviour change updated the examples and left six blocks across
        # three pages asserting a result the code no longer produced.
        #
        # The output now lives in a `.out` beside the example and the page includes
        # it, so there is no copy in the Markdown at all (the CLI examples in this
        # tree already worked that way). This step re-runs the examples and fails if
        # any committed `.out` is stale.
        #
        # HERE because this job is the one with both launchers: the wheel from the
        # maturin step and the `lat` release binary built above — the same reason the
        # surface census is pinned here. Node's surface runs in the node job, and the
        # structural half (a block must stay wired to its example) runs unfiltered in
        # wiki-lint.yml, since a doc PAGE edit touches no path that fires this job.
        env:
          LAT_BIN: ${{ github.workspace }}/rust-packages/target/release/lat
        run: uv run --no-sync python tools/gen_doc_outputs.py --check --surface python --surface cli

      - name: surface census --check (launchers == surface-census.json)
        # This job has both launchers the census names here — the `lat` release
        # binary built above (the AUTHORITY) and the wheel — so it is the job that
        # pins them; the node job pins npx against the same committed SSOT.
        #
        # A step, not a pytest test: the check needs BUILT launchers, so as a test it
        # would have to skip when they are absent, and a gate that skips itself is
        # what this whole census exists to prevent. (`lat merge` shipped in the binary
        # and never reached the other two launchers with every gate green.)
        #
        # Wired late: the generator emitted a `repo_ref` to a file that has never been
        # in this repo, the rendered page had that line stripped by hand to keep the
        # wiki lint's dead-ref scan green, and so `--check` reported stale forever —
        # unpassable, therefore never run, therefore the census could drift in silence.
        run: uv run --no-sync python tools/gen_census.py --check

      - name: support matrix gate (declared floors == tested floors)
        # `engines.node` said ">=18" for fifteen months while every Node job ran
        # 22 — a floor nothing had ever built or tested, and nothing in the repo
        # could see it. check_msrv.py has prevented exactly this for Rust since
        # it landed; Python and Node had no equivalent, and their floors are the
        # ones a consumer plans against.
        #
        # Bidirectional, like the changelog's breaking flag: a version claimed
        # and never tested is a false promise, and a version tested and never
        # claimed is a half-finished "add 3.15" — the matrix row without the
        # classifier.
        run: uv run --no-sync python tools/check_support_matrix.py

      - name: speed claims match the benchmark table
        # Sibling of the check above, same blind spot one layer out (#327).
        # bench-vs-python-ags4.py already generates the README's speedup tables
        # against SHA-256-pinned fixtures; what had no link was the PROSE that
        # quotes them. Re-running the benchmark updated the table and silently
        # falsified four other files, which is how #326's claim came to sit
        # below every rung of its own table on the first page a python-ags4
        # user reads.
        #
        # Asserts BAND MEMBERSHIP, not equality: the rungs genuinely differ and
        # the instrument drifts between runs, so an equality check would flake
        # on noise and end up disabled — which leaves the prose staler than no
        # gate at all. Bidirectional, because a table moving up leaves the
        # prose understating the product and nobody files that as a bug.
        run: uv run --no-sync python tools/check_speed_claims.py

      - name: ty check (type-faithfulness gate)
        # Astral `ty` over the SHIPPED `laterite` package (scope + the abi3-py312
        # floor are set in pyproject `[tool.ty]`). Runs in the project venv (`uv
        # run`, NOT `uvx`) so it resolves polars/duckdb + the generated
        # `_laterite_native.pyi` and checks the hints against real types — the
        # #303 Phase-1 gate that the type hints can't lie. Beside `ruff check`:
        # both Astral, both fast. Blocking from the start — the surface is clean
        # (its first run caught 3 py3.14-only `except A, B:` clauses that are a
        # SyntaxError on the 3.12/3.13 the wheel ships to; now parenthesized).
        run: uv run ty check

      - name: pytest (+ coverage floor)
        # -n 4: parallel across 4 xdist workers (the host has 8 cores;
        # 4 leaves headroom for the other services sharing it). The
        # suites isolate via per-test tmp_path, so workers don't collide.
        # --durations=20: surface the slowest tests so heavy fixtures can
        # be targeted (session scope, parametrize) over time.
        #
        # --cov gates the laterite Python surface (scope set in pyproject
        # [tool.coverage.run]); pytest-cov combines the per-xdist-worker data
        # automatically. --cov-fail-under is a FLOOR, ratcheted up.
        #
        # History: introduced at 68 (CI ~71%); RATCHETED to 80 after the
        # laterite coverage push. #91 drove the CLI in-process (_cli.py 0% ->
        # 99%) and replaced the python-ags4 sibling-clone compat fixtures with
        # committed clean-room synthetic ones; #88 did the same for the
        # round-trip/dedup fixture. So those tests now RUN in CI instead of
        # silently skipping, and local + CI agree — the old "local over-reports
        # because the sibling clone is absent in CI" caveat is gone. The 95%
        # coverage campaign then took compat.py + _cli.py to 100% and the whole
        # surface to ~99% (see ags-wiki/concepts/coverage-campaign.md), so the
        # floor is RATCHETED to 95 — the campaign's target, with real headroom.
        run: |
          # The root `tests/` suite runs beside the wheel's own. It IS present
          # here and holds the repo-truth gates — dictionary + vendored-authority
          # faithfulness, the crate cards, the self-named-gate rule. This comment
          # used to say the suite was private-only and blocklisted from the public
          # mirror, which stopped being true as those gates landed here; the line
          # below never changed, so the config outlived its own explanation.
          # The `[ -d tests ]` guard stays: handed a missing path pytest aborts
          # collection entirely (0 tests → coverage-floor fail), so a checkout
          # without the directory would take the whole python job down rather
          # than skip a suite. A broken import in `tests/` surfaces as a
          # collection error here (non-zero exit) — no separate sentinel step
          # needed.
          # The root suite runs here IN FULL, exactly as it did before
          # `repo-gates` existed. That job is a fast head start on the buildless
          # part, not a division of the work: narrowing this one to
          # `-m needs_env` looked like the tidy complement and quietly opened a
          # hole — test_landing_demo_delivery is unmarked (it `importorskip`s
          # the wheel per-test), so its eleven wheel-dependent tests would have
          # been deselected here and skipped there, running nowhere while both
          # jobs reported green. Overlap costs seconds; that class of bug does
          # not announce itself.
          uv run pytest \
            packages/laterite/tests \
            $([ -d tests ] && echo tests) \
            -n 4 --durations=20 -q --tb=short \
            --cov=laterite \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      # Codecov `python` flag — public repo only (niko86/laterite), where the
      # badge lives + CODECOV_TOKEN is set. coverage.xml is written by the
      # --cov-report=xml above (repo root).
      - name: Upload Python coverage to Codecov
        if: github.repository == 'niko86/laterite'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # sccache hit/miss visibility (no-op if sccache isn't on this runner).
      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Published-wheel smoke (laterite-dev#554): the per-PR proof that the ARTEFACT users receive
  # actually installs-and-imports. Every OTHER Python gate reaches `laterite`
  # through `maturin develop` (an editable install with the cdylib compiled into
  # the source tree) and reaches the CLI's `main()` through the `__main__` guard —
  # so the real wheel, and the `[project.scripts] lat` console script, are never
  # exercised. An ordinary rename can rot the console script or break the wheel
  # install while every existing gate stays green. This builds the real `--release`
  # abi3 wheel ONCE, then installs it into a FRESH isolated venv (by path, not
  # editable — exactly `pip install laterite`) on real 3.12, 3.13 AND 3.14
  # interpreters — the abi3-py312 floor the wheel claims and that NO other job runs
  # (every Python job today uses only 3.14). `lat --help` proves the console script
  # resolves; a real import+validate proves the wheel works. Plus a `[compat]` leg
  # that is the only pandas-present / pyarrow-absent environment there is.
  wheel-smoke:
    needs: [changes, rust]
    # Same guard shape as `python` (see its note): !cancelled() so a failed need
    # doesn't silently skip us, and code-gated so a docs-only PR doesn't pay for a
    # release wheel build.
    if: ${{ !cancelled() && needs.rust.result == 'success' && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    env:
      UV_LINK_MODE: copy
    # A --release maturin build (PyO3 + bundled DuckDB) plus ONE isolated
    # floor-interpreter install; well under the `python` job's 50 on warm sccache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # sccache + mold so the maturin compile hits the cache the rust job populated.
      - uses: ./.github/actions/build-accel

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # The abi3-py312 FLOOR interpreter (fetched from python-build-standalone;
      # self-hosted runners can't use actions/setup-python — see release.yml). The
      # full 3.12/3.13/3.14 + compat/pyarrow matrix runs daily in nightly.yml's
      # wheel-smoke; this PR gate just proves the RELEASE wheel builds, installs
      # and imports on the floor — the wider matrix is a once-a-day check, not a
      # per-PR cost (W1 of the CI two-tier split).
      - name: Install Python 3.12 via uv
        run: uv python install 3.12

      # Put the build backend (`maturin` + linux `patchelf`, both in the `dev`
      # dependency-group) on PATH. Plain `uv sync` — NOT --all-extras: the wheel
      # build needs only the backend, and `uv sync` installs the workspace editable
      # WITHOUT compiling the cdylib (see the `python` job), so the single compile
      # is the `maturin build` below, not doubled. The runtime test extras get
      # installed into the ISOLATED smoke venvs from the built wheel instead.
      - name: uv sync (build backend into the venv)
        run: uv sync

      # The artefact users receive: the RELEASE abi3 wheel (one cp312-abi3 wheel
      # per platform), built ONCE into dist/ and reused across all three venvs.
      - name: Build the release wheel
        run: (cd packages/laterite && uv run --no-sync maturin build --release --out "$GITHUB_WORKSPACE/dist")

      # Isolated install + console-script + import on the FLOOR interpreter. The
      # wheel is installed BY PATH into a fresh venv — no workspace, no editable
      # .pth, no develop cdylib — so this is exactly `pip install laterite`.
      # `lat --help` (exit 0) is the [project.scripts] resolution proof: the
      # console script is argparse with add_help=False and has no --version (an
      # unknown flag exits 5), so --help, not --version, is the honest probe. The
      # 3.13/3.14 legs + the [compat] / [compat,pyarrow] smokes run nightly.
      - name: Install-and-import the wheel on 3.12
        run: |
          set -euxo pipefail
          wheel=$(echo "$GITHUB_WORKSPACE"/dist/laterite-*.whl)
          venv="$GITHUB_WORKSPACE/.smoke-3.12"
          uv venv --python 3.12 --clear "$venv"
          uv pip install --python "$venv/bin/python" "$wheel"
          "$venv/bin/lat" --help >/dev/null
          "$venv/bin/python" --version
          "$venv/bin/python" tools/wheel_smoke.py

      - name: sccache stats
        if: always()
        shell: bash
        run: command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

  # Docs-site gate (#201). The MkDocs site under web/docs-site/ is example-led
  # (every page `--8<--`-includes a file from examples/) AND carries the
  # mkdocstrings Python API reference, which introspects the *installed*
  # `laterite` wheel at build time. So `--strict` here catches BOTH a broken
  # link / missing nav page / unresolved snippet file AND a broken autodoc
  # cross-reference (e.g. a docstring `[`x`][laterite.x]` whose target moved) —
  # the published docs can't silently rot. This IS the "PR-time `mkdocs build
  # --strict` gate" deploy-validator.yml defers to (its mirror build is
  # non-strict so a link nit never blocks the app deploy).
  #
  # `uv sync --group docs` builds the local working-tree wheel (the docs track
  # HEAD, not the last release — the owner's call) + installs mkdocs-material +
  # mkdocstrings; the Rust toolchain + sccache make the maturin build a warm-
  # cache hit. The examples' RUNTIME behaviour is gated separately by
  # tests/test_docs_examples.py in the `python` job (also `code`-filtered, so an
  # example or fixture edit re-runs it there).
  docs:
    # needs build-ext for the prebuilt cdylib (downloaded below). No
    # build-ext-success guard, same reason as the python job: build-ext isn't
    # required, so a build-ext failure must fail THIS (required) job via the
    # 404ing download, not skip-pass it.
    needs: [changes, build-ext]
    # `!cancelled()` is load-bearing, NOT decoration: GitHub applies an implicit
    # success() to any `if:` without a status-check function, so a job whose
    # `needs` FAILED is skipped before the condition is ever read. Referencing
    # needs.changes.result is NOT such a function — without !cancelled() this
    # whole clause is a no-op (measured, laterite-dev#561: `deny` stayed skipped while
    # `docs` with !cancelled() ran a full wheel+mkdocs build). `!= 'success'`
    # rather than `== 'failure'` so ANY non-answer (failed/cancelled) means RUN:
    # the filter failing to answer must never read as "nothing changed".
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.docs == 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.event_name == 'schedule') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","laterite-linux"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust toolchain / build-accel here any more: the cdylib is built once
      # in build-ext and downloaded below, so this job no longer compiles
      # anything — it is a pure Python (uv + mkdocs) job.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python 3.14 via uv
        # Pin the interpreter to the one build-ext built the cdylib against (the
        # python job pins 3.14 too). The shipped wheel is abi3, so a single .so
        # would load on 3.12+ regardless, but pinning removes the assumption.
        run: uv python install 3.14
      - name: Build the working-tree wheel + docs deps
        run: uv sync --group docs
      # `uv sync` installs laterite EDITABLE but does NOT build the PyO3 cdylib
      # (same gotcha the python job documents) — so mkdocstrings' runtime import
      # AND the group-catalogue generator need `_laterite_native` co-located in
      # the package source tree. Download the prebuilt .so (from build-ext) into
      # that tree instead of recompiling it with `maturin develop`. A missing
      # artefact (build-ext failed) 404s here → this required job goes red.
      - name: Download prebuilt cdylib
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: laterite-cdylib
          path: packages/laterite/python/laterite/
      - name: mkdocs build --strict
        working-directory: web/docs-site
        run: uv run --no-sync mkdocs build --strict
