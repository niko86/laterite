# Parity oracle: runs python-ags4's own test suite shimmed against
# laterite.compat. The failing SET is the parity contract.
#
# Manual `workflow_dispatch` + scheduled weekly so an upstream
# silent drift surfaces before it bites a user.  cadence: parity
#
# That sentence was false for as long as it existed (laterite-dev#558): PYTHON_AGS4_VERSION
# below pins the oracle, so the cron re-ran one frozen version forever and could
# never see upstream move. The pin is right — it is what makes the contract
# reproducible — so the fix is the missing half, not unpinning: the
# `upstream-pin` job notices when PyPI moves past us and a human decides. The
# rationale above is now achievable rather than aspirational.
#
# The contract is the FAILING SET, by identity — `parity-known-failures.json`
# names all 10 deliberate non-closures with the reason each is accepted (laterite-dev#556).
# It replaced a pass-count floor of 121, which was blind to a SWAP: one test
# regressing while another started passing held the count and went green. The
# ten reasons also lived only in prose that no job read — so the contract CI
# enforced and the contract we had agreed were different objects, with nothing
# comparing them. The reasons now live in the fixture itself; the O-N-linked
# ones cross-reference OBSERVATIONS.md.

name: parity

on:
  workflow_dispatch:
  schedule:
    # Sundays, 03:00 UTC. Weekly rather than monthly (cadence: historical=monthly)
    # since the `dropin-surface` job joined: a month is a long time to be unaware
    # that upstream grew a public function our drop-in doesn't have. Both
    # scheduled jobs are cheap (no wheel build, no Rust), so the extra cadence
    # costs close to nothing.  cadence: parity
    - cron: "0 3 * * 0"
  # Per-PR regression gate (#190).  cadence: parity-pr
  # NO trigger-level `paths:` — that is what made
  # this un-requireable (laterite-dev#556): a required check behind a trigger filter never
  # fires on an out-of-scope PR, so no check run is created and the requirement
  # pends FOREVER, exiting only via the admin bypass button. We already ate that
  # on wiki-lint (PR laterite-dev#497). The path-gating moved into the `changes` job below, so
  # this workflow ALWAYS reports — skip-as-success when out of scope — which is
  # the shape a required check must have.
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_AGS4_VERSION: "1.2.0"

# Least privilege: the job only checks out, clones a public repo, and runs tests.
permissions:
  contents: read

jobs:
  # Path-gating at JOB level (laterite-dev#556). Same shape as ci.yml, including the
  # `!cancelled()` + `result != 'success'` clause below — see laterite-dev#561: when the
  # filter cannot answer, the honest read is "run it", never "nothing changed".
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compat: ${{ steps.filter.outputs.compat }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Anything that can move the compat verdict. The GitLab clone is the
          # cost this avoids on a doc-only PR.
          filters: |
            # Anything that can move a DEMO state's answer: the demo's own
            # model and emitter, the states the sweep enumerates, and the two
            # halves of the generator. Deliberately NOT the `compat` filter —
            # a demo-only change must not spin up the GitLab clone, and a
            # validator change must run BOTH.
            demo:
              - 'web/landing/demo/**'
              - 'web/scripts/sweep-demo-states.mjs'
              - 'tools/gen_demo_state_map.py'
              - 'rust-packages/laterite-ags4-validator/**'
              - 'rust-packages/laterite-ags4-parse/**'
              # The dictionary and rules catalogue the validator PROJECTS from.
              # An edition or dictionary edit moves a demo answer without
              # touching a rule module, so leaving this out is a filter that
              # switches the gate off exactly when it is needed.
              - 'rust-packages/laterite-ags4-reference/**'
              - 'rust-packages/laterite-ags4-forge/**'
              - '.github/workflows/parity.yml'
            compat:
              - 'rust-packages/laterite-ags4-validator/**'
              - 'rust-packages/laterite-ags4-parse/**'
              - 'rust-packages/laterite-ags4-core/**'
              - 'rust-packages/laterite-py/**'
              - 'packages/laterite/python/laterite/**'
              - 'tools/run_python_ags4_tests.sh'
              - 'tools/check_parity.py'
              - 'parity-known-failures.json'
              - '.github/workflows/parity.yml'

  # laterite-dev#558: the header's stated purpose, made achievable. Scheduled/dispatch only,
  # NEVER on a PR — upstream releasing something while a PR is open is not that
  # PR's fault, and a required check that fails for reasons its author cannot act
  # on is a check people learn to click past. On the cron, a red run IS the notice.
  #
  # Separate from `parity` on purpose: sharing that job would collapse two very
  # different signals ("we regressed" and "they released") into one red X.
  upstream-pin:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      # The dev group only — this needs python-ags4 importable to read its
      # INSTALLED version, not the wheel built or the oracle cloned. The
      # installed distribution is the fact; the hand-written "1.2.0"s in the tree
      # are claims about it.
      #
      # `--no-install-workspace`, not `--no-install-project`: the latter skips
      # only the root, so `laterite` would still resolve as a workspace member and
      # drag in a maturin + full Rust build for a job that reads one version
      # string.
      - name: Sync the dev group (python-ags4 is a declared dev dep)
        run: uv sync --group dev --no-install-workspace

      - name: Has upstream moved past our pin?
        run: uv run --no-sync python tools/check_upstream_pin.py

  # The SURFACE half of "did upstream move under us?". `upstream-pin` above sees
  # that a version changed; `parity` (below) sees behaviour, but only on paths
  # python-ags4's own tests exercise. Neither notices upstream ADDING a public
  # function: no old test calls it, so parity stays green while a user porting
  # `from python_ags4 import AGS4` hits AttributeError on a name we never knew
  # existed. This job compares the public callables name-by-name and enforces
  # `compat-surface-gaps.json` — the deliberate non-mirrors, by identity, same
  # contract shape as parity-known-failures.json.
  #
  # Also PR-exempt, for the same reason as upstream-pin: upstream releasing while
  # a PR is open is not that PR's fault. On the weekly cron, a red run IS the
  # notice.  cadence: parity
  # Separate job so "they added something" and "we regressed" can't
  # collapse into one ambiguous red X.
  #
  # No wheel, no Rust, no maturin: the check is AST-based on both sides, so the
  # same cheap `--no-install-workspace` sync upstream-pin uses is enough.
  dropin-surface:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync the dev group (python-ags4 is a declared dev dep)
        run: uv sync --group dev --no-install-workspace

      - name: Does laterite.compat still cover python-ags4's public API?
        run: uv run --no-sync python tools/check_dropin_surface.py

  # The demo tells a reader that the two engines answer differently in places.
  # This holds that claim to every state the demo can reach rather than to the
  # handful anyone checked by hand — a handful is not evidence about a few
  # hundred, which is the correction that produced this job (#659).
  #
  # Its own job, not a step in `parity`, for the reason the header already gives
  # about `upstream-pin`: "we regressed" and "a demo state moved" are different
  # signals and sharing a job collapses them into one red X. It is also much
  # lighter — it needs the `python_ags4` PACKAGE, not the GitLab clone of
  # upstream's test suite.
  demo-state-map:
    needs: changes
    # `!cancelled()` is load-bearing here for the same reason it is on `parity`:
    # without it GitHub applies an implicit success() and skips the job before
    # ever reading the condition.
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.demo == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync the dev group (python-ags4 is a declared dev dep)
        run: uv sync --group dev --no-install-workspace

      # Vite resolves the demo's `?raw` seed import, which is why the sweep
      # loads the real `delivery.ts` instead of reimplementing it.
      - name: web — install
        working-directory: web
        run: npm ci

      # forge is what runs BOTH engines and reports per-rule counts.
      - name: Build forge (the dual-validator)
        run: cargo build --release -p laterite-ags4-forge
        working-directory: rust-packages

      - name: Every demo state answers the way the map says
        run: uv run --no-sync python tools/gen_demo_state_map.py --check

  parity:
    needs: changes
    # `!cancelled()` is load-bearing — without it this clause is a NO-OP, because
    # GitHub applies an implicit success() to any `if:` lacking a status-check
    # function and skips the job before reading it (measured, laterite-dev#561/#562).
    if: ${{ !cancelled() && (github.event_name != 'pull_request'
        || needs.changes.result != 'success'
        || needs.changes.outputs.compat == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable # explicit channel — required when hash-pinned

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Clone python-ags4 sibling repo
        run: |
          # python-ags4's wheel doesn't ship its tests/, so the oracle is its
          # GitLab source tree cloned next to the repo. `rm -rf` first is
          # defensive idempotency — a re-run in the same workspace (or a warm
          # actions/checkout) would otherwise fail "destination already exists".
          rm -rf ../ags-python-library
          git clone https://gitlab.com/ags-data-format-wg/ags-python-library \
              ../ags-python-library
          # python-ags4's tags have NO `v` prefix (the tag is `1.2.0`, not
          # `v1.2.0`) — a `v${...}` checkout fails with "pathspec did not match".
          ( cd ../ags-python-library && git checkout "${PYTHON_AGS4_VERSION}" )

      - name: uv sync
        run: uv sync --all-extras

      # uv sync installs the workspace packages editable but does NOT compile the
      # PyO3 cdylib (_laterite_native). Without this the oracle's
      # `import laterite.compat` fails with a missing-_laterite_native
      # ImportError and pytest collects 0 tests → "0 passed" → false regression.
      # (Same step ci.yml's python job runs; parity was missing it — the broken
      # `git checkout v1.2.0` clone masked it until that was fixed.)
      - name: Build native extensions (maturin develop)
        run: |
          (cd packages/laterite && uv run --no-sync maturin develop --uv)

      - name: Run python-ags4 parity oracle
        id: parity
        run: |
          set +e
          ./tools/run_python_ags4_tests.sh 2>&1 | tee parity.log
          set -e
          passed=$(grep -Eo '[0-9]+ passed' parity.log | tail -n1 | awk '{print $1}')
          failed=$(grep -Eo '[0-9]+ failed' parity.log | tail -n1 | awk '{print $1}')
          echo "passed=${passed:-0}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed:-0}" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## parity vs python-ags4 ${PYTHON_AGS4_VERSION}

          - Passed: **${{ steps.parity.outputs.passed }}**
          - Failed: **${{ steps.parity.outputs.failed }}**
          - Contract: \`parity-known-failures.json\` (the failing SET, by identity)
          EOF

      # The contract is the failing SET, not the pass COUNT (laterite-dev#556). A count is
      # blind to a SWAP: one test regressing while another starts passing holds at
      # 121 and goes green. Proven — see the PR.
      - name: Enforce the parity contract by IDENTITY
        run: uv run --no-sync python tools/check_parity.py parity.log
