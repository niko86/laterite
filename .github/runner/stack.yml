# Portainer stack for the ags5 self-hosted GitHub Actions runner pool.
#
# Version-controlled on purpose: hand-editing this on the server is how a
# truncated LABELS value (`ags5-por` vs `ags5-portainer`) once left every job
# queued against a runner nothing matched. Deploy this file as-is and set only
# RUNNER_PAT in Portainer's stack env vars.
#
# Image is built from .github/runner/Dockerfile (sccache + mold + wasm-pack +
# a baked Rust toolchain), so nothing tool-related needs to be installed per job.
#
# ⚠️ disk: each replica builds the bundled-DuckDB debug target/ in its _work. The
# runner-work volume (below) keeps that off the container's writable layer —
# without it, build artefacts (and crashed-job debris) bloated the container to
# ~45 GB and filled the VM. Two concurrent builds can still overrun a tight disk,
# so start at replicas:1 (serial); raise only after confirming headroom. sccache
# is shared on NFS (one copy, off the VM) — scaling replicas does NOT multiply it.

services:
  runner:
    image: ags5-runner:latest
    environment:
      # --- runner registration ---
      REPO_URL: https://github.com/niko86/ags5_concept
      # Fine-grained PAT (Administration: Read & write) — set in Portainer's
      # stack Environment variables, NEVER inline here.
      ACCESS_TOKEN: ${RUNNER_PAT}
      RUNNER_SCOPE: repo
      # The label the workflows route to. Keep the full string — a truncation
      # here silently strands every job in "queued".
      LABELS: self-hosted,linux,x64,ags5-portainer
      RUNNER_NAME_PREFIX: ags5-pool
      # Fresh runner + _work per job. The warm cache is sccache on NFS (below),
      # NOT a persisted target/, so ephemeral costs nothing and avoids the
      # disk-pressure cache wipes a persistent target/ caused.
      EPHEMERAL: "true"
      # Build artefacts (_work/target/) go to the dedicated runner-work volume
      # (below), NOT the container's writable layer. Without this they pile into
      # the container — a crashed job once ballooned it to 45 GB, filling the VM —
      # and only a container recreate reclaims them. On the volume, ephemeral
      # cleanup frees them per job; `docker volume rm runner-work` clears residue.
      # Mount path MUST equal RUNNER_WORKDIR.
      RUNNER_WORKDIR: /runner/_work
      # --- build cache (sccache only; lives on NFS, off the VM disk) ---
      SCCACHE_DIR: /cache/sccache
      SCCACHE_CACHE_SIZE: 30G
      # NOTE: no CARGO_HOME here. It's baked into the image (/usr/local/cargo)
      # and stays container-local (wiped each ephemeral job). A shared CARGO_HOME
      # on NFS previously corrupted concurrent crate unpacks — do not re-add it.
    volumes:
      # NFS-backed bind mount from the host (TrueNAS export). The only shared,
      # persisted cache; everything else is transient.
      - /srv/ci-cache/sccache:/cache/sccache
      # Dedicated _work volume (path matches RUNNER_WORKDIR) — keeps build
      # artefacts off the container writable layer so a crash can't bloat it.
      - runner-work:/runner/_work
    # Cap the runner's JSON logs (they grew to ~2.4 GB uncapped) so they can't
    # fill the disk on their own.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1 # start serial; raise only with confirmed disk headroom (see above)
      resources:
        limits:
          cpus: "3" # leave cores for the host's other services (8-core host)
          memory: 8G # cap RAM so a build can't OOM-kill the runner agent (24 GB host)
    restart: unless-stopped

volumes:
  runner-work:
