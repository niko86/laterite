<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>laterite — AGS4 tooling</title>
    <meta
      name="description"
      content="Validate, fix, explore and write AGS4 geotechnical transfer files — from Python, Rust, Node, the CLI, DuckDB or the browser."
    />
    <link rel="canonical" href="https://laterite.dev/" />
    <!-- The icon set ships from THIS build's public/ — byte-identical copies
         of the app's web/public/icons/ set, pinned by icons.test.ts. The
         landing previously linked /icons/icon-128.png while shipping no
         public/ directory at all, so every icon request 404ed (#598).
         /favicon.ico is committed unlinked for the agents that probe it
         blind; tools/gen_landing_favicon.py is its provenance. -->
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="/icons/icon-128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="/icons/icon-256.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Tracks the SYSTEM scheme, as the app's does: theme-color has no class
         form, so it follows the OS while the page itself follows the stored
         choice. Values mirror --canvas in each theme. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ece5e0"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14100f"
    />
    <!-- Apply the stored-else-system theme before first paint so a dark-mode
         visitor never sees a light flash (#400). Byte-identical to the app's
         script on purpose: the same storage key, so a reader who set the theme
         in the web app arrives here with it already applied. `theme.ts` then
         reads this class as its initial state rather than re-deriving it. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          )
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
