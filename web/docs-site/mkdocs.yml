# laterite docs site (#201). Built with MkDocs + Material; published at
# /laterite/docs/ on the same GitHub Pages artifact as the validator web app
# (the deploy builds into ../dist/docs, which lives under web/dist that the
# Pages workflow uploads). `strict: true` turns any broken internal link or
# missing-nav page into a build failure — the docs can't silently rot.
#
# Example-first: every code snippet is single-sourced from
# examples/{python,node,cli,duckdb}/ via pymdownx.snippets (`--8<--`), and each
# tree has a runtime gate — tests/test_docs_examples.py (python),
# laterite-node/test/docs-examples.test.ts (node), tests/test_docs_cli_examples.py
# (dev satellite; cli, vs committed .out files), tests/test_docs_duckdb_examples.py
# (dev satellite; duckdb, monthly via compliance-report.yml) — so a page and its
# test are the same bytes.  cadence: compliance-report
# Every example's OUTPUT is generated too (tools/gen_doc_outputs.py): the `.out`
# beside each example is what it really printed, and the page includes it, so a
# block cannot drift from the code it documents (#164).
#
# The wasm surface documents `@laterite/ags4-wasm` on reference/wasm-api.md —
# NOT as a Browser tab per cookbook page. The web app is a showcase for that
# package rather than a product, so it gets one page describing it
# (surfaces/browser.md) and the package gets the API reference every other
# surface has. Thirteen near-identical Browser tabs said 'the same engine, in
# your browser, nothing uploaded' thirteen times and are gone.

site_name: laterite
site_description: >-
  Read, validate, query and produce AGS4 geotechnical data — born-typed, fluent,
  one engine across Python, the CLI, Node and DuckDB.
site_url: https://docs.laterite.dev/
repo_url: https://github.com/niko86/laterite
repo_name: niko86/laterite
# Overwritten at build time by hooks/version_stamp.py, which appends the product
# version + a changelog link. Kept here as the fallback text and so the footer is
# still legible if the hook is ever removed.
copyright: laterite — MIT-licensed AGS4 tooling
hooks:
  - hooks/version_stamp.py
  # Holds the TOC rail's media query to mkdocs-material's own sidebar
  # breakpoint, which it necessarily copies (#402). Warns rather than raises, so
  # `--strict` fails on a PR and the deliberately non-strict deploy stays green.
  - hooks/rail_breakpoint.py

docs_dir: docs
site_dir: ../docs-dist
strict: true

theme:
  name: material
  # The override layer (#401). Two things the bedrock pairing needs cannot be
  # reached from a stylesheet: the masthead lockup (product name · section ·
  # version, which is markup) and the band swatch each top-level nav section
  # carries. Everything else on this site is CSS.
  custom_dir: overrides
  # No third-party font origin. Material's default `{% block fonts %}` preconnects
  # to fonts.gstatic.com and pulls Roboto from fonts.googleapis.com; `false`
  # removes both, and stylesheets/tokens.css (generated from the shared layer)
  # supplies the self-hosted faces plus the `--md-text-font` / `--md-code-font`
  # hooks Material composes its families from.
  font: false
  palette:
    # `primary`/`accent` are `custom` so that NO `[data-md-color-primary=…]` rule
    # exists in Material's palette.css — that selector outranks `:root`, so a
    # named primary (this was `deep orange`) silently beats the pairing's own
    # values wherever the two disagree. The scheme names stay Material's, because
    # `slate` is what its toggle writes and what the generated token bundle
    # rewrites the shared `.dark` rule onto.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    # The mono uppercase breadcrumb the direction puts above each page h1. It
    # also carries the "where am I" job the masthead used to do by swapping the
    # lockup for the page title on scroll — the lockup is now fixed.
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  # Both written into the build by scripts/gen_brand.py from the repo-root
  # `assets/` — the one place the mark is drawn.
  logo: assets/laterite.svg
  favicon: assets/laterite-icon-128.png
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  # Group catalogue (#201) — one page per AGS4 group generated at build time
  # from the shipped `laterite.registry` (which inherits the JSON→registry
  # faithfulness gate). literate-nav builds the family-bucketed sub-nav from the
  # generated SUMMARY.md. Pages are NOT committed (no 174-file churn per dict edit).
  - gen-files:
      scripts:
        - scripts/gen_brand.py
        - scripts/gen_groups.py
        - scripts/gen_types.py
        # `lat` command reference — rendered from the shipped README-cli.md
        # (`lat --readme`), so a new verb never leaves the docs stale.
        - scripts/gen_cli.py
  - literate-nav:
      nav_file: SUMMARY.md
  # API reference — mkdocstrings introspects the *installed* `laterite` wheel
  # (runtime handler), so the docs build needs the workspace wheel present
  # (`uv sync` builds the local working-tree wheel the docs track). The
  # docstrings are Sphinx/reST style (`:param:`/`:returns:`/`:class:`).
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: false
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # `--8<-- "python/ex01_read_typed.py"` resolves under examples/ — the same
      # files tests/test_docs_examples.py executes, so page == test.
      base_path: [examples]
      check_paths: true

# Group-catalogue master table: filter + 20-per-page pagination + family-card
# filtering (vanilla JS, no third-party dependency — keeps the docs CDN-free).
# `rail.js` is the table-of-contents strata rail (#401) — the same vanilla,
# CDN-free contract.
extra_javascript:
  - javascripts/catalogue.js
  - javascripts/rail.js
# Order matters: the generated token bundle defines the vocabulary, the override
# layer maps Material onto it, and the catalogue sheet dresses the one spotlight.
extra_css:
  - stylesheets/tokens.css
  - stylesheets/laterite.css
  - stylesheets/catalogue.css

