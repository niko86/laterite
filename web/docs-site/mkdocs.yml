# laterite docs site (#201). Built with MkDocs + Material; published at
# /laterite/docs/ on the same GitHub Pages artifact as the validator web app
# (the deploy builds into ../dist/docs, which lives under web/dist that the
# Pages workflow uploads). `strict: true` turns any broken internal link or
# missing-nav page into a build failure — the docs can't silently rot.
#
# Example-first: every Python/CLI snippet is single-sourced from
# examples/{python,cli}/ via pymdownx.snippets (`--8<--`), and those files are
# executed by tests/test_docs_examples.py, so a page and its test are the same
# bytes. Phase 1 is Python + CLI only (Node/DuckDB tabs land with their gates).

site_name: laterite
site_description: >-
  Read, validate, query and produce AGS4 geotechnical data — born-typed, fluent,
  one engine across Python, the CLI, Node and DuckDB.
site_url: https://niko86.github.io/laterite/docs/
repo_url: https://github.com/niko86/laterite
repo_name: niko86/laterite
copyright: laterite — MIT, clean-room AGS4

docs_dir: docs
site_dir: ../dist/docs
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  # API reference — mkdocstrings introspects the *installed* `laterite` wheel
  # (runtime handler), so the docs build needs the workspace wheel present
  # (`uv sync` builds the local working-tree wheel the docs track). The
  # docstrings are Sphinx/reST style (`:param:`/`:returns:`/`:class:`).
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: false
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # `--8<-- "python/ex01_read_typed.py"` resolves under examples/ — the same
      # files tests/test_docs_examples.py executes, so page == test.
      base_path: [examples]
      check_paths: true

nav:
  - Home: index.md
  - Learn:
      - learn/index.md
      - 1. Install & first validate: learn/install.md
      - 2. Read & explore a file: learn/read.md
      - 3. Validate in Python: learn/validate.md
      - 4. Query across groups: learn/query.md
      - 5. Produce AGS4: learn/produce.md
  - Cookbook:
      - cookbook/index.md
      - Reading & typing:
          - Get one group as a typed frame: cookbook/get-typed-frame.md
          - Read XN columns as numeric: cookbook/read-xn-numeric.md
          - Explore the registry & KEY chain: cookbook/explore-registry.md
      - Validating:
          - Validate a delivery: cookbook/validate-a-delivery.md
          - List the rules / report the edition: cookbook/list-rules.md
      - Querying:
          - Filter & select one group: cookbook/filter-select.md
          - SQL across groups: cookbook/sql-across-groups.md
          - Pull one borehole's record set: cookbook/borehole-record-set.md
          - Splice your own step (.pipe): cookbook/pipe.md
      - Producing AGS4:
          - Build from frames: cookbook/build-from-frames.md
          - Build from a typed graph: cookbook/build-from-typed-graph.md
      - Repairing & comparing:
          - Fix a dirty file: cookbook/fix-a-dirty-file.md
          - Diff two revisions: cookbook/diff-revisions.md
          - Certify a clean file: cookbook/certify.md
      - Sharing & migrating:
          - Pack / encrypt for transport: cookbook/transport.md
          - Drop-in for python-ags4: cookbook/compat.md
  - Chaining: chaining/index.md
  - Concepts:
      - Born-typed reads: concepts/born-typed.md
      - The fluent model: concepts/fluent-model.md
      - One engine, many doors: concepts/one-engine-many-doors.md
      - The .ags.idx certificate: concepts/certificate-lifecycle.md
      - Content-addressed join keys: concepts/content-addressed-keys.md
      - Dictionary auto-selection: concepts/dictionary-selection.md
      - Severity tiers: concepts/severity-tiers.md
      - Dependency shape: concepts/dependency-shape.md
  - Reference:
      - CLI (lat-check): reference/cli.md
      - Python API: reference/api.md
      - Support modules: reference/modules.md
      - Python cheatsheet: reference/cheatsheet.md
