[project]
name = "laterite-workspace"
version = "0.5.0"
description = "uv workspace root for the laterite AGS toolkit (dev monorepo aggregator; ships no wheel)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "laterite",
    "duckdb>=1.5.2",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "lxml>=6.1.0",
]

[tool.uv.workspace]
# Only `packages/laterite` remains here; the experimental AGS5 packages
# (laterite-ags5 / laterite-ags5x) were moved to the dormant `ags5/` holding
# folder (#177 decouple) and are no longer workspace members.
members = ["packages/*"]

[tool.uv.sources]
laterite = { workspace = true }

[dependency-groups]
# altair / vegafusion / vl-convert-python (the retired format-comparison
# dashboards) and pyinstaller / nuitka (the dropped Python-binary packaging)
# were removed here. `marimo` is back for the laterite tour notebook —
# author it with `uv run --group dev marimo edit --sandbox examples/laterite_tour.py`
# (the notebook's PEP 723 header brings polars/duckdb/altair/pyarrow/laterite,
# so the shipped wheel never gains marimo). pandas<3 stays — python-ags4 needs
# it and ags5_ags4/codec.py imports it directly.
dev = [
    "marimo>=0.10",
    "pandas<3",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    # Property-based testing. Drives `parse_value` totality + the
    # Ags4File text round-trip with generated input the example-based
    # tests don't reach (the laterite-base tests in
    # packages/laterite/tests/test_ags_types.py + test_ags4file.py).
    "hypothesis>=6.100",
    # Parallel test execution. The laterite + ags5 suites are
    # file/DuckDB-heavy (per-test tmp_path isolation), so they fan out
    # cleanly across workers. CI runs `-n 4` to roughly halve the suite
    # while leaving headroom on the shared self-hosted runner host.
    "pytest-xdist>=3.6",
    # Line-coverage gate for the laterite + laterite_ags5 Python surface.
    # CI's pytest passes --cov + --cov-fail-under (see ci.yml); the
    # [tool.coverage] config below scopes it to the two packages. Plays
    # with xdist (combines per-worker data automatically).
    "pytest-cov>=5",
    "ruff>=0.7",
    # Build backend for the `laterite` package (PyO3 extension compiled
    # from rust-packages/laterite-py). In the dev group so a workspace
    # `uv sync` builds the native module; not a runtime dep of any
    # ags5-* package.
    "maturin>=1.7,<2",
    # Lets maturin set the cdylib rpath during `maturin develop` (the
    # editable build) on Linux; without it maturin warns "Failed to set
    # rpath … Failed to execute 'patchelf'". Installed into the workspace
    # venv so `uv run maturin develop` finds it on PATH. Linux-only (the
    # editable-.so rpath step is a Linux concern; macOS/Windows handle it
    # differently) and marker-gated so cross-platform syncs skip it.
    "patchelf; sys_platform == 'linux'",
    # Oracle PIN, not a floor: the Rust↔python parity catalogue
    # O-2/O-3/O-26/O-27/O-30/O-34) is encoded against python-ags4 1.2.0
    # *source behaviour* (e.g. rule_6 no-op, rule_20 on-disk, default
    # rename_duplicate_headers shielding O-8). A silent minor bump would
    # invalidate those arms with no test failure — so pin exactly and
    "python-ags4==1.2.0",
    # python-ags4's own test_ags4.py imports `toml` (undeclared in its
    # pyproject) to read a check-results fixture. Needed only for the
    # parity runner (tools/run_python_ags4_tests.sh).
    "toml>=0.10",
    # Declarative version bumping (the maintained bumpversion successor):
    # stamps the release version across every site + rolls the CHANGELOG in
    # one command. Config in [tool.bumpversion] below; policy in RELEASING.md.
    "bump-my-version>=0.28",
]

[tool.pytest.ini_options]
# --benchmark-disable: run pytest-benchmark bodies ONCE as a functional
# guard but skip the timing rounds (default is 5 rounds × every CI run,
# pure wall-clock waste — test_perf only records, never gates). Devs pass
# --benchmark-enable / --benchmark-only for an actual perf run.
addopts = "--benchmark-disable"
markers = [
    "slow: heavy / CI-expensive tests; deselect on the fast path with -m 'not slow'",
    "benchmark: pytest-benchmark perf guards (timings recorded, never gated)",
]

[tool.coverage.run]
# Scope the coverage gate to the two Python packages CI exercises. Import
# names (not paths) so the editable installs map to their src dirs; this also
# keeps the test files out of the denominator without an explicit omit. The
# --cov-fail-under floor lives in ci.yml's pytest step (visible alongside the
# Rust/web gates), so a bare local `uv run pytest --cov` reports without
# enforcing. pytest-cov combines the per-worker data under `-n` automatically.
source = ["laterite"]
parallel = true

[tool.ruff]
line-length = 88
# py314, NOT py312: ruff lints the WHOLE workspace, which includes the unshipped
# laterite-ags5x — it uses `compression.zstd` (PEP 784), a 3.14-only stdlib module.
# Lowering to py312 makes ruff reclassify `compression` as non-stdlib and flag
# those files' import blocks as mis-sorted (I001). The shipped wheels DO target
# 3.12 (abi3-py312 / requires-python >=3.12), but that floor is enforced by the
# wheel metadata + the CI 3.12 wheel-test, not by this lint target.
target-version = "py314"
extend-exclude = [
    # The dormant experimental-AGS5 holding folder (#177): preserved as-is for
    # a future AGS5 strand to re-link, not active code — excluded from lint.
    "ags5",
    "examples/output",
    "output",
    "rust-packages",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PIE"]
ignore = [
    "E501",  # line length — let the formatter handle it
    "B008",  # function call in argument defaults (FastAPI/pytest idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"**/tests/**" = ["B011"]
# Example scripts intentionally mutate sys.path/env before imports.
# E402: marimo notebooks import inside @app.cell functions.
# B018: a marimo cell's bare last expression IS its rendered output.
"examples/**" = ["E402", "B018"]

# --- Release version management -------------------------------------------
# `bump-my-version` stamps the release version across EVERY site in one command
# and rolls the CHANGELOG. LOCKSTEP: both wheels + the umbrella always share one
# version. Policy + workflow: RELEASING.md. Examples:
#   uv run bump-my-version bump patch        # docs / small fixes
#   uv run bump-my-version bump minor        # new feature OR (pre-1.0) a break
#   uv run bump-my-version bump --new-version 0.2.0rc1   # explicit pre-release
#   uv run bump-my-version bump minor --dry-run -v       # preview, no writes
[tool.bumpversion]
current_version = "0.5.0"
# Parse accepts PEP 440 canonical pre-releases (0.2.0rc1 / 0.2.0dev1, no hyphen
# — PyPI rejects hyphens) so an explicit `bump --new-version 0.2.0rc1` round-
# trips. `bump major|minor|patch` produces a FINAL release (e.g. 0.2.0); cut a
# pre-release explicitly with `--new-version`. (No auto-walking pre_l part — it
# would make a plain `bump minor` reset to 0.2.0dev0.)
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<pre_l>rc|dev)(?P<pre_n>\d+))?'
serialize = [
    "{major}.{minor}.{patch}{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
tag = true
tag_name = "v{new_version}"          # matches release.yml `tags: ["v*"]`
sign_tags = false
commit = true
message = "release: {new_version}"
allow_dirty = false

# wheel + umbrella [project] versions (lockstep)
[[tool.bumpversion.files]]
filename = "pyproject.toml"                  # umbrella workspace (drives uv.lock; not a wheel)
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/laterite/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# compat.py: bump ONLY the laterite release prefix. The +compat.python-ags4.<pin>
# local segment + the banner's "python-ags4 1.2.0" are pinned independently
# (PYTHON_AGS4_COMPAT) and must NOT move on a version bump.
[[tool.bumpversion.files]]
filename = "packages/laterite/python/laterite/compat.py"
search = '__version__ = f"{current_version}+compat.python-ags4.'
replace = '__version__ = f"{new_version}+compat.python-ags4.'

[[tool.bumpversion.files]]
filename = "packages/laterite/python/laterite/compat.py"
search = "laterite {current_version} — compat:"
replace = "laterite {new_version} — compat:"

# CHANGELOG: roll [Unreleased] into the new version + date, and update the
# compare/tag link refs (the old version's tag ref is left in place).
[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] — {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "compare/v{current_version}...HEAD"
replace = "compare/v{new_version}...HEAD\n[{new_version}]: https://github.com/niko86/laterite/releases/tag/v{new_version}"

# Rust crate suite: single-sourced via [workspace.package] version (every
# member inherits it with version.workspace = true). Stamped here so a
# `bump-my-version bump` moves the engine crates + both binaries (lat-check,
# lat-db) in lockstep with the Python wheels — preventing the kind of
# Python/Rust version drift this single-sourcing fixed. The only
# `version = "X"` literal in that file is the [workspace.package] line.
[[tool.bumpversion.files]]
filename = "rust-packages/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
