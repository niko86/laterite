[project]
name = "laterite-workspace"
version = "0.11.0"
description = "uv workspace root for the laterite AGS toolkit (dev monorepo aggregator; ships no wheel)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "laterite",
    "duckdb>=1.5.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
]

[tool.uv.workspace]
# `packages/laterite` is the sole workspace member — the one shipped wheel.
members = ["packages/*"]

[tool.uv.sources]
laterite = { workspace = true }

[dependency-groups]
# altair / vegafusion / vl-convert-python (the retired format-comparison
# dashboards) and pyinstaller / nuitka (the dropped Python-binary packaging)
# were removed here. `marimo` is back for the laterite tour notebook —
# author it with `uv run --group dev marimo edit --sandbox examples/laterite_tour.py`
# (the notebook's PEP 723 header brings polars/duckdb/altair/pyarrow/laterite,
# so the shipped wheel never gains marimo). pandas<3 stays — python-ags4 needs it.
dev = [
    "marimo>=0.23.16",
    "pandas<3",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    # Property-based testing. Drives `parse_value` totality + the
    # Ags4File text round-trip with generated input the example-based
    # tests don't reach (the laterite-base tests in
    # packages/laterite/tests/test_ags_types.py + test_ags4file.py).
    "hypothesis>=6.165.8",
    # Parallel test execution. The laterite suite is file/DuckDB-heavy
    # (per-test tmp_path isolation), so tests fan out cleanly across
    # workers. CI runs `-n 4` to roughly halve the suite while leaving
    # headroom on the shared self-hosted runner host.
    "pytest-xdist>=3.6",
    # Line-coverage gate for the laterite Python surface.
    # CI's pytest passes --cov + --cov-fail-under (see ci.yml); the
    # [tool.coverage] config below scopes it to the package. Plays
    # with xdist (combines per-worker data automatically).
    "pytest-cov>=5",
    "ruff>=0.16.3",
    # Astral's type checker (preview) — the type-faithfulness gate (#303 Phase 1):
    # proves the shipped `laterite` package's type hints don't lie. Same toolchain
    # as ruff/uv (Rust-fast). Run in the project venv (`uv run ty check`, NOT
    # `uvx`) so it resolves polars/duckdb + the generated `_laterite_native.pyi`;
    # config + scope in [tool.ty] below. CI step sits beside `ruff check`.
    "ty>=0.0.71",
    # Dead-code finder for the Python surface (Rust's `dead_code` lint is
    # built-in; Python has no equivalent). NOT a gate — it's a reliquary
    # *scout*: `uv run vulture` surfaces candidate unused funcs/classes for a
    # deletion. Noisy by design on public API / enums / dunders (it can't see
    # cross-package or C-extension callers), so [tool.vulture] below scopes it
    # and whitelists those false-positive shapes. See the reliquary's
    # "Finding relics — tooling" section.
    "vulture>=2.14",
    # Build backend for the `laterite` package (PyO3 extension compiled
    # from rust-packages/laterite-py). In the dev group so a workspace
    # `uv sync` builds the native module; not a runtime dep of the
    # shipped wheel.
    "maturin>=1.14.1,<2",
    # Lets maturin set the cdylib rpath during `maturin develop` (the
    # editable build) on Linux; without it maturin warns "Failed to set
    # rpath … Failed to execute 'patchelf'". Installed into the workspace
    # venv so `uv run maturin develop` finds it on PATH. Linux-only (the
    # editable-.so rpath step is a Linux concern; macOS/Windows handle it
    # differently) and marker-gated so cross-platform syncs skip it.
    "patchelf; sys_platform == 'linux'",
    # Oracle PIN, not a floor: the Rust↔python parity catalogue
    # (OBSERVATIONS O-1..O-34 + ags4-corpus-qa parity.rs reconcile arms
    # O-2/O-3/O-26/O-27/O-30/O-34) is encoded against python-ags4 1.2.0
    # *source behaviour* (e.g. rule_6 no-op, rule_20 on-disk, default
    # rename_duplicate_headers shielding O-8). A silent minor bump would
    # invalidate those arms with no test failure — so pin exactly and
    "python-ags4==1.2.0",
    # python-ags4's own test_ags4.py imports `toml` (undeclared in its
    # pyproject) to read a check-results fixture. Needed only for the
    # parity runner (tools/run_python_ags4_tests.sh).
    "toml>=0.10",
    # Declarative version bumping (the maintained bumpversion successor):
    # stamps the release version across every site + rolls the CHANGELOG in
    # one command. Config in [tool.bumpversion] below; policy in RELEASING.md.
    "bump-my-version>=1.5.1",
    # Independent `age` implementation (Rust `age` crate via PyO3), used only
    # by test_transport_interop.py as an INTEROP ORACLE: it decrypts what our
    # laterite.transport.lock() produced and encrypts what our unlock() reads.
    # A hard dep (not importorskip) because the whole point is to prove our
    # envelope is standard-age, not self-consistent — a skipped oracle proves
    # nothing. Wheels ship for macOS + manylinux (confirmed `uv sync`).
    "pyrage>=1.2",
    # Used only by tools/make-white-bg.py (one-off brand-asset flattening,
    # not imported by anything shipped). Declared here (rather than pulled
    # ephemerally via `--with`) so the widened ty scope (lever 7 of laterite-dev#585,
    # tools/ + tests/) can resolve the import instead of flagging it.
    "pillow>=11",
]

# Docs site (#201, Phase 1): MkDocs + Material. A separate group so the core
# dev sync isn't bloated — the docs CI job + the Pages deploy install
# `--group docs`; the doctest gate also needs the dev wheel to run the
# example library. Material bundles the `--8<--` snippet includes
# (pymdownx.snippets) and the tags plugin the cookbook uses. mkdocstrings
# (the Phase-2 API reference) introspects the *installed* `laterite` wheel at
# build time (runtime handler), so the docs build needs the workspace wheel
# present — `uv sync` builds it (the local working-tree build the docs track).
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    # Capped BELOW the releases that added a hard `properdocs` dependency
    # (gen-files 0.6.1, literate-nav 0.6.3). properdocs is the maintainer's own
    # MkDocs fork; those releases call `properdocs.replacement_warning.setup()`
    # at plugin load, so it executes during every `mkdocs build` purely to print
    # a promotional "MkDocs is abandoned — switch to ProperDocs" notice. We take
    # neither the advert nor an unrequested code-executing dep in the docs build.
    #
    # (The *substance* — MkDocs 1.x unmaintained, a plugin-breaking 2.0 coming —
    # is real, and Material confirms it. But we're insulated: mkdocs-material
    # caps `mkdocs<2` and uv.lock pins 1.6.1. The successor we'd actually follow
    # is Material's own Zensical, not properdocs — so freezing these two plugins
    # costs us nothing. Lift a cap only if a release drops the properdocs dep.)
    "mkdocs-gen-files>=0.6.1,<0.6.2",
    "mkdocs-literate-nav>=0.6.3,<0.6.4",
]

[tool.pytest.ini_options]
# --benchmark-disable: run pytest-benchmark bodies ONCE as a functional
# guard but skip the timing rounds (default is 5 rounds × every CI run,
# pure wall-clock waste — test_perf only records, never gates). Devs pass
# --benchmark-enable / --benchmark-only for an actual perf run.
addopts = "--benchmark-disable"
markers = [
    "slow: heavy / CI-expensive tests; deselect on the fast path with -m 'not slow'",
    "benchmark: pytest-benchmark perf guards (timings recorded, never gated)",
    # The root `tests/` suite is overwhelmingly repo-hygiene: it reads files and
    # compares them. Only a handful import `laterite`, drive the built `lat`
    # binary, or reach for a dev-only third party, and those few are why the
    # whole suite used to sit behind a cdylib download and a `cargo build
    # --release`. This marker names them, so the `repo-gates` job can run
    # everything else with no build at all. Keeping it honest is
    # tests/test_build_marker_faithful.py, not reviewer memory.
    "needs_env: requires the synced project environment (the compiled wheel, the lat binary, or a dev-only third-party dependency); excluded from the buildless repo-gates job",
]

[tool.coverage.run]
# Scope the coverage gate to the shipped laterite package CI exercises. Import
# names (not paths) so the editable installs map to their src dirs; this also
# keeps the test files out of the denominator without an explicit omit. The
# --cov-fail-under floor lives in ci.yml's pytest step (visible alongside the
# Rust/web gates), so a bare local `uv run pytest --cov` reports without
# enforcing. pytest-cov combines the per-worker data under `-n` automatically.
source = ["laterite"]
parallel = true

[tool.vulture]
# Reliquary scout, not a gate (see the dev-dep comment + reliquary.md). Two
# scopes with very different signal-to-noise:
#   * tools/          — internal scripts; a dead function here is almost always
#     really dead (this is where the 3 recorded orphans live). HIGH signal.
#   * packages/…/laterite — the SHIPPED package; most "unused" hits are public
#     API called from OUTSIDE Python (other packages, or the PyO3/wasm/JS
#     surfaces vulture can't see), so treat every hit as a QUESTION to answer
#     against `__all__` + the crate-map, never a delete-on-sight. LOW signal.
# `uv run vulture` prints candidates; a human confirms, then records the
# default so unused *functions/classes* surface (they score 60; raising it to
# 80 would only leave unused imports/vars and hide exactly the relics we want).
paths = ["packages/laterite/python/laterite", "tools"]
exclude = [
    # Generated stub — not hand-written source; drift is guarded by its own test.
    "*/_laterite_native.pyi",
    # Release helpers run only in CI-mirror context; not part of the local surface.
]
ignore_names = [
    # ast.NodeVisitor / dispatch methods reached via getattr, never a direct call.
    "visit_*",
    # pytest collects by name; not "called" from Python's point of view.
    "test_*",
]
ignore_decorators = ["@pytest.fixture"]

[tool.ruff]
line-length = 88
# Match the shipped wheel's floor (abi3-py312 / requires-python >=3.12): linting
# at py312 catches a 3.13+-only stdlib API leaking into shipped code — the same
# floor the `wheel-smoke` job enforces at runtime (it installs and imports the
# built wheel on real 3.12/3.13/3.14). The dormant holding folder (the only
# 3.14-requiring code) is excluded below, so nothing here needs a 3.14 target.
target-version = "py312"
extend-exclude = [
    # Dormant holding folder (#177), kept for a future revive — not active code.
    "ags5",
    "examples/output",
    "output",
    "rust-packages",
    # ruff 0.16 began formatting Python fenced in Markdown, and it rewrites the
    # mkdocs snippet directive `--8<-- "…"` into `--8 < --"…"` (parsing the
    # include marker as Python operators), corrupting the docs. The snippets'
    # SSOT is the `.py` under web/docs-site/examples/ (still ruff-formatted); the
    # `.md` only `--8<--`-includes them, so ruff never needs to touch Markdown.
    # This restores the pre-0.16 scope (`.py` only) under both ruff versions.
    "*.md",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "PIE",
    "SIM", "C4", "RET", "RSE", "PTH", "RUF", "PT", "TCH", "PERF", "FLY",
    "LOG", "ICN", "G", "TRY", "ANN",
]
ignore = [
    "E501",  # line length — let the formatter handle it
    "B008",  # function call in argument defaults (FastAPI/pytest idiom)
    "TRY003",  # external-message-in-raise — flags nearly every `raise X("msg")`, noisy, low value
    "PT018",  # composite-assertion splitting — pure style churn, low value
    # RUF001/002/003 (ambiguous-unicode-character): this codebase deliberately
    # writes en-dash ranges ("A–Z", "1–4"), × for "by"/"times", and — for
    # parenthetical asides throughout prose (comments/docstrings/strings) — the
    # house style, not an accident. Blindly swapping them for ASCII is actively
    # wrong in at least two spots: `_compat_desc.py`'s `[–-]` regex class
    # intentionally matches BOTH dash variants seen in the wild, and its
    # `A–Z` literal must byte-match the Rust engine's real Rule-19 finding text
    # (`rust-packages/laterite-ags4-validator/src/rules/naming.rs`), which also
    # uses an en-dash. No autofix exists for these three rules.
    "RUF001",
    "RUF002",
    "RUF003",
    # ANN401 (any-type): a library that accepts path/text/bytes/file-like and
    # arbitrary dataframes legitimately types those boundaries `Any` — forbidding
    # it means `# noqa` noise, not safety. The rest of ANN (missing arg/return
    # annotations) IS enforced, so `ty` then type-checks what ANN forces you to
    # write. Enabled repo-wide but per-file-ignored in tests/examples below.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# FLY002: fixture AGS4 text is authored as one quoted line per row (readable,
# diffable, matches the format's own line-per-record shape) then joined with
# "\r\n" — the autofix collapses that into one unreadable mega-line, which is
# a strictly worse trade for a one-off fixture literal.
# ANN: a test's signature is not an API — annotating every `test_*(self) -> None`
# and fixture arg is bulk with no safety gain (the test IS the check). Enforced in
# shipped code + tools, ignored here.
"tests/**" = ["B011", "FLY002", "ANN"]
"**/tests/**" = ["B011", "FLY002", "ANN"]
# Example scripts intentionally mutate sys.path/env before imports.
# E402: marimo notebooks import inside @app.cell functions.
# B018: a marimo cell's bare last expression IS its rendered output.
# ANN: illustrative demo scripts, not a typed surface.
"examples/**" = ["E402", "B018", "ANN"]
# The docs-site examples, for the same E402 reason one level along. Each carries a
# PEP 723 header and a fixture arm ABOVE its `--8<-- [start:code]` marker, so the
# `import laterite` a reader must see on the page necessarily follows a statement.
# Ordering it legally would mean hoisting the import out of the shown region —
# publishing a snippet that omits its own import to satisfy a linter.
"web/docs-site/examples/**" = ["E402", "ANN"]
# --- Type-faithfulness gate (#303 Phase 1) --------------------------------
# Astral `ty` (preview). Originally scoped to the SHIPPED `laterite` package
# only; widened (lever 7 of laterite-dev#585) to also cover the repo's own `tools/` +
# `tests/` — a generator/tool bug (undeclared dep, lying annotation) is worth
# catching too, and ruff's checks (unused imports/vars) don't type-check
# return values the way `ty` does. Resolves polars/duckdb + the generated
# `_laterite_native.pyi` from the project venv, so it must run as
# `uv run ty check` (NOT `uvx`, which has no project deps). CI runs it beside
# `ruff check`; pairs with tests/test_free_chained_parity.py + the package's
# test_type_faithfulness.py which assert behaviour, not just declared types.
[tool.ty.src]
include = ["packages/laterite/python", "tools", "tests"]

[tool.ty.environment]
# Check against the wheel's real floor (abi3-py312 / requires-python >=3.12),
# NOT the dev env's 3.14 — so a 3.13+-only API leaking into shipped code is
# caught. This also applies to `tools/` + `tests/` even though those are
# dev-only and always run on the pinned 3.14 interpreter (.python-version) —
# a 3.13+-only stdlib API there is a false positive, not a real bug; prefer
# rewriting to a version-portable equivalent (e.g. `Path.open(newline=...)`
# over `Path.read_text(newline=...)`) rather than suppressing.
python-version = "3.12"

# --- Release version management -------------------------------------------
# `bump-my-version` stamps the release version across EVERY site in one command
# and rolls the CHANGELOG. LOCKSTEP: both wheels + the umbrella always share one
# version. Policy + workflow: RELEASING.md. Examples:
#   uv run bump-my-version bump patch        # docs / small fixes
#   uv run bump-my-version bump minor        # new feature OR (pre-1.0) a break
#   uv run bump-my-version bump --new-version 0.2.0rc1   # explicit pre-release
#   uv run bump-my-version bump minor --dry-run -v       # preview, no writes
[tool.bumpversion]
current_version = "0.11.0"
# Parse accepts PEP 440 canonical pre-releases (0.2.0rc1 / 0.2.0dev1, no hyphen
# — PyPI rejects hyphens) so an explicit `bump --new-version 0.2.0rc1` round-
# trips. `bump major|minor|patch` produces a FINAL release (e.g. 0.2.0); cut a
# pre-release explicitly with `--new-version`. (No auto-walking pre_l part — it
# would make a plain `bump minor` reset to 0.2.0dev0.)
parse = '(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<pre_l>rc|dev)(?P<pre_n>\d+))?'
serialize = [
    "{major}.{minor}.{patch}{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]
tag = true
tag_name = "v{new_version}"          # matches release.yml `tags: ["v*"]`
sign_tags = false
commit = true
message = "release: {new_version}"
allow_dirty = false

# wheel + umbrella [project] versions (lockstep)
[[tool.bumpversion.files]]
filename = "pyproject.toml"                  # umbrella workspace (drives uv.lock; not a wheel)
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "packages/laterite/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# compat/_impl.py: bump ONLY the laterite release prefix. The
# +compat.python-ags4.<pin> local segment + the banner's "python-ags4 1.2.0" are
# pinned independently (PYTHON_AGS4_COMPAT) and must NOT move on a version bump.
#
# These target the file BY PATH, so the 2026-08-12 reshape of `compat.py` into
# the `compat/` package had to move them in the same commit: bump-my-version
# hard-errors on a missing filename, which would have aborted the release stamp
# at the worst possible moment. `test_version_faithful.py` covers the values,
# not the paths — the paths are only exercised by an actual bump.
[[tool.bumpversion.files]]
filename = "packages/laterite/python/laterite/compat/_impl.py"
search = '__version__ = f"{current_version}+compat.python-ags4.'
replace = '__version__ = f"{new_version}+compat.python-ags4.'

[[tool.bumpversion.files]]
filename = "packages/laterite/python/laterite/compat/_impl.py"
search = "laterite {current_version} — compat:"
replace = "laterite {new_version} — compat:"

# COMPAT.md renders the two strings above as documentation — the `__version__`
# repr and the `Metadata.Checker` banner a user sees in their validation report.
# It was NOT stamped here, and `compat.py` was, so the page froze at 0.1.0 and
# stayed there for nine releases while the code moved: the doctest claimed
# '0.1.0+compat.python-ags4.1.2.0' against a wheel emitting '0.10.1+…'.
#
# Neither superseded-version gate in test_version_faithful.py could have caught
# it. One scans `examples/**/*.out`, the other the registry-shipped READMEs, and
# both work by matching versions listed in changelog.json — whose history starts
# at 0.6.0, so `0.1.0` is not in the set they look for at all. The positive
# assertion (doc == what the wheel emits) lives in tests/test_docs_snippets.py;
# these entries are the other half, keeping the page stamped on release.
#
# Three sites, two of them sharing the local-version segment (the doctest repr
# uses single quotes, the phase-1 illustration double) — so the search omits the
# quote and both are rewritten. As above, only the laterite release prefix moves;
# the +compat.python-ags4.<pin> segment is pinned independently.
[[tool.bumpversion.files]]
filename = "COMPAT.md"
search = "{current_version}+compat.python-ags4."
replace = "{new_version}+compat.python-ags4."

[[tool.bumpversion.files]]
filename = "COMPAT.md"
search = "laterite {current_version} — compat:"
replace = "laterite {new_version} — compat:"

[[tool.bumpversion.files]]
filename = "COMPAT.md"
search = "`{current_version}` — the laterite release."
replace = "`{new_version}` — the laterite release."

# CHANGELOG: NOT rolled by bump-my-version any more. The changelog is generated
# from `changelog.json` (the SSOT) by `tools/gen_changelog.py`; the release roll
# ([Unreleased] → a dated version) happens there via `--release`, which
# `tools/release/bump-version.sh` invokes with the new version. A `--check` CI
# gate keeps CHANGELOG.md in lock-step with the JSON. (The old text-substitution
# entries were removed here after the hand-maintained CHANGELOG.md was retired in
# favour of the generated one — leaving them made a bump abort on a missing file.)

# The Rust workspace is NO LONGER stamped here. It moved to its own config,
# `tools/release/engine-version.toml`, on 2026-08-01: the engine crates answer to
# `cargo add`, the products answer to `pip install` / `npm i`, and they move for
# different reasons. Driving both from this one number is what made a browser-only
# patch bump every surface — twice, producing wheel versions 0.8.1 and 0.8.2 that
# exist in git history and on no registry. `tools/release/bump-version.sh` now
# takes an explicit target; see `ags-wiki/design/dec-rust-api-crates-io.md`.
#
# FOUR Rust crates are stamped here, and the rule is one line: a crate that
# SHIPS AS A PRODUCT carries the number people install by, not the engine's.
# Each of these is a product wearing a crate; none is on crates.io.
#
#   laterite-cli         `lat`. It exists twice — this binary and the wheel's
#                        `lat` console script — and clap reads
#                        `CARGO_PKG_VERSION`, so on the engine line the two would
#                        report different numbers for the same command.
#   laterite-py          the wheel's native module. maturin takes the wheel
#                        version from packages/laterite/pyproject.toml, so this
#                        must not drift from it.
#   laterite-node        the npm `laterite` package. Its `version()` export is
#                        `CARGO_PKG_VERSION` — on the engine line it would report
#                        a number that is not the package you installed.
#   laterite-ags4-wasm   the npm `@laterite/ags4-wasm` package. wasm-pack writes
#                        the published manifest FROM this line and release.yml
#                        asserts `wasm-v<tag>` matches it, so on the engine line
#                        the first product-only release fails its own tag check.
#
# All four were left on `version.workspace = true` when the tiers split (#202),
# which was harmless only while the two numbers were equal.
[[tool.bumpversion.files]]
filename = "rust-packages/laterite-cli/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust-packages/laterite-py/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust-packages/laterite-node/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "rust-packages/laterite-ags4-wasm/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# The wasm README's usage example PRINTS the version — `version(); // "0.11.0"`
# — which makes it a version stamp in all but name, and it ships to npm where
# the page is permanent. Exactly the class `laterite-cli`'s doc-output step
# above exists for (`examples/wasm/ex01_init.mjs`, #243); this was the second
# instance and was not stamped, so `test_shipped_readmes_carry_no_superseded
# _version` failed the FIRST time a bump was attempted after it was written.
# Found by running `cut-release.sh` for real rather than by reading (#716).
[[tool.bumpversion.files]]
filename = "rust-packages/laterite-ags4-wasm/README.md"
search = 'version();                          // "{current_version}"'
replace = 'version();                          // "{new_version}"'

# Node / npm (`laterite`): unified onto the single version (#372) — only the
# package `version` is stamped now.
#
# The three `@laterite/native-*` optionalDeps used to be stamped here too, to
# stop the addon resolving a stale native at X-1. They are no longer in the
# committed manifest at all: `napi pre-publish` REGENERATES the whole
# optionalDependencies block at publish time from `napi.targets` and the package
# version, so the published pins cannot be stale — nothing here can make them
# more correct than the tool that writes them.
#
# Committing them cost a recurring breakage. bump-version.sh regenerates
# package-lock.json right after stamping, at which point version N is not on npm
# yet, so npm cannot resolve the pins and writes `{"optional": true}`
# placeholders. `npm ci` tolerates that while N is unpublished and starts failing
# the moment N publishes — main was broken exactly this way after 0.8.0 (#155).
# With no committed pins there is nothing unresolvable to lock.
#
# NOT stamped, by design: the generated napi loader `index.js` (refreshed by
# `napi build`; its version check is env-gated off, so a stale literal is
# inert), `package-lock.json` + the Rust/Python locks (regenerated by
# tools/release/bump-version.sh), and `web/src/wasm/package.json` (gitignored;
# wasm-pack regenerates it from the crate version). test_version_faithful.py
# gates the tracked set.
[[tool.bumpversion.files]]
filename = "rust-packages/laterite-node/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
